siadanie wyrażone przez partykułę egzystencjalną + לְ: לָא אִיתַי ... לְהוֹם „nie ma … dla nich” (hebr. אֵין לָהֶם חֵלֶק). אִיתַי = hebr. יֵשׁ (*ʾīṯ). חֲלָק „udział” (hebr. חֵלֶק). בַּעֲבַר־נַהֲרָה – „za rzeką” = satrapia Zarzecze (na zachód od Eufratu); בְּ z pataḥ przed ḥaṭef pataḥ.","R":"Greenspahn 4,4"},{"k":"A","n":5,"A":"כְּעַן יְדִיעַ דִּי יִנְתְּנוּן יְהוּדָיֵא בְּלוֹ לְמַלְכָּא׃","T":"kəʿan yədîaʿ dî yintənûn yəhûdāyē bəlô ləmalkā","P":"Teraz wiadomo, że Żydzi będą dawać królowi daninę.","N":"יְדִיעַ – G imiesłów bierny (qətîl) „wiadomy, znany” (hebr. יָדוּעַ, wzór qātûl); pataḥ furtivum pod ע. Zdanie nominalne + zdanie dopełnieniowe z דִּי „że”. יִנְתְּנוּן – G imperf. 3 m. l.mn. od נתן; n nie asymiluje się (hebr. יִתְּנוּ), końcówka -ûn (nunacja). Szyk w zdaniu podrzędnym: V–S–O.","R":"Greenspahn 4,5"},{"k":"A","n":6,"A":"רְחוּם כְּתַב דָּכְרָן דְּנָה׃","T":"rəḥûm kətab dokrān dənâ","P":"Rechum napisał ten memoriał (zapis).","N":"Szyk S–V–O. דָּכְרָן „memoriał, zapis” (kamec chatuf: dokrān) – od rdz. דכר = hebr. זכר (*ḏ: aram. ד – hebr. ז; por. hebr. זִכָּרוֹן). Zaimek דְּנָה stoi po rzeczowniku.","R":"Greenspahn 4,6"}],"5":[{"k":"A","n":1,"A":"כְּתַב בְּעֵל עָלְמָא אִגְּרָה לְמַלְכִין תַּקִּיפִין׃","T":"kətab bəʿēl ʿālmā ʾiggərâ ləmalkîn taqqîpîn","P":"Pan wieczności napisał list do potężnych królów.","N":"Szyk V–S–O. בְּעֵל עָלְמָא – połączenie konstrukcyjne: בְּעֵל (st. konstr. „pan”; hebr. בַּעַל) + עָלְמָא (st. emf. „wieczność”; hebr. עוֹלָם – przekształcenie kananejskie ā > ō). אִגְּרָה – st. absolutny (nieokreślony): „list”. לְמַלְכִין – לְ + l.mn. st. abs. (-īn, hebr. -îm). Przymiotnik תַּקִּיפִין (wzór qaṭṭîl) stoi po rzeczowniku i zgadza się z nim w rodzaju, liczbie i stanie.","R":"Greenspahn 5,1"},{"k":"A","n":2,"A":"אֲנַחְנָא בָּנַיִן בַּיִת בְּקִרְיְתָא מָרָדְתָּא׃","T":"ʾănaḥnā bānayin bayit bəqiryətā mārādtā","P":"My budujemy dom w buntowniczym mieście.","N":"Zaimek + imiesłów (בָּנַיִן, G imiesłów m. l.mn.) = czas teraźniejszy. בַּיִת – st. abs. (nieokreślony). Przymiotnik מָרָדְתָּא (r. ż., st. emf.) zgodny z קִרְיְתָא.","R":"Greenspahn 5,2"},{"k":"A","n":3,"A":"אֱדַיִן הִמּוֹ בַּטִּלוּ מִבְנֵה בִּירוּשְׁלֶם׃","T":"ʾĕdayin himmô baṭṭilû mibnē bîrûšəlem","P":"Wtedy oni powstrzymali budowę w Jerozolimie.","N":"אֱדַיִן „wtedy” (hebr. אָז). הִמּוֹ „oni” (hebr. הֵם, הֵמָּה). בַּטִּלוּ – D (paʿʿel) perf. 3 m. l.mn. od בטל: koniugacja D nadaje znaczenie przechodnie „powstrzymać, wstrzymać” (G בְּטֵל = „ustać”). מִבְנֵה – G bezokolicznik od בנה (prefiks מִ־) użyty jak rzeczownik: „budowanie, budowa” (hebr. לִבְנוֹת).","R":"Greenspahn 5,3"},{"k":"A","n":4,"A":"שִׂימוּ טְעֵם קֳדָם סָפְרָא מִן דִּי נִשְׁתְּוָנָא קֱרִי׃","T":"śîmû ṭəʿēm qŏdām sāprā min dî ništəwānā qĕrî","P":"Wydajcie dekret przed pisarzem, gdy (dosł. od kiedy) pismo zostało odczytane.","N":"שִׂימוּ טְעֵם – idiom „wydać dekret” (dosł. „położyć dekret”); שִׂימוּ – G imperatyw 2 m. l.mn. od שׂים. טְעֵם – „dekret” (hebr. טַעַם „smak, rozsądek”; wzór segolowy). קֳדָם „przed” (hebr. לִפְנֵי). מִן דִּי – spójnik czasowy „odkąd, gdy tylko”. נִשְׁתְּוָנָא – perskie słowo „pismo, list”. קֱרִי – G bierny (peʿil) perf. 3 m. l.poj. od קרא „został odczytany” (hebr. נִקְרָא).","R":"Greenspahn 5,4"},{"k":"A","n":5,"A":"כְּעַן לָא יִנְתְּנוּן עֲבִידָה עַל יְהוּדָיֵא׃","T":"kəʿan lā yintənûn ʿăbîdâ ʿal yəhûdāyē","P":"Teraz nie nałożą (dosł. nie dadzą) pracy na Żydów.","N":"כְּעַן „teraz” (hebr. עַתָּה). יִנְתְּנוּן – G imperf. 3 m. l.mn. od נתן (n nie asymiluje się; końcówka -ûn); podmiot nieokreślony („oni”). עֲבִידָה – st. abs. „praca, robota” (hebr. עֲבוֹדָה; ā > ō). עַל „na”. יְהוּדָיֵא – gentilicium l.mn., st. emf. „Żydzi, Judejczycy”.","R":"Greenspahn 5,5"},{"k":"A","n":6,"A":"מַלְכַיָּא תַּקִּיפַיָּא אֲזַלוּ עַל קִרְיְתָא׃","T":"malkayyā taqqîpayyā ʾăzalû ʿal qiryətā","P":"Potężni królowie poszli przeciw miastu.","N":"Szyk S–V. מַלְכַיָּא, תַּקִּיפַיָּא – l.mn. m., st. emf. (końcówka -ayyā); przymiotnik zgodny z rzeczownikiem. אֲזַלוּ – G perf. 3 m. l.mn. od אזל „iść” (hebr. używa innego rdzenia: הָלְכוּ). עַל „przeciw, na”.","R":"Greenspahn 5,6"},{"k":"A","n":7,"A":"טְעֵם אֱלָהָא קֱרִי קֳדָם בְּעֵל׃","T":"ṭəʿēm ʾĕlāhā qĕrî qŏdām bəʿēl","P":"Dekret Boga został odczytany przed panem.","N":"טְעֵם אֱלָהָא – połączenie konstrukcyjne „dekret Boga” (cały wyraz określony przez ostatni człon). קֱרִי – G bierny (peʿil) perf. 3 m. l.poj. „został odczytany”. בְּעֵל – st. abs. „pan, właściciel” (nieokreślony).","R":"Greenspahn 5,7"},{"k":"A","n":8,"A":"אֱדַיִן אֲמַר שִׁמְשַׁי לְבַטָּלָה מִבְנֵה בַּיְתָא דְּנָה׃","T":"ʾĕdayin ʾămar šimšay ləbaṭṭālâ mibnē baytā dənâ","P":"Wtedy Szimszaj powiedział, aby wstrzymać budowę tego domu.","N":"Szyk V–S. אֲמַר + bezokolicznik z לְ = „powiedział, aby…” (w praktyce: polecił). לְבַטָּלָה – לְ + D (paʿʿel) bezokolicznik od בטל (wzór qaṭṭālâ) „wstrzymać”. מִבְנֵה בַּיְתָא דְּנָה – „budowę tego domu”: bezokolicznik G w st. konstr. + rzeczownik z zaimkiem wskazującym.","R":"Greenspahn 5,8"},{"k":"A","n":9,"A":"הִמּוֹ עֲבַדוּ מְרַד בִּירוּשְׁלֶם׃","T":"himmô ʿăbadû mərad bîrûšəlem","P":"Oni uczynili (wzniecili) bunt w Jerozolimie.","N":"עֲבַדוּ – G perf. 3 m. l.mn. od עבד „czynić” (nie „służyć” jak w hebr.). מְרַד „bunt” – st. abs.; hebr. מֶרֶד (wzór segolowy: aram. CəCaC – hebr. CeCeC).","R":"Greenspahn 5,9"},{"k":"A","n":10,"A":"שִׂימוּ שְׁלָם לְהוֹם מִן עָלְמָא׃","T":"śîmû šəlām ləhôm min ʿālmā","P":"Ustanówcie (dosł. połóżcie) dla nich pokój od wieczności.","N":"שִׂימוּ – G imperatyw 2 m. l.mn. od שׂים „kłaść, ustanawiać”. שְׁלָם „pokój” (hebr. שָׁלוֹם: brak przekształcenia kananejskiego + redukcja pretoniczna). מִן עָלְמָא „od wieczności, odwiecznie”.","R":"Greenspahn 5,10"},{"k":"A","n":11,"A":"אֲנַחְנָא מְהוֹדְעִין לְסָפְרָא דִּי בְּטֵלַת עֲבִידַת בַּיְתָא דִּי מַלְכָּא׃","T":"ʾănaḥnā məhôdəʿîn ləsāprā dî bəṭēlat ʿăbîdat baytā dî malkā","P":"Oznajmiamy pisarzowi, że ustała praca przy domu króla.","N":"מְהוֹדְעִין – H (hafʿel) imiesłów m. l.mn. od ידע „oznajmiać” (pierwotne w > ô); z zaimkiem = czas teraźniejszy. דִּי „że”. בְּטֵלַת – G perf. 3 ż. l.poj. od בטל „ustać” (czasownik stanowy, wzór qətēl), zgodny z עֲבִידַת (r. ż.). עֲבִידַת בַּיְתָא – st. konstr. (-at) + st. emf. דִּי מַלְכָּא – dopełniacz analityczny z דִּי „(dom) króla”.","R":"Greenspahn 5,11"}],"6":[{"k":"A","n":1,"Z":"יְהוּדָיֵא בָּנַיִן בֵּית ______ (of a king)","A":"יְהֻדָיֵא בָּנַיִן בֵּית מֶלֶךְ׃","T":"yəhudāyē bānayin bêt melek","P":"Żydzi budują dom króla.","N":"Ćwiczenie z luką: „(of a king)” = מֶלֶךְ – st. abs., bo król jest nieokreślony (dosł. „dom [jakiegoś] króla”). בֵּית – st. konstr. od בַּיִת (ay > ê, jak hebr. בֵּית). Gdyby król był określony: בֵּית מַלְכָּא. Forma jak w podręczniku: יְהֻדָיֵא (pisownia defektywna; zwykle יְהוּדָיֵא).","R":"Greenspahn 6,1"},{"k":"A","n":2,"Z":"______ (scribe) דְּנָה כְּתַב אִגְּרָה","A":"סָפְרָא דְּנָה כְּתַב אִגְּרָה׃","T":"sāprā dənâ kətab ʾiggərâ","P":"Ten pisarz napisał list.","N":"Ćwiczenie z luką: „(scribe)” – po rzeczowniku stoi zaimek דְּנָה, więc rzeczownik musi być w stanie emfatycznym: סָפְרָא (st. abs. סָפַר). Por. hebr. הַסּוֹפֵר הַזֶּה.","R":"Greenspahn 6,2"},{"k":"A","n":3,"Z":"______ (the names of) גֻּבְרַיָּא","A":"שְׁמָהָת גֻּבְרַיָּא","T":"šəmāhāt gubrayyā","P":"imiona mężów","N":"Ćwiczenie z luką: „(the names of)” = שְׁמָהָת – l.mn., st. konstr. od שֻׁם „imię” (l.mn. z końcówką żeńską -āt i dodanym ה; hebr. שְׁמוֹת). גֻּבְרַיָּא – l.mn., st. emf. od גְּבַר „mąż, człowiek”.","R":"Greenspahn 6,3"},{"k":"E","n":1,"E":"The scribe wrote the names of the men.","Q":"Pisarz napisał imiona mężów.","A":"סָפְרָא כְּתַב שְׁמָהָת גֻּבְרַיָּא׃","T":"sāprā kətab šəmāhāt gubrayyā","N":"„The scribe” – st. emf. סָפְרָא. „the names of the men” – połączenie konstrukcyjne: שְׁמָהָת (st. konstr. l.mn.) + גֻּבְרַיָּא (st. emf.).","R":"Greenspahn 6 – na aramejski, 1"},{"k":"E","n":2,"E":"The prophets of Israel arose before the kings.","Q":"Prorocy Izraela powstali przed królami.","A":"נְבִיאֵי יִשְׂרָאֵל קָמוּ קֳדָם מַלְכַיָּא׃","T":"nəbîʾê yiśrāʾēl qāmû qŏdām malkayyā","N":"נְבִיאֵי – l.mn., st. konstr. od נְבִיא (-ê). קָמוּ – G perf. 3 m. l.mn. od קום (jak hebr. קָמוּ). קֳדָם „przed”. מַלְכַיָּא – l.mn., st. emf.","R":"Greenspahn 6 – na aramejski, 2"},{"k":"E","n":3,"E":"They sent the letter to Trans-Euphrates.","Q":"Wysłali list do Zarzecza.","A":"שְׁלַחוּ אִגַּרְתָּא לַעֲבַר־נַהֲרָה׃","T":"šəlaḥû ʾiggartā laʿăbar-nahărâ","N":"שְׁלַחוּ – G perf. 3 m. l.mn. „the letter” – st. emf. אִגַּרְתָּא. לַעֲבַר־נַהֲרָה – לְ (z pataḥ przed ḥaṭef pataḥ) + nazwa satrapii.","R":"Greenspahn 6 – na aramejski, 3"},{"k":"E","n":4,"E":"God came to Israel.","Q":"Bóg przyszedł do Izraela.","A":"אֱלָהָא אֲתָא לְיִשְׂרָאֵל׃","T":"ʾĕlāhā ʾătā ləyiśrāʾēl","N":"אֲתָא – G perf. 3 m. l.poj. od אתי „przyjść” (hebr. אָתָה – poet.; zwykle בָּא). Kierunek wyrażony przez לְ (można też עַל, por. Ezd 5,3 אֲתָא עֲלֵיהוֹן).","R":"Greenspahn 6 – na aramejski, 4"},{"k":"E","n":5,"E":"They are building the city of Jerusalem.","Q":"Oni budują miasto Jerozolimę.","A":"הִמּוֹ בָּנַיִן קִרְיַת יְרוּשְׁלֶם׃","T":"himmô bānayin qiryat yərûšəlem","N":"Zaimek + imiesłów G m. l.mn. = czas teraźniejszy. קִרְיַת – st. konstr. od קִרְיָה (-at) w połączeniu z nazwą własną: „miasto Jerozolima”.","R":"Greenspahn 6 – na aramejski, 5"},{"k":"E","n":6,"E":"A master issued a decree.","Q":"Pan wydał dekret.","A":"בְּעֵל שָׂם טְעֵם׃","T":"bəʿēl śām ṭəʿēm","N":"Rzeczowniki nieokreślone – st. absolutny (בְּעֵל, טְעֵם). שָׂם טְעֵם – idiom „wydać dekret”; שָׂם – G perf. 3 m. l.poj. od שׂים.","R":"Greenspahn 6 – na aramejski, 6"},{"k":"E","n":7,"E":"We informed the men of the city.","Q":"Powiadomiliśmy mężów miasta.","A":"הוֹדַעְנָא לְגֻבְרֵי קִרְיְתָא׃","T":"hôdaʿnā ləgubrê qiryətā","N":"הוֹדַעְנָא – H (hafʿel) perf. 1 l.mn. od ידע (por. Ezd 4,14 וְהוֹדַעְנָא לְמַלְכָּא). Osoba powiadamiana wprowadzona przez לְ. גֻּבְרֵי – l.mn., st. konstr. od גְּבַר.","R":"Greenspahn 6 – na aramejski, 7"},{"k":"E","n":8,"E":"Who are the governors of Judah and Samaria?","Q":"Kim są namiestnicy Judy i Samarii?","A":"מַן פַּחֲוָת יְהוּד וְשָׁמְרָיִן?","T":"man paḥăwāt yəhûd wəšāmərāyin","N":"Zdanie nominalne pytające: מַן „kto” (hebr. מִי) + orzecznik. פַּחֲוָת – l.mn., st. konstr. od פֶּחָה „namiestnik” (por. det. פַּחֲוָתָא, Dn 3,2). יְהוּד – aram. nazwa prowincji Judy.","R":"Greenspahn 6 – na aramejski, 8"}],"7":[{"k":"E","n":1,"E":"We went to the great province.","Q":"Poszliśmy do wielkiej prowincji.","A":"אֲזַלְנָא לִמְדִינְתָּא רַבְּתָא׃","T":"ʾăzalnā limdîntā rabbətā","N":"אֲזַלְנָא – G perf. 1 l.mn. od אזל „iść” (por. Ezd 5,8 אֲזַלְנָא לִיהוּד מְדִינְתָּא). Przymiotnik רַבְּתָא (r. ż., st. emf. od רַב) zgodny z מְדִינְתָּא.","R":"Greenspahn 7 – na aramejski, 1"},{"k":"E","n":2,"E":"They sent a letter to the house and to the men inside it.","Q":"Wysłali list do domu i do mężów, którzy [są] w nim.","A":"שְׁלַחוּ אִגְּרָה לְבַיְתָא וּלְגֻבְרַיָּא דִּי בְגַוֵּהּ׃","T":"šəlaḥû ʾiggərâ ləbaytā ûləgubrayyā dî bəgawwēh","N":"„a letter” – st. abs. אִגְּרָה. דִּי בְגַוֵּהּ – zdanie względne bez czasownika „którzy w jego środku” (בְּ + גַּו + sufiks 3 m. l.poj.; por. Ezd 5,7 כְּתִיב בְּגַוֵּהּ).","R":"Greenspahn 7 – na aramejski, 2"},{"k":"E","n":3,"E":"Now Darius is the head of those elders.","Q":"Teraz Dariusz jest głową (przywódcą) tamtych starszych.","A":"כְּעַן דָּרְיָוֶשׁ רֵאשׁ שָׂבַיָּא אִלֵּךְ׃","T":"kəʿan dāryāweš rēʾš śābayyā ʾillēk","N":"Zdanie nominalne bez czasownika „być”. רֵאשׁ – st. konstr. „głowa” (hebr. רֹאשׁ, ā > ō). שָׂבַיָּא – l.mn., st. emf. od שָׂב „starszy”. אִלֵּךְ – zaimek wskazujący (odległy) l.mn. „tamci” (por. Ezd 5,9 לְשָׂבַיָּא אִלֵּךְ).","R":"Greenspahn 7 – na aramejski, 3"},{"k":"E","n":4,"E":"The elders say that the decree is known to them.","Q":"Starsi mówią, że dekret jest im znany.","A":"שָׂבַיָּא אָמְרִין דִּי טַעְמָא יְדִיעַ לְהוֹם׃","T":"śābayyā ʾāmərîn dî ṭaʿmā yədîaʿ ləhôm","N":"אָמְרִין – G imiesłów czynny m. l.mn. (czas teraźniejszy). טַעְמָא – st. emf. od טְעֵם (pierwotny wzór *ṭaʿm wraca przed końcówką). יְדִיעַ – G imiesłów bierny „znany”; zdanie nominalne po דִּי.","R":"Greenspahn 7 – na aramejski, 4"},{"k":"E","n":5,"E":"Let peace be over Jerusalem.","Q":"Niech pokój będzie nad Jerozolimą.","A":"שְׁלָם לֶהֱוֵא עַל יְרוּשְׁלֶם׃","T":"šəlām lehĕwē ʿal yərûšəlem","N":"לֶהֱוֵא – G imperf./jussiw 3 m. l.poj. od הוה z prefiksem ל־ (cecha aram. biblijnego; por. יְדִיעַ לֶהֱוֵא). שְׁלָם – „pokój” (hebr. שָׁלוֹם).","R":"Greenspahn 7 – na aramejski, 5"},{"k":"E","n":6,"E":"Everything is written.","Q":"Wszystko jest napisane.","A":"כֹּלָּא כְּתִיב׃","T":"kōllā kətîb","N":"כֹּלָּא – st. emf. od כֹּל „wszystko” (por. Ezd 5,7). כְּתִיב – G imiesłów bierny (qətîl) „napisany” (hebr. כָּתוּב). Zdanie nominalne.","R":"Greenspahn 7 – na aramejski, 6"}],"8":[{"k":"A","n":1,"A":"אֲזַל מַלְכָּא קֳדָם קִרְיְתָא׃","T":"ʾăzal malkā qŏdām qiryətā","P":"Król poszedł przed miasto.","N":"Szyk V–S. אֲזַל – G perf. 3 m. l.poj. „iść” (hebr. הָלַךְ). קֳדָם „przed” (miejscowo).","R":"Greenspahn 8,1"},{"k":"A","n":2,"A":"אֲנַחְנָה יְדַעְנָא דִּי בְּעֵל עָלְמָא בִּירוּשְׁלֶם׃","T":"ʾănaḥnâ yədaʿnā dî bəʿēl ʿālmā bîrûšəlem","P":"My wiemy (dowiedzieliśmy się), że Pan wieczności [jest] w Jerozolimie.","N":"יְדַעְנָא – G perf. 1 l.mn. od ידע (końcówka -nā; hebr. -nû: יָדַעְנוּ); perfectum czasowników poznania często oddaje się czasem teraźniejszym („wiemy”). Zaimek אֲנַחְנָה dla emfazy. Po דִּי zdanie nominalne.","R":"Greenspahn 8,2"},{"k":"A","n":3,"A":"כִּתְבֵת אִגְּרָה עַל בֵּית מַלְכָּא׃","T":"kitbēt ʾiggərâ ʿal bêt malkā","P":"Napisałem list o domu króla.","N":"כִּתְבֵת – G perf. 1 l.poj. (-ēt; hebr. כָּתַבְתִּי); i pod pierwszą spółgłoską, bo dwie szwy na początku są niemożliwe. עַל „o, w sprawie” (albo „przeciw”). בֵּית מַלְכָּא – st. konstr. + st. emf.","R":"Greenspahn 8,3"},{"k":"A","n":4,"A":"אֱדַיִן שְׁלַח אֱלָהָא טְעֵם עַל מְדִינְתָּא דָּךְ׃","T":"ʾĕdayin šəlaḥ ʾĕlāhā ṭəʿēm ʿal mədîntā dāk","P":"Wtedy Bóg posłał dekret na tę prowincję.","N":"Szyk V–S–O. טְעֵם – st. abs. „dekret”. מְדִינְתָּא דָּךְ – rzeczownik r. ż. w st. emf. + zaimek wskazujący r. ż. דָּךְ.","R":"Greenspahn 8,4"},{"k":"A","n":5,"A":"יְהַבְתְּ עַבְדִין שַׂגִּיאִין לְפַחַת יְהוּדָיֵא׃","T":"yəhabt ʿabdîn śaggîʾîn ləpaḥat yəhûdāyē","P":"Dałeś wielu sług namiestnikowi Żydów.","N":"יְהַבְתְּ – G perf. 2 m. l.poj. od יהב „dać” (hebr. נָתַתָּ – inny rdzeń). עַבְדִין – l.mn. st. abs. od עֲבֵד. שַׂגִּיאִין – przymiotnik „liczni” (por. hebr. שַׂגִּיא). פַּחַת – st. konstr. od פֶּחָה.","R":"Greenspahn 8,5"},{"k":"A","n":6,"A":"אֲבָהֳתַנָא יְהַבוּ מָאְנַיָּא אִלֵּךְ לְכוֹרֶשׁ׃","T":"ʾăbāhŏtanā yəhabû māʾnayyā ʾillēk ləkôreš","P":"Nasi ojcowie dali te naczynia Cyrusowi.","N":"אֲבָהֳתַנָא – l.mn. od אַב (z ה i końcówką -āt) + sufiks 1 l.mn. -anā (hebr. אֲבוֹתֵינוּ). יְהַבוּ – G perf. 3 m. l.mn. מָאנַיָּא אִלֵּךְ – l.mn. st. emf. + zaimek „tamte”. Forma jak w podręczniku: מָאְנַיָּא (ze szwą pod א; w Biblii zwykle מָאנַיָּא).","R":"Greenspahn 8,6"},{"k":"A","n":7,"A":"רֵאשׁ הֵיכְלָא הֲוָא בִּשְׁמַיָּא׃","T":"rēʾš hêkəlā hăwā bišmayyā","P":"Szczyt (dosł. głowa) świątyni był w niebiosach.","N":"רֵאשׁ הֵיכְלָא – st. konstr. + st. emf. הֲוָא – G perf. 3 m. l.poj. od הוה „być” (hebr. הָיָה). בִּשְׁמַיָּא – בְּ + st. emf.","R":"Greenspahn 8,7"},{"k":"A","n":8,"A":"נְבוּכַדְנֶצַּר לָא הַנְפֵּק גֻּבְרַיָּא לְאַרְעָא׃","T":"nəbûkadneṣṣar lā hanpēq gubrayyā ləʾarʿā","P":"Nabuchodonozor nie wyprowadził mężów do kraju.","N":"Szyk S–V–O. הַנְפֵּק – H (hafʿel) perf. 3 m. l.poj. od נפק „wyprowadzić” – n zachowane (dysymilacja zamiast asymilacji; hebr. הוֹצִיא od יצא). לְאַרְעָא „do ziemi, do kraju”.","R":"Greenspahn 8,8"},{"k":"A","n":9,"A":"בַּיְתָא רַבָּא דֵּךְ יִתְבְּנֵה בִּשְׁנָה חֲדָה׃","T":"baytā rabbā dēk yitbənē bišnâ ḥădâ","P":"Ten wielki dom zostanie zbudowany w ciągu jednego roku.","N":"Szyk S–V. Przymiotnik רַבָּא i zaimek דֵּךְ (m. l.poj.) stoją po rzeczowniku. יִתְבְּנֵה – Gt (hitpeʿel) imperf. 3 m. l.poj. od בנה – strona bierna (hebr. יִבָּנֶה, nifal). בִּשְׁנָה חֲדָה – „w jednym roku”; חֲדָה – liczebnik r. ż. (hebr. אַחַת).","R":"Greenspahn 8,9"}],"9":[{"k":"A","n":1,"A":"נְבוּכַדְנֶצַּר אָמַר דִּי קִרְיְתָא תִּתְיְהִב לִיהוּדָאִין׃","T":"nəbûkadneṣṣar ʾāmar dî qiryətā tityəhib lîhûdāʾîn","P":"Nabuchodonozor mówi, że miasto zostanie dane Żydom.","N":"אָמַר – G imiesłów czynny m. l.poj. (forma *ʾāmēr przed ר zmienia ē w a; nie mylić z hebr. perf. אָמַר) – „mówi”. תִּתְיְהִב – Gt (hitpeʿel) imperf. 3 ż. l.poj. od יהב „zostanie dane” (zgodne z קִרְיְתָא, r. ż.). לִיהוּדָאִין – לְ + gentilicium l.mn. st. abs. (lə + yə > lî).","R":"Greenspahn 9,1"},{"k":"A","n":2,"A":"מְגִלָּה רַבָּה שְׁלִיחָה לְפַחַת מְדִנְתָּא׃","T":"məgillâ rabbâ šəlîḥâ ləpaḥat mədintā","P":"Wielki zwój jest wysłany do namiestnika prowincji.","N":"Zdanie nominalne z imiesłowem biernym jako orzecznikiem. רַבָּה, שְׁלִיחָה – formy r. ż. st. abs. zgodne z מְגִלָּה. שְׁלִיחָה – G imiesłów bierny (qətîl) ż. l.poj. od שׁלח (hebr. שְׁלוּחָה). פַּחַת מְדִינְתָּא – st. konstr. + st. emf. Forma jak w podręczniku: מְדִנְתָּא (pisownia defektywna; zwykle מְדִינְתָּא).","R":"Greenspahn 9,2"},{"k":"A","n":3,"A":"מַלְכָּא יְדַע דִּי עֲבִידָה בָּטְלָה׃","T":"malkā yədaʿ dî ʿăbîdâ bāṭəlâ","P":"Król wie (dowiedział się), że praca ustaje.","N":"יְדַע – G perf. 3 m. l.poj. (imiesłów brzmiałby יָדַע). בָּטְלָה – G imiesłów czynny ż. l.poj. od בטל „ustawać” (zgodny z עֲבִידָה, r. ż.) – czynność trwająca.","R":"Greenspahn 9,3"},{"k":"A","n":4,"A":"אֲנַחְנָה יָדְעִין לְמִבְנֵה בַּיְתָא דְּנָה׃","T":"ʾănaḥnâ yādəʿîn ləmibnē baytā dənâ","P":"Umiemy (dosł. wiemy, [jak]) zbudować ten dom.","N":"Zaimek + imiesłów G m. l.mn. (יָדְעִין) = czas teraźniejszy. יְדַע + bezokolicznik z לְ = „umieć coś zrobić”. לְמִבְנֵה – לְ + G bezokolicznik od בנה (prefiks מִ־).","R":"Greenspahn 9,4"},{"k":"A","n":5,"A":"אִיתַי דְּהַב בְּבֵית גִּנְזַיָּא תַּמָּה בְּבָבֶל׃","T":"ʾîtay dəhab bəbêt ginzayyā tammâ bəbābel","P":"Jest złoto w skarbcu, tam w Babilonie.","N":"אִיתַי – „jest, istnieje” (hebr. יֵשׁ). דְּהַב „złoto” (hebr. זָהָב; *ḏ: ד ~ ז). בֵּית גִּנְזַיָּא – „dom skarbów” = skarbiec (גִּנְזַיָּא – perskie, l.mn. st. emf.). תַּמָּה „tam” (hebr. שָׁם; *ṯ: ת ~ שׁ). Por. Ezd 5,17.","R":"Greenspahn 9,5"},{"k":"A","n":6,"A":"גֻּבְרַיָּא בַּקַּרוּ הֵן כְּסַף טָב יְהִיב לְסָפְרָא׃","T":"gubrayyā baqqarû hēn kəsap ṭāb yəhîb ləsāprā","P":"Mężowie zbadali, czy dobre srebro zostało dane pisarzowi.","N":"בַּקַּרוּ – D (paʿʿel) perf. 3 m. l.mn. od בקר „badać, przeszukiwać”. הֵן – tu „czy” (pytanie zależne; por. Ezd 5,17). כְּסַף טָב – rzeczownik + przymiotnik, st. abs. (hebr. כֶּסֶף טוֹב). יְהִיב – G imiesłów bierny m. l.poj. od יהב „dany”.","R":"Greenspahn 9,6"},{"k":"E","n":1,"E":"The men rose up against them.","Q":"Mężowie powstali przeciw nim.","A":"גֻּבְרַיָּא קָמוּ עֲלֵיהוֹן׃","T":"gubrayyā qāmû ʿălêhôn","N":"קָמוּ – G perf. 3 m. l.mn. od קום. עֲלֵיהוֹן – עַל + sufiks 3 m. l.mn. „przeciw nim” (por. Ezd 5,1).","R":"Greenspahn 9 – na aramejski, 1"},{"k":"E","n":2,"E":"Who sent the silver and the gold from Trans-Euphrates?","Q":"Kto wysłał srebro i złoto z Zarzecza?","A":"מַן שְׁלַח כַּסְפָּא וְדַהֲבָא מִן עֲבַר־נַהֲרָה?","T":"man šəlaḥ kaspā wədahăbā min ʿăbar-nahărâ","N":"מַן „kto”. כַּסְפָּא, דַּהֲבָא – st. emf. (określone: „to srebro i to złoto”); w כַּסְפָּא wraca pierwotny wzór *kasp-.","R":"Greenspahn 9 – na aramejski, 2"},{"k":"E","n":3,"E":"There is a governor inside Jerusalem.","Q":"Jest namiestnik w Jerozolimie.","A":"אִיתַי פֶּחָה בְּגוֹא יְרוּשְׁלֶם׃","T":"ʾîtay peḥâ bəgôʾ yərûšəlem","N":"אִיתַי + podmiot nieokreślony (st. abs. פֶּחָה). בְּגוֹא „wewnątrz, pośrodku” (por. Dn 3,25 בְּגוֹא נוּרָא).","R":"Greenspahn 9 – na aramejski, 3"},{"k":"E","n":4,"E":"We gave the house to them.","Q":"Daliśmy im dom.","A":"יְהַבְנָא בַּיְתָא לְהוֹם׃","T":"yəhabnā baytā ləhôm","N":"יְהַבְנָא – G perf. 1 l.mn. od יהב. „the house” – st. emf. בַּיְתָא.","R":"Greenspahn 9 – na aramejski, 4"},{"k":"E","n":5,"E":"The scribe went to the city.","Q":"Pisarz poszedł do miasta.","A":"סָפְרָא אֲזַל לְקִרְיְתָא׃","T":"sāprā ʾăzal ləqiryətā","N":"אֲזַל – G perf. 3 m. l.poj. „iść”. Kierunek: לְ + st. emf.","R":"Greenspahn 9 – na aramejski, 5"}],"10":[{"k":"E","n":1,"E":"The treasures are far from the dunghill.","Q":"Skarby są daleko od gnojowiska.","A":"גִּנְזַיָּא רַחִיקִין מִן נְוָלוּ׃","T":"ginzayyā raḥîqîn min nəwālû","N":"Zdanie nominalne: podmiot גִּנְזַיָּא (l.mn. st. emf.) + przymiotnik orzecznikowy רַחִיקִין (m. l.mn. st. abs.; por. Ezd 6,6 רַחִיקִין הֲווֹ מִן־תַּמָּה). נְוָלוּ „gnojowisko, rumowisko” (Ezd 6,11).","R":"Greenspahn 10 – na aramejski, 1"},{"k":"E","n":2,"E":"I wrote a letter to the scribes.","Q":"Napisałem list do pisarzy.","A":"כִּתְבֵת אִגְּרָה לְסָפְרַיָּא׃","T":"kitbēt ʾiggərâ ləsāprayyā","N":"כִּתְבֵת – G perf. 1 l.poj. סָפְרַיָּא – l.mn., st. emf. od סָפַר.","R":"Greenspahn 10 – na aramejski, 2"},{"k":"E","n":3,"E":"He sent God’s message to the city.","Q":"Posłał wiadomość Boga do miasta.","A":"שְׁלַח פִּתְגָם אֱלָהָא לְקִרְיְתָא׃","T":"šəlaḥ pitgām ʾĕlāhā ləqiryətā","N":"פִּתְגָם אֱלָהָא – połączenie konstrukcyjne „słowo/wiadomość Boga” (פִּתְגָם – zapożyczenie perskie). Można też analitycznie: פִּתְגָמָא דִּי אֱלָהָא.","R":"Greenspahn 10 – na aramejski, 3"},{"k":"E","n":4,"E":"The head of the province is a man.","Q":"Głowa (przywódca) prowincji jest człowiekiem.","A":"רֵאשׁ מְדִינְתָּא גְּבַר׃","T":"rēʾš mədîntā gəbar","N":"Zdanie nominalne bez czasownika „być”: podmiot רֵאשׁ מְדִינְתָּא – orzecznik גְּבַר (st. abs.).","R":"Greenspahn 10 – na aramejski, 4"},{"k":"E","n":5,"E":"Leave everything there.","Q":"Zostawcie tam wszystko.","A":"שְׁבֻקוּ כֹּלָּא תַּמָּה׃","T":"šəbuqû kōllā tammâ","N":"שְׁבֻקוּ – G imperatyw 2 m. l.mn. od שׁבק „zostawić” (por. Ezd 6,7; Mk 15,34 σαβαχθανι). כֹּלָּא „wszystko”. תַּמָּה „tam”.","R":"Greenspahn 10 – na aramejski, 5"},{"k":"E","n":6,"E":"They are praying to God to destroy the earth.","Q":"Oni modlą się do Boga, aby zniszczył ziemię.","A":"מְצַלַּיִן קֳדָם אֱלָהָא לְחַבָּלָה אַרְעָא׃","T":"məṣallayin qŏdām ʾĕlāhā ləḥabbālâ ʾarʿā","N":"מְצַלַּיִן – D (paʿʿel) imiesłów m. l.mn. od צלי „modlić się” (por. Ezd 6,10); modlitwa „przed Bogiem” – קֳדָם (Dn 6,11). לְחַבָּלָה – D bezokolicznik od חבל „zniszczyć” (Ezd 6,12).","R":"Greenspahn 10 – na aramejski, 6"}],"11":[{"k":"A","n":1,"Z":"______ דְּבַחְתְּ תּוֹר לֵאלָהָא","A":"אַנְתְּ דְּבַחְתְּ תּוֹר לֵאלָהָא׃","T":"ʾant dəbaḥt tôr lēʾlāhā","P":"Ty złożyłeś Bogu wołu w ofierze.","N":"Uzupełnienie: forma דְּבַחְתְּ to G perf. 2 m. l.poj. → zaimek אַנְתְּ „ty” (hebr. אַתָּה; w aram. n zachowane). תּוֹר „wół” (hebr. שׁוֹר; *ṯ: ת ~ שׁ). לֵאלָהָא – לְ + אֱלָהָא (lə + ʾĕ > lē).","R":"Greenspahn 11,1"},{"k":"A","n":2,"Z":"______ יְדַע דִּי שָׂבַיָּא בִּמְדִינְתָּא","A":"הוּא יְדַע דִּי שָׂבַיָּא בִּמְדִינְתָּא׃","T":"hûʾ yədaʿ dî śābayyā bimdîntā","P":"On wie, że starsi [są] w prowincji.","N":"Uzupełnienie: יְדַע – G perf. 3 m. l.poj. → zaimek הוּא „on”. Po דִּי zdanie nominalne.","R":"Greenspahn 11,2"},{"k":"A","n":3,"Z":"______ יְהַבְתֵּן סִפְרָא לְפֶחָה","A":"אַנְתֵּן יְהַבְתֵּן סִפְרָא לְפֶחָה׃","T":"ʾantēn yəhabtēn siprā ləpeḥâ","P":"Wy (kobiety) dałyście księgę namiestnikowi.","N":"Uzupełnienie: יְהַבְתֵּן – G perf. 2 ż. l.mn. → zaimek אַנְתֵּן „wy (ż.)” (w tabeli Greenspahna; hebr. אַתֵּן). סִפְרָא – st. emf. od סְפַר „księga”.","R":"Greenspahn 11,3"},{"k":"A","n":4,"Z":"______ כְּתַבְתּוּן אִגְּרָה","A":"אַנְתּוּן כְּתַבְתּוּן אִגְּרָה׃","T":"ʾantûn kətabtûn ʾiggərâ","P":"Wy napisaliście list.","N":"Uzupełnienie: כְּתַבְתּוּן – G perf. 2 m. l.mn. → zaimek אַנְתּוּן „wy” (hebr. אַתֶּם; nunacja -ûn).","R":"Greenspahn 11,4"},{"k":"A","n":5,"Z":"______ נְפַלוּ לְאַרְעָא","A":"הִמּוֹ נְפַלוּ לְאַרְעָא׃","T":"himmô nəpalû ləʾarʿā","P":"Oni upadli na ziemię.","N":"Uzupełnienie: נְפַלוּ – G perf. 3 m. l.mn. → zaimek הִמּוֹ (także הִמּוֹן albo אִנּוּן) „oni”.","R":"Greenspahn 11,5"},{"k":"A","n":6,"Z":"______ נְפַקְנָא מִבַּיְתָא","A":"אֲנַחְנָה נְפַקְנָא מִבַּיְתָא׃","T":"ʾănaḥnâ nəpaqnā mibbaytā","P":"My wyszliśmy z domu.","N":"Uzupełnienie: נְפַקְנָא – G perf. 1 l.mn. → zaimek אֲנַחְנָה „my”. מִבַּיְתָא – מִן z asymilowanym n (podwojenie ב).","R":"Greenspahn 11,6"},{"k":"A","n":7,"Z":"______ פִּלְחַת בִּירוּשְׁלֶם","A":"הִיא פִּלְחַת בִּירוּשְׁלֶם׃","T":"hîʾ pilḥat bîrûšəlem","P":"Ona służyła (oddawała cześć) w Jerozolimie.","N":"Uzupełnienie: פִּלְחַת – G perf. 3 ż. l.poj. od פלח „służyć, czcić” → zaimek הִיא „ona”.","R":"Greenspahn 11,7"},{"k":"A","n":8,"Z":"______ שָׂם טְעֵם","A":"הוּא שָׂם טְעֵם׃","T":"hûʾ śām ṭəʿēm","P":"On wydał dekret.","N":"Uzupełnienie: שָׂם – G perf. 3 m. l.poj. od שׂים → zaimek הוּא „on”. שָׂם טְעֵם „wydać dekret”.","R":"Greenspahn 11,8"},{"k":"A","n":9,"Z":"______ שְׁלַחְתִּי פִּתְגָם לְבָבֶל","A":"אַנְתִּי שְׁלַחְתִּי פִּתְגָם לְבָבֶל׃","T":"ʾantî šəlaḥtî pitgām ləbābel","P":"Ty (kobieto) wysłałaś wiadomość do Babilonu.","N":"Uzupełnienie: שְׁלַחְתִּי – G perf. 2 ż. l.poj. → zaimek אַנְתִּי „ty (ż.)” (hebr. אַתְּ; w hebr. ketiw אַתִּי). Uwaga: -tî to w aram. 2 ż., a nie 1 os. jak w hebr.!","R":"Greenspahn 11,9"},{"k":"A","n":10,"Z":"______ יִדְעֵת לְמִבְנֵא בַּיִת","A":"אֲנָה יִדְעֵת לְמִבְנֵא בַּיִת׃","T":"ʾănâ yidʿēt ləmibnē bayit","P":"Ja umiałem zbudować dom.","N":"Uzupełnienie: יִדְעֵת – G perf. 1 l.poj. → zaimek אֲנָה „ja” (hebr. אֲנִי). יְדַע + לְ + bezokolicznik = „umieć”.","R":"Greenspahn 11,10"},{"k":"A","n":11,"Z":"______ סְלִקוּ לִשְׁמַיָּא","A":"הִמּוֹ סְלִקוּ לִשְׁמַיָּא׃","T":"himmô səliqû lišmayyā","P":"Oni wstąpili do niebios.","N":"Uzupełnienie: סְלִקוּ – G perf. 3 m. l.mn. od סלק „wstępować” (wzór qətil) → zaimek הִמּוֹ (הִמּוֹן, אִנּוּן).","R":"Greenspahn 11,11"},{"k":"A","n":12,"Z":"______ שְׁלַחְנָא מְגִלָּה לְבֵית גִּנְזַיָּא","A":"אֲנַחְנָה שְׁלַחְנָא מְגִלָּה לְבֵית גִּנְזַיָּא׃","T":"ʾănaḥnâ šəlaḥnā məgillâ ləbêt ginzayyā","P":"My wysłaliśmy zwój do skarbca.","N":"Uzupełnienie: שְׁלַחְנָא – G perf. 1 l.mn. → zaimek אֲנַחְנָה „my”. בֵּית גִּנְזַיָּא „skarbiec”.","R":"Greenspahn 11,12"},{"k":"A","n":13,"R":"Greenspahn 11 (II), 1","A":"אִיתַי הֵיכַל בְקִרְיְתָא רַבְתָּא׃","T":"ʾîtay hêkal bəqiryətā rabtā","P":"Jest pałac (świątynia) w wielkim mieście.","N":"אִיתַי + podmiot nieokreślony (הֵיכַל st. abs.). הֵיכַל – „pałac, świątynia” (akad. ekallu; hebr. הֵיכָל). בְקִרְיְתָא – בְּ bez dageszu po wyrazie zakończonym samogłoską. רַבְּתָא – przymiotnik r. ż., st. emf. Forma jak w podręczniku: רַבְתָּא (w Dn 4,27: רַבְּתָא)."},{"k":"A","n":14,"R":"Greenspahn 11 (II), 2","A":"אַנְתּוּן הִמּוֹ כָּהֲנֵי אֱלָהָא דִּי שְׁמַיָּא׃","T":"ʾantûn himmô kāhănê ʾĕlāhā dî šəmayyā","P":"Wy jesteście kapłanami Boga niebios.","N":"Zdanie nominalne trójczłonowe: podmiot אַנְתּוּן + zaimek 3 os. הִמּוֹ jako łącznik („są”) + orzecznik. כָּהֲנֵי – l.mn. st. konstr. od כָּהֵן (hebr. כֹּהֲנֵי, ā > ō). דִּי שְׁמַיָּא – dopełniacz analityczny."},{"k":"A","n":15,"R":"Greenspahn 11 (II), 3","A":"בֵּית אֱלָהָא אִיתַי בִּירוּשְׁלֶם׃","T":"bêt ʾĕlāhā ʾîtay bîrûšəlem","P":"Dom Boży jest w Jerozolimie.","N":"אִיתַי jako „być, znajdować się” po podmiocie określonym."},{"k":"A","n":16,"R":"Greenspahn 11 (II), 4","A":"לְגַבְרָא לָא אִיתַי רֵאשׁ׃","T":"ləgabrā lā ʾîtay rēʾš","P":"Ten mąż nie ma głowy (dosł. dla męża nie ma głowy).","N":"Posiadanie: לְ + לָא אִיתַי (hebr. אֵין לָאִישׁ רֹאשׁ). גַּבְרָא – st. emf. od גְּבַר (*gabr- wraca przed końcówką). רֵאשׁ – st. abs."},{"k":"A","n":17,"R":"Greenspahn 11 (II), 5","A":"זְרֻבָּבֶל הוּא פֶּחָה דִּי יְהוּדָיֵא׃","T":"zərubbābel hûʾ peḥâ dî yəhûdāyē","P":"Zorobabel jest namiestnikiem Żydów.","N":"Zdanie nominalne z zaimkiem הוּא jako łącznikiem. פֶּחָה דִּי יְהוּדָיֵא – dopełniacz analityczny (por. Ezd 6,7 פַּחַת יְהוּדָיֵא – st. konstr.)."},{"k":"A","n":18,"R":"Greenspahn 11 (II), 6","A":"כְּנֵמָא כְּתִיב בִּסְפַר דָּרְיָוֶשׁ׃ אֲנַחְנָא מְצַלַּיִן לְאַרְעָא׃","T":"kənēmā kətîb bispar dāryāweš ʾănaḥnā məṣallayin ləʾarʿā","P":"Tak jest napisane w księdze Dariusza: „My modlimy się za ziemię”.","N":"כְּנֵמָא „tak” zapowiada cytat. כְּתִיב – G imiesłów bierny „napisany”. סְפַר – st. konstr. (hebr. סֵפֶר). מְצַלַּיִן – D imiesłów m. l.mn.; לְ „za, dla” (por. Ezd 6,10 מְצַלַּיִן לְחַיֵּי מַלְכָּא „modlą się za życie króla”)."},{"k":"A","n":19,"R":"Greenspahn 11 (II), 7","A":"אַנְתְּ הוּא מֶלֶךְ שְׁלָם׃","T":"ʾant hûʾ melek šəlām","P":"Ty jesteś królem pokoju.","N":"Zdanie nominalne: podmiot + łącznik הוּא + orzecznik (por. Dn 2,38 אַנְתְּ־הוּא רֵאשָׁה). מֶלֶךְ שְׁלָם – st. konstr. + st. abs."},{"k":"A","n":20,"R":"Greenspahn 11 (II), 8","A":"אֱדַיִן שַׁכְלִלוּ עֲבִידַת בַּיִת תַּקִּיף׃","T":"ʾĕdayin šaklilû ʿăbîdat bayit taqqîp","P":"Wtedy ukończyli pracę nad mocnym domem.","N":"שַׁכְלִלוּ – Š (šafʿel) perf. 3 m. l.mn. od כלל „ukończyć” (koniugacja kauzatywna z ש; por. Ezd 6,14). עֲבִידַת בַּיִת תַּקִּיף – st. konstr. + rzeczownik nieokreślony z przymiotnikiem."},{"k":"E","n":1,"E":"The six men did exactly as the king said.","Q":"Sześciu mężów uczyniło dokładnie tak, jak powiedział król.","A":"גֻּבְרַיָּא שִׁתָּה לָקֳבֵל דִּי אֲמַר מַלְכָּא אָסְפַּרְנָא עֲבַדוּ׃","T":"gubrayyā šittâ lāqŏbēl dî ʾămar malkā ʾāsparnā ʿăbadû","N":"Wzór: Ezd 6,13 לָקֳבֵל דִּי־שְׁלַח דָּרְיָוֶשׁ מַלְכָּא כְּנֵמָא אָסְפַּרְנָא עֲבַדוּ. Liczebnik stoi po rzeczowniku (por. Dn 3,24 גֻבְרִין תְּלָתָא); przy rzeczowniku męskim forma z -â (שִׁתָּה; hebr. שִׁשָּׁה). אָסְפַּרְנָא – perskie „dokładnie”.","R":"Greenspahn 11 – na aramejski, 1"},{"k":"E","n":2,"E":"We gave the rest of the kingdom to Darius.","Q":"Daliśmy resztę królestwa Dariuszowi.","A":"יְהַבְנָא שְׁאָר מַלְכוּתָא לְדָרְיָוֶשׁ׃","T":"yəhabnā šəʾār malkûtā lədāryāweš","N":"שְׁאָר – st. konstr. „reszta”. מַלְכוּתָא – st. emf. od מַלְכוּ „królestwo” (r. ż.).","R":"Greenspahn 11 – na aramejski, 2"},{"k":"E","n":3,"E":"The decree is in writing.","Q":"Dekret jest na piśmie.","A":"טַעְמָא בִּכְתָב׃","T":"ṭaʿmā biktāb","N":"Zdanie nominalne: podmiot (st. emf.) + wyrażenie przyimkowe. כְּתָב „pismo” (por. Ezd 6,18 כִּכְתָב).","R":"Greenspahn 11 – na aramejski, 3"},{"k":"E","n":4,"E":"There is no palace in Judah.","Q":"Nie ma pałacu w Judzie.","A":"לָא אִיתַי הֵיכַל בִּיהוּד׃","T":"lā ʾîtay hêkal bîhûd","N":"לָא אִיתַי = hebr. אֵין. בִּיהוּד – בְּ + יְהוּד (bə + yə > bî).","R":"Greenspahn 11 – na aramejski, 4"},{"k":"E","n":5,"E":"She is sending a book to the priest there.","Q":"Ona wysyła księgę do kapłana tam.","A":"הִיא שָׁלְחָה סְפַר לְכָהֲנָא תַמָּה׃","T":"hîʾ šāləḥâ səpar ləkāhănā tammâ","N":"Zaimek + imiesłów czynny G ż. l.poj. (שָׁלְחָה) = czas teraźniejszy. סְפַר – st. abs. „księga”. כָּהֲנָא – st. emf. „kapłan”.","R":"Greenspahn 11 – na aramejski, 5"}],"12":[{"k":"A","n":1,"A":"הוּא שְׁאֵל עַל דַּת מַלְכָּא׃","T":"hûʾ šəʾēl ʿal dat malkā","P":"On zapytał o prawo króla.","N":"שְׁאֵל – G perf. 3 m. l.poj. od שׁאל (wzór qətel). שְׁאֵל עַל „pytać o” (przyimek עַל). דָּת „prawo” – zapożyczenie perskie (hebr. דָּת w Estery). Forma jak w podręczniku: דַּת (w Dn 6,9: דָּת).","R":"Greenspahn 12,1"},{"k":"A","n":2,"A":"עַמָּא דְּנָה שַׁלִּיט לְהֵיבָלָא מָאנַיָּא מִן הֵיכְלָא׃","T":"ʿammā dənâ šallîṭ ləhêbālā māʾnayyā min hêkəlā","P":"Ten lud ma prawo wynieść naczynia ze świątyni.","N":"שַׁלִּיט + bezokolicznik = „mieć prawo, być upoważnionym do” (por. Ezd 7,24). לְהֵיבָלָא – לְ + H (hafʿel) bezokolicznik od יבל „zanieść, wynieść” (I-י: hê-). מִן הֵיכְלָא „z pałacu / ze świątyni”.","R":"Greenspahn 12,2"},{"k":"A","n":3,"A":"נְבוּכַדְנֶצַּר הֲוָה מֶלֶךְ בָּבֶל מִן עָלְמָא׃","T":"nəbûkadneṣṣar hăwâ melek bābel min ʿālmā","P":"Nabuchodonozor był królem Babilonu od dawien dawna (dosł. od wieczności).","N":"הֲוָה – G perf. 3 m. l.poj. od הוה (pisownia z ה). מֶלֶךְ בָּבֶל – st. konstr. + nazwa własna. מִן עָלְמָא „od wieczności, od dawna” (por. Ezd 4,15 מִן־יוֹמָת עָלְמָא).","R":"Greenspahn 12,3"},{"k":"A","n":4,"A":"מַן מִתְנַדֵּב לְמֶעְבַּד נְוָלוּ עַל אַרְעָא?","T":"man mitnaddēb ləmeʿbad nəwālû ʿal ʾarʿā","P":"Kto jest chętny, by uczynić na ziemi gnojowisko (rumowisko)?","N":"מִתְנַדַּב – Dt (hitpaʿʿal) imiesłów m. l.poj. od נדב „ofiarować się dobrowolnie, być chętnym” (Ezd 7,13). לְמֶעְבַּד – לְ + G bezokolicznik od עבד (מֶ־ przed gardłową). נְוָלוּ – „gnojowisko, rumowisko” (Ezd 6,11). Forma jak w podręczniku: מִתְנַדֵּב (w Ezd 7,13: מִתְנַדַּב).","R":"Greenspahn 12,4"},{"k":"A","n":5,"A":"אַנְתּוּן תְּהוֹדְעוּן לְדַיָּנָא דִּי לֶהֱוֵא מְרַד בִּמְדִינְתָּא׃","T":"ʾantûn təhôdəʿûn lədayyānā dî lehĕwē mərad bimdîntā","P":"Wy oznajmicie sędziemu, że w prowincji będzie bunt.","N":"תְּהוֹדְעוּן – H (hafʿel) imperf. 2 m. l.mn. od ידע „oznajmić”; osoba powiadamiana z לְ. דַּיָּנָא – st. emf. od דַּיָּן „sędzia” (wzór qaṭṭāl – nazwy zawodów). לֶהֱוֵא – G imperf. 3 m. l.poj. od הוה z prefiksem ל־.","R":"Greenspahn 12,5"},{"k":"E","n":1,"E":"We will go to Jerusalem with Ezra.","Q":"Pójdziemy do Jerozolimy z Ezdraszem.","A":"נְהָךְ לִירוּשְׁלֶם עִם עֶזְרָא׃","T":"nəhāk lîrûšəlem ʿim ʿezrā","N":"נְהָךְ – G imperf. 1 l.mn. od הלך (w imperf. aram. biblijny używa הלך, w perf. – אזל; por. Ezd 7,13 יְהָךְ). עִם „z”.","R":"Greenspahn 12 – na aramejski, 1"},{"k":"E","n":2,"E":"The city will be built after they give tax to the king.","Q":"Miasto zostanie zbudowane po tym, jak dadzą królowi daninę.","A":"קִרְיְתָא תִּתְבְּנֵא בָּתַר דִּי יִנְתְּנוּן בְּלוֹ לְמַלְכָּא׃","T":"qiryətā titbənē bātar dî yintənûn bəlô ləmalkā","N":"תִּתְבְּנֵא – Gt imperf. 3 ż. l.poj. (strona bierna; por. Ezd 4,13). בָּתַר „po” (por. Dn 2,39 וּבָתְרָךְ); בָּתַר דִּי „po tym, jak”. יִנְתְּנוּן – G imperf. 3 m. l.mn. od נתן.","R":"Greenspahn 12 – na aramejski, 2"},{"k":"E","n":3,"E":"The judgment was between the king and the people.","Q":"Sąd był między królem a ludem.","A":"דִּינָא הֲוָה בֵּין מַלְכָּא וּבֵין עַמָּא׃","T":"dînā hăwâ bên malkā ûbên ʿammā","N":"דִּינָא – st. emf. od דִּין „sąd, wyrok”. בֵּין ... וּבֵין – „między … a” (jak hebr. בֵּין ... וּבֵין).","R":"Greenspahn 12 – na aramejski, 3"},{"k":"E","n":4,"E":"They said, “Leave the book in Babylon.”","Q":"Powiedzieli: „Zostawcie księgę w Babilonie”.","A":"אֲמַרוּ שְׁבֻקוּ סִפְרָא בְּבָבֶל׃","T":"ʾămarû šəbuqû siprā bəbābel","N":"אֲמַרוּ – G perf. 3 m. l.mn. שְׁבֻקוּ – G imperatyw 2 m. l.mn. od שׁבק (samogłoska u). Mowa niezależna bez spójnika.","R":"Greenspahn 12 – na aramejski, 4"},{"k":"E","n":5,"E":"The head was in the sky.","Q":"Głowa była w niebie.","A":"רֵאשָׁא הֲוָה בִּשְׁמַיָּא׃","T":"rēʾšā hăwâ bišmayyā","N":"רֵאשָׁא – st. emf. od רֵאשׁ. הֲוָה – G perf. 3 m. l.poj. od הוה.","R":"Greenspahn 12 – na aramejski, 5"}],"13":[{"k":"E","n":1,"E":"The king will be a servant in another time.","Q":"Król będzie sługą w innym czasie.","A":"מַלְכָּא לֶהֱוֵא עֲבֵד בְּעִדָּן אָחֳרָן׃","T":"malkā lehĕwē ʿăbēd bəʿiddān ʾoḥŏrān","N":"לֶהֱוֵא – G imperf. 3 m. l.poj. od הוה z prefiksem ל־. עֲבֵד – st. abs. „sługa”. עִדָּן „czas” + przymiotnik אָחֳרָן „inny” (hebr. אַחֵר).","R":"Greenspahn 13 – na aramejski, 1"},{"k":"E","n":2,"E":"The wise men answered the head of the province.","Q":"Mędrcy odpowiedzieli głowie (przywódcy) prowincji.","A":"חַכִּימַיָּא הֲתִיבוּ פִתְגָם לְרֵאשׁ מְדִינְתָּא׃","T":"ḥakkîmayyā hătîbû pitgām lərēʾš mədîntā","N":"הֲתִיבוּ פִתְגָם – H (hafʿel) perf. 3 m. l.mn. od תוב „zwrócić słowo” = odpowiedzieć (por. Ezd 5,11; Dn 3,16). חַכִּימַיָּא – l.mn. st. emf. od חַכִּים „mędrzec” (wzór qaṭṭîl).","R":"Greenspahn 13 – na aramejski, 2"},{"k":"E","n":3,"E":"The interpretation will change if the scribe goes out from the city.","Q":"Wykład się zmieni, jeśli pisarz wyjdzie z miasta.","A":"פִּשְׁרָא יִשְׁתַּנֵּא הֵן סָפְרָא יִפֻּק מִן קִרְיְתָא׃","T":"pišrā yištannē hēn sāprā yippuq min qiryətā","N":"יִשְׁתַּנֵּא – Dt (hitpaʿʿal) imperf. 3 m. l.poj. od שׁני „zmienić się” z metatezą ת i שׁ (por. Dn 2,9). הֵן „jeśli”. יִפֻּק – G imperf. 3 m. l.poj. od נפק (n zasymilowane).","R":"Greenspahn 13 – na aramejski, 3"},{"k":"E","n":4,"E":"There is a word in my dream that I did not know.","Q":"W moim śnie jest słowo, którego nie znałem.","A":"אִיתַי מִלָּה בְּחֶלְמִי דִּי לָא יִדְעֵת׃","T":"ʾîtay millâ bəḥelmî dî lā yidʿēt","N":"חֶלְמִי – חֵלֶם + sufiks 1 l.poj. -î „mój sen”. דִּי לָא יִדְעֵת – zdanie względne; יִדְעֵת – G perf. 1 l.poj.","R":"Greenspahn 13 – na aramejski, 4"},{"k":"E","n":5,"E":"We will tell everything except the name of our god.","Q":"Opowiemy wszystko oprócz imienia naszego boga.","A":"כֹּלָּא נְחַוֵּא לָהֵן שֻׁם אֱלָהַנָא׃","T":"kōllā nəḥawwē lāhēn šum ʾĕlāhanā","N":"נְחַוֵּא – D (paʿʿel) imperf. 1 l.mn. od חוי „oznajmić, opowiedzieć” (por. Dn 2,4). לָהֵן „oprócz”. אֱלָהַנָא – אֱלָהּ + sufiks 1 l.mn. -anā (Dn 3,17).","R":"Greenspahn 13 – na aramejski, 5"},{"k":"E","n":6,"E":"His house is on a dunghill.","Q":"Jego dom jest na gnojowisku.","A":"בַּיְתֵהּ עַל נְוָלוּ׃","T":"baytēh ʿal nəwālû","N":"בַּיְתֵהּ – בַּיִת + sufiks 3 m. l.poj. -ēh (hebr. בֵּיתוֹ). Zdanie nominalne.","R":"Greenspahn 13 – na aramejski, 6"}],"14":[{"k":"A","n":1,"A":"יְדַעְנָא רָזַיָּא אִלֵּין׃","T":"yədaʿnā rāzayyā ʾillên","P":"Znamy (poznaliśmy) te tajemnice.","N":"יְדַעְנָא – G perf. 1 l.mn. רָזַיָּא – l.mn. st. emf. od רָז „tajemnica” (perskie). אִלֵּין – zaimek wskazujący bliski l.mn. „te” (hebr. אֵלֶּה; nunacja).","R":"Greenspahn 14,1"},{"k":"A","n":2,"A":"מַן בְּנָה הֵיכְלָא דֵּךְ?","T":"man bənâ hêkəlā dēk","P":"Kto zbudował tamten pałac?","N":"מַן – zaimek pytający „kto” (hebr. מִי). בְּנָה – G perf. 3 m. l.poj. od בנה (III-י). דֵּךְ – zaimek wskazujący odległy m. l.poj. „tamten” (por. Ezd 5,16).","R":"Greenspahn 14,2"},{"k":"A","n":3,"A":"סָפְרָא כְּתַב דִּי חָכְמָה אָבְדָה מִבָּבֶל בִּזְמַן נְבוּכַדְנֶצַּר׃","T":"sāprā kətab dî ḥokmâ ʾābədâ mibbābel bizman nəbûkadneṣṣar","P":"Pisarz napisał, że mądrość ginie z Babilonu w czasie Nabuchodonozora.","N":"דִּי „że”. חָכְמָה (kamec chatuf: ḥokmâ) – st. abs. „mądrość”. אָבְדָה – G imiesłów czynny ż. l.poj. od אבד „ginąć” (perf. 3 ż. brzmiałby אַבְדַת). מִבָּבֶל – מִן z asymilacją. זְמַן – „czas” (perskie).","R":"Greenspahn 14,3"},{"k":"A","n":4,"A":"דָּנִיֵּאל עַל לִשְׁמַיָּא׃","T":"dāniyyēʾl ʿal lišmayyā","P":"Daniel wszedł do niebios.","N":"עַל – tu nie przyimek, lecz G perf. 3 m. l.poj. od עלל „wejść” (por. Dn 2,24 עַל עַל־אַרְיוֹךְ). Kierunek: לִשְׁמַיָּא (לְ + st. emf.).","R":"Greenspahn 14,4"},{"k":"A","n":5,"A":"כָּל קֳבֵל דְּנָה גֲּלִי דִּי מְהָקֵים מַלְכָּא רֵאשׁ פֶּחָה עַל קִרְיְתָא דָּא׃","T":"kol qŏbēl dənâ gălî dî məhāqêm malkā rēʾš peḥâ ʿal qiryətā dāʾ","P":"Dlatego zostało objawione, że król ustanawia naczelnego namiestnika (dosł. głowę namiestnika) nad tym miastem.","N":"כָּל קֳבֵל דְּנָה „dlatego”. גֲּלִי – G bierny (peʿil) perf. 3 m. l.poj. od גלי „został objawiony” (ḥaṭef pod ג). מְהָקֵים – H (hafʿel) imiesłów od קום „ustanawiać” (por. Dn 2,21). דָּא – zaimek wskazujący bliski ż. l.poj. „ta” (hebr. זֹאת).","R":"Greenspahn 14,5"},{"k":"A","n":6,"A":"אִיתַי אֱנַשׁ דִּי בָּעֵה רַחַמִין׃","T":"ʾîtay ʾĕnaš dî bāʿē raḥamîn","P":"Jest człowiek, który prosi o miłosierdzie.","N":"אִיתַי + podmiot nieokreślony. בָּעֵה – G imiesłów czynny m. l.poj. od בעי „prosić, szukać” (III-י; pisownia z ה). רַחֲמִין „miłosierdzie” (l.mn., hebr. רַחֲמִים; por. Dn 2,18). Formy jak w podręczniku: אֱנַשׁ, רַחַמִין (w Biblii: אֱנָשׁ, רַחֲמִין – Dn 2,18).","R":"Greenspahn 14,6"},{"k":"E","n":1,"E":"This father praises the law of God.","Q":"Ten ojciec wysławia prawo Boga.","A":"אַבָּא דְנָה מְשַׁבַּח לְדָת אֱלָהָא׃","T":"ʾabbā dənâ məšabbaḥ lədāt ʾĕlāhā","N":"אַבָּא – st. emf. „ojciec” (por. Mk 14,36). מְשַׁבַּח – D (paʿʿel) imiesłów od שׁבח „wysławiać” (Dn 2,23). Dopełnienie z לְ (por. Dn 4,31 וּלְחַי עָלְמָא שַׁבְּחֵת).","R":"Greenspahn 14 – na aramejski, 1"},{"k":"E","n":2,"E":"I am authorized to seek that book in the treasure house.","Q":"Jestem upoważniony, by szukać tamtej księgi w skarbcu.","A":"שַׁלִּיט אֲנָה לְמִבְעֵא סִפְרָא דֵךְ בְּבֵית גִּנְזַיָּא׃","T":"šallîṭ ʾănâ ləmibʿē siprā dēk bəbêt ginzayyā","N":"שַׁלִּיט + bezokolicznik = „mieć prawo, być upoważnionym”. לְמִבְעֵא – G bezokolicznik od בעי „szukać, prosić” (Dn 2,18). דֵךְ – zaimek odległy m. l.poj.","R":"Greenspahn 14 – na aramejski, 2"},{"k":"E","n":3,"E":"These provinces are under a strong king.","Q":"Te prowincje są pod [władzą] mocnego króla.","A":"מְדִינָתָא אִלֵּין תְּחוֹת מֶלֶךְ תַּקִּיף׃","T":"mədînātā ʾillên təḥôt melek taqqîp","N":"מְדִינָתָא – l.mn. ż., st. emf. od מְדִינָה. אִלֵּין „te”. תְּחוֹת „pod” (hebr. תַּחַת).","R":"Greenspahn 14 – na aramejski, 3"},{"k":"E","n":4,"E":"They left that letter there.","Q":"Zostawili tam tamten list.","A":"שְׁבַקוּ אִגַּרְתָּא דָךְ תַּמָּה׃","T":"šəbaqû ʾiggartā dāk tammâ","N":"שְׁבַקוּ – G perf. 3 m. l.mn. od שׁבק. דָךְ – zaimek odległy ż. l.poj. (אִגְּרָה jest r. ż.).","R":"Greenspahn 14 – na aramejski, 4"},{"k":"E","n":5,"E":"We are giving many vessels in the midst of the earth.","Q":"Dajemy wiele naczyń pośrodku ziemi.","A":"אֲנַחְנָה יָהֲבִין מָאנִין שַׂגִּיאִין בְּגוֹא אַרְעָא׃","T":"ʾănaḥnâ yāhăbîn māʾnîn śaggîʾîn bəgôʾ ʾarʿā","N":"יָהֲבִין – G imiesłów czynny m. l.mn. od יהב (ḥaṭef pod ה). מָאנִין – l.mn. st. abs. od מָאן „naczynie”. בְּגוֹא „pośrodku”.","R":"Greenspahn 14 – na aramejski, 5"}],"15":[{"k":"E","n":1,"E":"I will write a letter on a stone from the mountain.","Q":"Napiszę list na kamieniu z góry.","A":"אֶכְתֻּב אִגְּרָה עַל אֶבֶן מִן טוּרָא׃","T":"ʾektub ʾiggərâ ʿal ʾeben min ṭûrā","N":"אֶכְתֻּב – G imperf. 1 l.poj. (prefiks אֶ־, samogłoska tematyczna u; hebr. אֶכְתֹּב). אֶבֶן „kamień” (r. ż.). טוּרָא – st. emf. od טוּר „góra” (hebr. צוּר „skała”; *ṯ̣: ט ~ צ).","R":"Greenspahn 15 – na aramejski, 1"},{"k":"E","n":2,"E":"She will send a message to the scribe.","Q":"Ona wyśle wiadomość do pisarza.","A":"הִיא תִשְׁלַח פִּתְגָם לְסָפְרָא׃","T":"hîʾ tišlaḥ pitgām ləsāprā","N":"תִשְׁלַח – G imperf. 3 ż. l.poj. od שׁלח (samogłoska tematyczna a przed gardłową; prefiks ת־ jak w hebr.).","R":"Greenspahn 15 – na aramejski, 2"},{"k":"E","n":3,"E":"He broke the foot and the head off of the statue.","Q":"Odłamał stopę i głowę od posągu.","A":"תְּבַר רַגְלָא וְרֵאשָׁא מִן צַלְמָא׃","T":"təbar raglā wərēʾšā min ṣalmā","N":"תְּבַר – G perf. 3 m. l.poj. „łamać” (rdz. = hebr. שׁבר; *ṯ: ת ~ שׁ; por. Dn 2,42 תְבִירָה). רַגְלָא, רֵאשָׁא, צַלְמָא – st. emf. מִן „od, z”.","R":"Greenspahn 15 – na aramejski, 3"},{"k":"E","n":4,"E":"That man sees vessels of clay which Daniel smashed.","Q":"Tamten mąż widzi gliniane naczynia, które roztrzaskał Daniel.","A":"גַּבְרָא דֵךְ חָזֵה מָאנֵי חֲסַף דִּי הַדֵּק דָּנִיֵּאל׃","T":"gabrā dēk ḥāzē māʾnê ḥăsap dî haddēq dāniyyēʾl","N":"חָזֵה – G imiesłów czynny m. l.poj. od חזי „widzieć” (III-י). מָאנֵי חֲסַף – st. konstr. + materiał „naczynia z gliny”. הַדֵּק – H (hafʿel) perf. 3 m. l.poj. od דקק „roztrzaskać” (por. Dn 2,34). W zdaniu względnym szyk V–S.","R":"Greenspahn 15 – na aramejski, 4"},{"k":"E","n":5,"E":"There is iron under the earth.","Q":"Pod ziemią jest żelazo.","A":"אִיתַי פַּרְזֶל תְּחוֹת אַרְעָא׃","T":"ʾîtay parzel təḥôt ʾarʿā","N":"פַּרְזֶל „żelazo” (hebr. בַּרְזֶל). תְּחוֹת „pod”.","R":"Greenspahn 15 – na aramejski, 5"},{"k":"E","n":6,"E":"We will ask to build a palace there.","Q":"Poprosimy, by zbudować tam pałac.","A":"נִבְעֵא לְמִבְנֵא הֵיכַל תַּמָּה׃","T":"nibʿē ləmibnē hêkal tammâ","N":"נִבְעֵא – G imperf. 1 l.mn. od בעי „prosić” (III-י). לְמִבְנֵא – G bezokolicznik od בנה.","R":"Greenspahn 15 – na aramejski, 6"},{"k":"E","n":7,"E":"The Judeans left copper in Babylon.","Q":"Żydzi zostawili miedź (brąz) w Babilonie.","A":"יְהוּדָיֵא שְׁבַקוּ נְחָשׁ בְּבָבֶל׃","T":"yəhûdāyē šəbaqû nəḥāš bəbābel","N":"שְׁבַקוּ – G perf. 3 m. l.mn. נְחָשׁ „miedź, brąz” (hebr. נְחֹשֶׁת).","R":"Greenspahn 15 – na aramejski, 7"}],"16":[{"k":"A","n":1,"A":"אֲנַחְנָא דָּארִין בְּבַיִת דִּי דְּהַב׃","T":"ʾănaḥnā dāʾrîn bəbayit dî dəhab","P":"Mieszkamy w domu ze złota.","N":"דָּאְרִין – G imiesłów czynny m. l.mn. od דור „mieszkać” (II-ו: w imiesłowie א zamiast spółgłoski środkowej; por. Dn 3,31). בַּיִת דִּי דְּהַב – דִּי wskazuje materiał: „dom ze złota”. Forma jak w podręczniku: דָּארִין (w Dn 3,31: דָאְרִין).","R":"Greenspahn 16,1"},{"k":"A","n":2,"A":"יִשְׁלַט מַלְכָּא עַל מְדִינַת עֲבַר־נַהָרָא׃","T":"yišlaṭ malkā ʿal mədînat ʿăbar-nahārā","P":"Król będzie panował nad prowincją Zarzecza.","N":"Szyk V–S. יִשְׁלַט – G imperf. 3 m. l.poj. od שׁלט „panować” (samogłoska tematyczna a). שְׁלַט עַל „panować nad”. מְדִינַת – st. konstr. r. ż. (-at). Forma jak w podręczniku: נַהָרָא (w Biblii: נַהֲרָא).","R":"Greenspahn 16,2"},{"k":"A","n":3,"A":"חַגַּי הַדֵּק חֵיוָה תַקִּיפָה׃","T":"ḥaggay haddēq ḥêwâ taqqîpâ","P":"Aggeusz roztrzaskał (zmiażdżył) silne zwierzę.","N":"הַדֵּק – H (hafʿel) perf. 3 m. l.poj. od דקק (II=III). חֵיוָה תַקִּיפָה – rzeczownik r. ż. + przymiotnik r. ż., st. abs.; תַ bez dageszu po samogłosce.","R":"Greenspahn 16,3"},{"k":"A","n":4,"A":"אֱנָשׁ רְבִיעָי אֲזַל׃","T":"ʾĕnāš rəbîʿāy ʾăzal","P":"Czwarty człowiek poszedł.","N":"רְבִיעָי – liczebnik porządkowy m. l.poj. „czwarty” (hebr. רְבִיעִי), po rzeczowniku jak przymiotnik. Szyk S–V.","R":"Greenspahn 16,4"},{"k":"A","n":5,"A":"הִמּוֹ יִסְגְּדוּן לְרֵאשֵׁהּ דִּי צַלְמָא׃","T":"himmô yisgədûn lərēʾšēh dî ṣalmā","P":"Oni będą oddawać pokłon głowie posągu.","N":"יִסְגְּדוּן – G imperf. 3 m. l.mn. od סגד „oddawać pokłon”; dopełnienie z לְ. לְרֵאשֵׁהּ דִּי צַלְמָא – sufiks proleptyczny: „jego głowie, [głowie] posągu” (typowa konstrukcja aramejska).","R":"Greenspahn 16,5"},{"k":"A","n":6,"A":"אִיתַי אֶצְבְּעָן שַׂגִּיאָן עַל יַד דַּרְיָוֶשׁ׃","T":"ʾîtay ʾeṣbəʿān śaggîʾān ʿal yad daryāweš","P":"Jest wiele palców na ręce Dariusza.","N":"אֶצְבְּעָן – l.mn. r. ż., st. abs. od אֶצְבַּע „palec” (końcówka -ān). שַׂגִּיאָן – przymiotnik r. ż. l.mn. יַד – st. konstr. od יַד „ręka”. Forma jak w podręczniku: דַּרְיָוֶשׁ (w Biblii: דָּרְיָוֶשׁ).","R":"Greenspahn 16,6"},{"k":"E","n":1,"E":"The interpretation of the fourth decree is written in the temple.","Q":"Wykład czwartego dekretu jest zapisany w świątyni.","A":"פְּשַׁר טַעְמָא רְבִיעָיָא כְּתִיב בְּהֵיכְלָא׃","T":"pəšar ṭaʿmā rəbîʿāyā kətîb bəhêkəlā","N":"פְּשַׁר – st. konstr. „wykład”. טַעְמָא רְבִיעָיָא – rzeczownik + liczebnik porządkowy, oba st. emf. כְּתִיב – G imiesłów bierny „zapisany”.","R":"Greenspahn 16 – na aramejski, 1"},{"k":"E","n":2,"E":"They fall from their feet and they pray to God.","Q":"Padają z nóg i modlą się do Boga.","A":"נָפְלִין מִן רַגְלֵיהוֹן וּמְצַלַּיִן קֳדָם אֱלָהָא׃","T":"nāpəlîn min raglêhôn ûməṣallayin qŏdām ʾĕlāhā","N":"נָפְלִין – G imiesłów czynny m. l.mn. od נפל. רַגְלֵיהוֹן – l.podw./mn. + sufiks 3 m. l.mn. מְצַלַּיִן – D imiesłów od צלי.","R":"Greenspahn 16 – na aramejski, 2"},{"k":"E","n":3,"E":"We went out to the distant field.","Q":"Wyszliśmy na odległe pole.","A":"נְפַקְנָא לְבָרָא רַחִיקָא׃","T":"nəpaqnā ləbārā raḥîqā","N":"נְפַקְנָא – G perf. 1 l.mn. od נפק „wyjść”. בָּרָא – st. emf. od בַּר „pole, step” (Dn 2,38 חֵיוַת בָּרָא). רַחִיקָא – przymiotnik m. st. emf.","R":"Greenspahn 16 – na aramejski, 3"},{"k":"E","n":4,"E":"The wise scribe came with a third message.","Q":"Mądry pisarz przyszedł z trzecią wiadomością.","A":"סָפְרָא חַכִּימָא אֲתָא עִם פִּתְגָם תְּלִיתָי׃","T":"sāprā ḥakkîmā ʾătā ʿim pitgām təlîtāy","N":"חַכִּימָא – przymiotnik st. emf. zgodny z סָפְרָא. תְּלִיתָי – liczebnik porządkowy m. „trzeci” (hebr. שְׁלִישִׁי; *ṯ: ת ~ שׁ).","R":"Greenspahn 16 – na aramejski, 4"},{"k":"E","n":5,"E":"We were able to build another house.","Q":"Mogliśmy zbudować inny dom.","A":"יְכִלְנָא לְמִבְנֵא בַּיִת אָחֳרָן׃","T":"yəkilnā ləmibnē bayit ʾoḥŏrān","N":"יְכִלְנָא – G perf. 1 l.mn. od יכל „móc” (wzór qətil). אָחֳרָן „inny” (kamec chatuf).","R":"Greenspahn 16 – na aramejski, 5"}],"17":[{"k":"E","n":1,"E":"The first man is the head of the province.","Q":"Pierwszy mąż jest głową (przywódcą) prowincji.","A":"גַּבְרָא קַדְמָיָא הוּא רֵאשׁ מְדִינְתָּא׃","T":"gabrā qadmāyā hûʾ rēʾš mədîntā","N":"קַדְמָיָא – liczebnik porządkowy „pierwszy”, st. emf. (por. Dn 7,4 קַדְמָיְתָא r. ż.). הוּא – łącznik w zdaniu nominalnym.","R":"Greenspahn 17 – na aramejski, 1"},{"k":"E","n":2,"E":"We pray to the God of heaven.","Q":"Modlimy się do Boga niebios.","A":"אֲנַחְנָה מְצַלַּיִן קֳדָם אֱלָהּ שְׁמַיָּא׃","T":"ʾănaḥnâ məṣallayin qŏdām ʾĕlāh šəmayyā","N":"Zaimek + imiesłów D (czas teraźniejszy). אֱלָהּ שְׁמַיָּא – st. konstr. + st. emf. (częsty tytuł w Ezd i Dn).","R":"Greenspahn 17 – na aramejski, 2"},{"k":"E","n":3,"E":"Five secrets were in the dream.","Q":"W śnie było pięć tajemnic.","A":"רָזִין חֲמִשָּׁה הֲווֹ בְּחֶלְמָא׃","T":"rāzîn ḥămiššâ hăwô bəḥelmā","N":"Liczebnik 5 przy rzeczowniku męskim – forma z -â: חֲמִשָּׁה (hebr. חֲמִשָּׁה); stoi po rzeczowniku. הֲווֹ – G perf. 3 m. l.mn. od הוה.","R":"Greenspahn 17 – na aramejski, 3"},{"k":"E","n":4,"E":"The sound went out from Babylon like a fire.","Q":"Głos (dźwięk) wyszedł z Babilonu jak ogień.","A":"קָלָא נְפַק מִן בָּבֶל כְּנוּר׃","T":"qālā nəpaq min bābel kənûr","N":"קָלָא – st. emf. od קָל (hebr. קוֹל; ā > ō). נְפַק – G perf. 3 m. l.poj. כְּנוּר – כְּ + נוּר „ogień” (r. ż.).","R":"Greenspahn 17 – na aramejski, 4"},{"k":"E","n":5,"E":"They will worship a statue of iron.","Q":"Będą oddawać pokłon posągowi z żelaza.","A":"יִסְגְּדוּן לִצְלֵם דִּי פַרְזֶל׃","T":"yisgədûn liṣlēm dî parzel","N":"יִסְגְּדוּן – G imperf. 3 m. l.mn.; dopełnienie z לְ. צְלֵם דִּי פַרְזֶל – דִּי wskazuje materiał (por. Dn 3,1 צְלֵם דִּי־דְהַב).","R":"Greenspahn 17 – na aramejski, 5"},{"k":"E","n":6,"E":"There are 10,000 books burning in the palace.","Q":"W pałacu płonie 10 000 ksiąg.","A":"אִיתַי סִפְרִין רִבּוֹ יָקְדִין בְּהֵיכְלָא׃","T":"ʾîtay siprîn ribbô yāqədîn bəhêkəlā","N":"רִבּוֹ „dziesięć tysięcy” (Dn 7,10). יָקְדִין – G imiesłów czynny m. l.mn. od יקד „płonąć” (por. Dn 3,6 נוּרָא יָקִדְתָּא).","R":"Greenspahn 17 – na aramejski, 6"},{"k":"E","n":7,"E":"One horn is thrown into the furnace.","Q":"Jeden róg jest wrzucany do pieca.","A":"קֶרֶן חֲדָה מִתְרְמְיָא לְגוֹא אַתּוּנָא׃","T":"qeren ḥădâ mitrəməyā ləgôʾ ʾattûnā","N":"קֶרֶן „róg” jest r. ż. → liczebnik חֲדָה i imiesłów ż. מִתְרְמְיָא (Gt imiesłów od רמי „zostać wrzuconym”; por. Dn 3,6 יִתְרְמֵא). לְגוֹא אַתּוּנָא „do wnętrza pieca”.","R":"Greenspahn 17 – na aramejski, 7"},{"k":"E","n":8,"E":"They heard four kinds of music.","Q":"Usłyszeli cztery rodzaje muzyki.","A":"שְׁמַעוּ זְנֵי זְמָרָא אַרְבְּעָה׃","T":"šəmaʿû zənê zəmārā ʾarbəʿâ","N":"שְׁמַעוּ – G perf. 3 m. l.mn. זְנֵי זְמָרָא – „rodzaje muzyki” (Dn 3,5; זַן – perskie). Liczebnik 4 przy rzeczowniku męskim: אַרְבְּעָה, po rzeczowniku.","R":"Greenspahn 17 – na aramejski, 8"}],"18":[{"k":"E","n":1,"E":"Do not kill these strong men.","Q":"Nie zabijajcie tych silnych mężów.","A":"אַל תִּקְטְלוּן לְגֻבְרַיָּא תַקִּיפַיָּא אִלֵּין׃","T":"ʾal tiqṭəlûn ləgubrayyā taqqîpayyā ʾillên","N":"Zakaz: אַל + imperf. (jussiw), a nie imperatyw (jak w hebr. אַל־תַּהַרְגוּ; por. Dn 2,24 אַל־תְּהוֹבֵד). תִּקְטְלוּן – G imperf. 2 m. l.mn. od קטל. Dopełnienie z לְ.","R":"Greenspahn 18 – na aramejski, 1"},{"k":"E","n":2,"E":"God is ready to make a place in the heavens.","Q":"Bóg jest gotów uczynić miejsce w niebiosach.","A":"אֱלָהָא עֲתִיד לְמֶעְבַּד אֲתַר בִּשְׁמַיָּא׃","T":"ʾĕlāhā ʿătîd ləmeʿbad ʾătar bišmayyā","N":"עֲתִיד „gotowy” + bezokolicznik (por. Dn 3,15). לְמֶעְבַּד – G bezokolicznik od עבד. אֲתַר „miejsce” (Ezd 5,15).","R":"Greenspahn 18 – na aramejski, 2"},{"k":"E","n":3,"E":"The hand will write a very good letter.","Q":"Ręka napisze bardzo dobry list.","A":"יְדָא תִכְתֻּב אִגְּרָה טָבָה שַׂגִּיא׃","T":"yədā tiktub ʾiggərâ ṭābâ śaggîʾ","N":"יְדָא – r. ż. → orzeczenie w 3 ż. (תִכְתֻּב). טָבָה – przymiotnik r. ż. (hebr. טוֹבָה). שַׂגִּיא – przysłówkowo „bardzo” (por. Dn 2,12).","R":"Greenspahn 18 – na aramejski, 3"},{"k":"E","n":4,"E":"The king needs to burn this city with fire.","Q":"Król musi spalić to miasto ogniem.","A":"מַלְכָּא חָשַׁח לְמֵיקַד קִרְיְתָא דָא בְּנוּרָא׃","T":"malkā ḥāšaḥ ləmêqad qiryətā dāʾ bənûrā","N":"חָשַׁח – G imiesłów od חשׁח „potrzebować” (por. Dn 3,16 חַשְׁחִין). לְמֵיקַד – G bezokolicznik od יקד „palić” (wzór czasowników I-י z prefiksem מֵי־). קִרְיְתָא דָא – „to miasto” (zaimek ż. דָּא).","R":"Greenspahn 18 – na aramejski, 4"},{"k":"E","n":5,"E":"Hear the sound of music in the distant field.","Q":"Słuchaj dźwięku muzyki na odległym polu.","A":"שְׁמַע קָל זְמָרָא בְּבָרָא רַחִיקָא׃","T":"šəmaʿ qāl zəmārā bəbārā raḥîqā","N":"שְׁמַע – G imperatyw 2 m. l.poj. od שׁמע (forma l.mn.: שְׁמַעוּ). קָל זְמָרָא – st. konstr. + st. emf.","R":"Greenspahn 18 – na aramejski, 5"},{"k":"E","n":6,"E":"They brought the bound scribe to a dunghill.","Q":"Przyprowadzili związanego pisarza na gnojowisko.","A":"הַיְתִיו לְסָפְרָא מְכַפְּתָא לִנְוָלוּ׃","T":"haytîw ləsāprā məkappətā linwālû","N":"הַיְתִיו – H (hafʿel) perf. 3 m. l.mn. od אתי „przyprowadzić” (Dn 6,17). מְכַפְּתָא – D imiesłów bierny od כפת „związany”, st. emf. (por. Dn 3,23 מְכַפְּתִין). Dopełnienie osobowe z לְ.","R":"Greenspahn 18 – na aramejski, 6"},{"k":"E","n":7,"E":"The people will save many treasures.","Q":"Lud ocali wiele skarbów.","A":"עַמָּא יְשֵׁיזִב גִּנְזִין שַׂגִּיאִין׃","T":"ʿammā yəšêzib ginzîn śaggîʾîn","N":"יְשֵׁיזִב – Š (šafʿel) imperf. 3 m. l.poj. od שֵׁיזִב „ocalić, wybawić” (Dn 3,17). עַמָּא – rzeczownik zbiorowy w l.poj. → orzeczenie w l.poj.","R":"Greenspahn 18 – na aramejski, 7"}],"19":[{"k":"E","n":1,"E":"They bound his body from head to foot.","Q":"Związali jego ciało od głowy do stóp.","A":"כַּפִּתוּ גִּשְׁמֵהּ מִן רֵאשָׁא וְעַד רַגְלָא׃","T":"kappitû gišmēh min rēʾšā wəʿad raglā","N":"כַּפִּתוּ – D (paʿʿel) perf. 3 m. l.mn. od כפת „związać” (podwojenie 2. rdzennej). גִּשְׁמֵהּ – גְּשֵׁם „ciało” + sufiks 3 m. l.poj. (hebr. גֶּשֶׁם „deszcz” – fałszywy przyjaciel). מִן ... וְעַד „od … do”.","R":"Greenspahn 19 – na aramejski, 1"},{"k":"E","n":2,"E":"Surely, we will destroy four provinces.","Q":"Na pewno zniszczymy cztery prowincje.","A":"מִן־יַצִּיב נְחַבֵּל מְדִינָן אַרְבַּע׃","T":"min-yaṣṣîb nəḥabbēl mədînān ʾarbaʿ","N":"מִן־יַצִּיב „na pewno” (Dn 2,8). נְחַבֵּל – D (paʿʿel) imperf. 1 l.mn. od חבל „zniszczyć”. מְדִינָן – l.mn. r. ż. st. abs. Liczebnik przy rzeczowniku żeńskim bez -â: אַרְבַּע.","R":"Greenspahn 19 – na aramejski, 2"},{"k":"E","n":3,"E":"The king gave dominion to his son for eternity.","Q":"Król dał władzę swojemu synowi na wieki.","A":"מַלְכָּא יְהַב שָׁלְטָן לִבְרֵהּ לְעָלְמִין׃","T":"malkā yəhab šolṭān librēh ləʿālmîn","N":"שָׁלְטָן „władza” (kamec chatuf: šolṭān). לִבְרֵהּ – לְ + בַּר „syn” + sufiks 3 m. l.poj. (hebr. לִבְנוֹ; ר ~ נ). לְעָלְמִין „na wieki”.","R":"Greenspahn 19 – na aramejski, 3"},{"k":"E","n":4,"E":"How wise you are to leave the rebellious city in peace.","Q":"Jakże jesteś mądry, że zostawiasz buntownicze miasto w pokoju.","A":"כְּמָה חַכִּים אַנְתְּ לְמִשְׁבַּק קִרְיְתָא מָרָדְתָּא בִּשְׁלָם׃","T":"kəmâ ḥakkîm ʾant ləmišbaq qiryətā mārādtā bišlām","N":"כְּמָה „jakże” (Dn 3,33). Zdanie nominalne: orzecznik חַכִּים przed podmiotem אַנְתְּ. לְמִשְׁבַּק – G bezokolicznik od שׁבק.","R":"Greenspahn 19 – na aramejski, 4"},{"k":"E","n":5,"E":"She is praising the judge, who grew great in this generation.","Q":"Ona wysławia sędziego, który stał się wielki w tym pokoleniu.","A":"הִיא מְשַׁבְּחָה לְדַיָּנָא דִּי רְבָה בְּדָרָא דְנָה׃","T":"hîʾ məšabbəḥâ lədayyānā dî rəbâ bədārā dənâ","N":"מְשַׁבְּחָה – D (paʿʿel) imiesłów r. ż. l.poj. od שׁבח. רְבָה – G perf. 3 m. l.poj. od רבי „wzrosnąć, stać się wielkim” (Dn 4,8). דָּרָא – st. emf. od דָּר „pokolenie” (hebr. דּוֹר).","R":"Greenspahn 19 – na aramejski, 5"},{"k":"E","n":6,"E":"I searched in the treasure house, and there was damage there.","Q":"Przeszukałem skarbiec i była tam szkoda.","A":"בַּקְּרֵת בְּבֵית גִּנְזַיָּא וַחֲבָל הֲוָה תַמָּה׃","T":"baqqərēt bəbêt ginzayyā waḥăbāl hăwâ tammâ","N":"בַּקְּרֵת – D (paʿʿel) perf. 1 l.poj. od בקר „przeszukać” (por. Ezd 6,1 וּבַקַּרוּ). חֲבָל „szkoda” (Dn 3,25).","R":"Greenspahn 19 – na aramejski, 6"},{"k":"E","n":7,"E":"He will tell us the interpretation of your dream.","Q":"On oznajmi nam wykład twojego snu.","A":"פְּשַׁר חֶלְמָךְ יְחַוֵּא לַנָא׃","T":"pəšar ḥelmāk yəḥawwē lanā","N":"יְחַוֵּא – D (paʿʿel) imperf. 3 m. l.poj. od חוי „oznajmić”. חֶלְמָךְ – חֵלֶם + sufiks 2 m. l.poj. -āk. לַנָא – לְ + sufiks 1 l.mn. Dopełnienie wysunięte przed orzeczenie (por. Dn 2,4).","R":"Greenspahn 19 – na aramejski, 7"},{"k":"E","n":8,"E":"The wise men said to loosen the hair from my head.","Q":"Mędrcy powiedzieli, aby rozwiązać włosy z mojej głowy.","A":"חַכִּימַיָּא אֲמַרוּ לְשָׁרָיָה שְׂעַר מִן רֵאשִׁי׃","T":"ḥakkîmayyā ʾămarû ləšārāyâ śəʿar min rēʾšî","N":"אֲמַרוּ + bezokolicznik = „powiedzieli, aby…”. לְשָׁרָיָה – D (paʿʿel) bezokolicznik od שׁרי „rozwiązać” (Dn 5,12 מְשָׁרֵא קִטְרִין; zastępcze wydłużenie a > ā przed ר). שְׂעַר „włos(y)” (hebr. שֵׂעָר).","R":"Greenspahn 19 – na aramejski, 8"}],"20":[{"k":"E","n":1,"E":"The sound of the horn reaches the heavens.","Q":"Dźwięk rogu sięga niebios.","A":"קָל קַרְנָא מָטֵא לִשְׁמַיָּא׃","T":"qāl qarnā māṭē lišmayyā","N":"מָטֵא – G imiesłów czynny m. l.poj. od מטי „sięgać, docierać” (por. Dn 4,8 יִמְטֵא לִשְׁמַיָּא). קָל קַרְנָא – st. konstr. + st. emf.","R":"Greenspahn 20 – na aramejski, 1"},{"k":"E","n":2,"E":"Behold, the wind is smashing the vessels under the palace.","Q":"Oto wiatr miażdży naczynia pod pałacem.","A":"הָא רוּחָא מְהַדְּקָה מָאנַיָּא תְּחוֹת הֵיכְלָא׃","T":"hāʾ rûḥā məhaddəqâ māʾnayyā təḥôt hêkəlā","N":"הָא „oto”. רוּחָא – st. emf. „wiatr” (r. ż.) → imiesłów r. ż. מְהַדְּקָה – H (hafʿel) imiesłów od דקק (por. Dn 2,40 מְהַדֵּק).","R":"Greenspahn 20 – na aramejski, 2"},{"k":"E","n":3,"E":"The hair grew like foliage.","Q":"Włosy urosły jak listowie.","A":"שַׂעְרָא רְבָה כְּעָפְיָא׃","T":"śaʿrā rəbâ kəʿopyā","N":"שַׂעְרָא – st. emf. od שְׂעַר (wzór segolowy: *śaʿr-). רְבָה – G perf. 3 m. l.poj. od רבי „rosnąć” (por. Dn 4,30 שַׂעְרֵהּ ... רְבָה). עָפְיָא – st. emf. od עֳפִי „listowie” (Dn 4,9).","R":"Greenspahn 20 – na aramejski, 3"},{"k":"E","n":4,"E":"The bird brought gold out of the tree.","Q":"Ptak wyniósł złoto z drzewa.","A":"צִפְּרָא הַנְפְּקַת דַּהֲבָא מִן אִילָנָא׃","T":"ṣippərā hanpəqat dahăbā min ʾîlānā","N":"צִפַּר „ptak” jest r. ż. → H (hafʿel) perf. 3 ż. l.poj. הַנְפְּקַת od נפק „wynieść” (n zachowane). אִילָנָא – st. emf. „drzewo”.","R":"Greenspahn 20 – na aramejski, 4"},{"k":"E","n":5,"E":"The word of the king will frighten the holy men of Babylon.","Q":"Słowo króla przestraszy świętych mężów Babilonu.","A":"מִלַּת מַלְכָּא תְּבַהֵל קַדִּישֵׁי בָבֶל׃","T":"millat malkā təbahēl qaddîšê bābel","N":"מִלַּת – st. konstr. od מִלָּה (r. ż.) → orzeczenie w 3 ż.: תְּבַהֵל – D (paʿʿel) imperf. od בהל „przestraszyć” (zastępcze wydłużenie przed ה). קַדִּישֵׁי – l.mn. st. konstr. od קַדִּישׁ.","R":"Greenspahn 20 – na aramejski, 5"},{"k":"E","n":6,"E":"The magicians fear that God will make Daniel ruler over them.","Q":"Magowie boją się, że Bóg uczyni Daniela władcą nad nimi.","A":"חַרְטֻמַּיָּא דָּחֲלִין דִּי אֱלָהָא יְהַשְׁלֵט לְדָנִיֵּאל עֲלֵיהוֹן׃","T":"ḥarṭummayyā dāḥălîn dî ʾĕlāhā yəhašlēṭ lədāniyyēʾl ʿălêhôn","N":"דָּחֲלִין – G imiesłów od דחל „bać się”. יְהַשְׁלֵט – H (hafʿel) imperf. 3 m. l.poj. od שׁלט „uczynić władcą” (por. Dn 2,38 הַשְׁלְטָךְ). Dopełnienie osobowe z לְ.","R":"Greenspahn 20 – na aramejski, 6"},{"k":"E","n":7,"E":"The scribes said to bring the message before God.","Q":"Pisarze powiedzieli, aby przynieść wiadomość przed Boga.","A":"סָפְרַיָּא אֲמַרוּ לְהַיְתָיָה פִּתְגָמָא קֳדָם אֱלָהָא׃","T":"sāprayyā ʾămarû ləhaytāyâ pitgāmā qŏdām ʾĕlāhā","N":"אֲמַרוּ + bezokolicznik = „powiedzieli, aby…”. לְהַיְתָיָה – H (hafʿel) bezokolicznik od אתי „przynieść” (Dn 3,13).","R":"Greenspahn 20 – na aramejski, 7"}],"21":[{"k":"E","n":1,"E":"Then the magicians knew that the king heard the dream.","Q":"Wtedy magowie dowiedzieli się, że król usłyszał sen.","A":"אֱדַיִן יְדַעוּ חַרְטֻמַּיָּא דִּי מַלְכָּא שְׁמַע חֶלְמָא׃","T":"ʾĕdayin yədaʿû ḥarṭummayyā dî malkā šəmaʿ ḥelmā","N":"יְדַעוּ – G perf. 3 m. l.mn. od ידע (I-י). Szyk V–S w zdaniu głównym, S–V–O w podrzędnym. שְׁמַע – G perf. 3 m. l.poj. (III-gardłowa: a).","R":"Greenspahn 21 – na aramejski, 1"},{"k":"E","n":2,"E":"I am able to bind the body on top of the mountain.","Q":"Mogę związać ciało na szczycie góry.","A":"יָכִל אֲנָה לְכַפָּתָה גִּשְׁמָא עַל רֵאשׁ טוּרָא׃","T":"yākil ʾănâ ləkappātâ gišmā ʿal rēʾš ṭûrā","N":"יָכִל – G imiesłów od יכל „móc” (Dn 3,17) + zaimek = czas teraźniejszy. לְכַפָּתָה – D (paʿʿel) bezokolicznik od כפת (Dn 3,20). רֵאשׁ טוּרָא „szczyt (głowa) góry”.","R":"Greenspahn 21 – na aramejski, 2"},{"k":"E","n":3,"E":"Wisdom is like a burning fire.","Q":"Mądrość jest jak płonący ogień.","A":"חָכְמְתָא כְּנוּר יָקְדָה׃","T":"ḥokmətā kənûr yāqədâ","N":"Zdanie nominalne. נוּר jest r. ż. → imiesłów r. ż. יָקְדָה (st. abs.; por. Dn 3,6 נוּרָא יָקִדְתָּא w st. emf.).","R":"Greenspahn 21 – na aramejski, 3"},{"k":"E","n":4,"E":"The interpretation damaged all who heard it.","Q":"Wykład zaszkodził wszystkim, którzy go usłyszeli.","A":"פִּשְׁרָא חַבֵּל לְכָל־דִּי שְׁמַעוּהִי׃","T":"pišrā ḥabbēl ləkol-dî šəmaʿûhî","N":"חַבֵּל – D (paʿʿel) perf. 3 m. l.poj. od חבל „zaszkodzić, zniszczyć”. לְכָל דִּי „wszystkim, którzy”. שְׁמַעוּהִי – G perf. 3 m. l.mn. + sufiks 3 m. l.poj. (-ûhî) „usłyszeli go”.","R":"Greenspahn 21 – na aramejski, 4"},{"k":"E","n":5,"E":"One man builds a house, and another man smashes it.","Q":"Jeden człowiek buduje dom, a inny człowiek go miażdży.","A":"גְּבַר חַד בָּנֵה בַּיִת וּגְבַר אָחֳרָן מְהַדֵּק לֵהּ׃","T":"gəbar ḥad bānē bayit ûgəbar ʾoḥŏrān məhaddēq lēh","N":"בָּנֵה – G imiesłów czynny m. l.poj. od בני (III-י). מְהַדֵּק – H (hafʿel) imiesłów od דקק. לֵהּ – zaimek dopełnienia z לְ „go”. Paralelizm: חַד ... אָחֳרָן.","R":"Greenspahn 21 – na aramejski, 5"},{"k":"E","n":6,"E":"My hair is wet with dew.","Q":"Moje włosy są zwilżone rosą.","A":"שַׂעְרִי מְצַבַּע בְּטַל׃","T":"śaʿrî məṣabbaʿ bəṭal","N":"שַׂעְרִי – שְׂעַר + sufiks 1 l.poj. מְצַבַּע – D (paʿʿel) imiesłów bierny od צבע „zwilżony” (por. Dn 4,22 מְצַבְּעִין, 4,12 יִצְטַבַּע). בְּטַל „rosą” (hebr. טַל).","R":"Greenspahn 21 – na aramejski, 6"},{"k":"E","n":7,"E":"The interpretation of the dream changed the king’s heart.","Q":"Wykład snu zmienił serce króla.","A":"פְּשַׁר חֶלְמָא שַׁנִּי לְבַב מַלְכָּא׃","T":"pəšar ḥelmā šannî ləbab malkā","N":"שַׁנִּי – D (paʿʿel) perf. 3 m. l.poj. od שׁני (III-י) „zmienić”. לְבַב מַלְכָּא – st. konstr. (por. Dn 4,13 לִבְבֵהּ ... יְשַׁנּוֹן).","R":"Greenspahn 21 – na aramejski, 7"},{"k":"E","n":8,"E":"A holy one came down when he heard the word of the Most High.","Q":"Święty zstąpił, gdy usłyszał słowo Najwyższego.","A":"קַדִּישׁ נְחַת כְּדִי שְׁמַע מִלַּת עִלָּיָא׃","T":"qaddîš nəḥat kədî šəmaʿ millat ʿillāyā","N":"נְחַת – G perf. 3 m. l.poj. od נחת „zstąpić” (Dn 4,10 nāḥit – imiesłów). כְּדִי „gdy”. עִלָּיָא „Najwyższy” (ketiw; keri עִלָּאָה).","R":"Greenspahn 21 – na aramejski, 8"},{"k":"E","n":9,"E":"They cut down the tree that reached into the heavens.","Q":"Ścięli drzewo, które sięgało niebios.","A":"גַּדּוּ אִילָנָא דִּי מְטָא לִשְׁמַיָּא׃","T":"gaddû ʾîlānā dî məṭā lišmayyā","N":"גַּדּוּ – G perf. 3 m. l.mn. od גדד „ściąć” (II=III; imperatyw גֹּדּוּ, Dn 4,11). מְטָא – G perf. 3 m. l.poj. od מטי (III-י).","R":"Greenspahn 21 – na aramejski, 9"},{"k":"E","n":10,"E":"We went to praise them.","Q":"Poszliśmy, aby ich wysławiać.","A":"אֲזַלְנָא לְשַׁבָּחָה לְהוֹן׃","T":"ʾăzalnā ləšabbāḥâ ləhôn","N":"אֲזַלְנָא – G perf. 1 l.mn. „poszliśmy”. לְשַׁבָּחָה – D (paʿʿel) bezokolicznik od שׁבח (wzór qaṭṭālâ). לְהוֹן – dopełnienie z לְ „ich”.","R":"Greenspahn 21 – na aramejski, 10"}],"22":[{"k":"E","n":1,"E":"The priests drove the governor from the city.","Q":"Kapłani wypędzili namiestnika z miasta.","A":"כָּהֲנַיָּא טְרַדוּ לְפֶחָה מִן קִרְיְתָא׃","T":"kāhănayyā ṭəradû ləpeḥâ min qiryətā","N":"טְרַדוּ – G perf. 3 m. l.mn. od טרד „wypędzić” (por. Dn 4,22 טָרְדִין). Dopełnienie osobowe z לְ.","R":"Greenspahn 22 – na aramejski, 1"},{"k":"E","n":2,"E":"The animal’s dwelling is in a tree.","Q":"Mieszkanie zwierzęcia jest na drzewie.","A":"מְדוֹר חֵיוְתָא בְּאִילָן׃","T":"mədôr ḥêwətā bəʾîlān","N":"מְדוֹר – st. konstr. „mieszkanie” (od דור; Dn 4,22 מְדֹרָךְ). חֵיוְתָא – st. emf. od חֵיוָה. Zdanie nominalne.","R":"Greenspahn 22 – na aramejski, 2"},{"k":"E","n":3,"E":"At the end of the day his strength passed away.","Q":"Pod koniec dnia jego siła przeminęła.","A":"לִקְצָת יוֹמָא תָּקְפֵּהּ עֲדָה׃","T":"liqṣāt yômā toqpēh ʿădâ","N":"לִקְצָת „pod koniec” (Dn 4,26). תָּקְפֵּהּ – תְּקָף „siła” + sufiks 3 m. l.poj. (kamec chatuf: toqp-). עֲדָה – G perf. 3 m. l.poj. od עדי „przeminąć, odejść” (Dn 4,28 עֲדָת – r. ż.).","R":"Greenspahn 22 – na aramejski, 3"},{"k":"E","n":4,"E":"The magician lifted his hands and blessed the silver statue.","Q":"Mag podniósł ręce i pobłogosławił srebrny posąg.","A":"חַרְטֻמָּא נְטַל יְדוֹהִי וּבָרִךְ לְצֶלֶם כַּסְפָּא׃","T":"ḥarṭummā nəṭal yədôhî ûbārik ləṣelem kaspā","N":"נְטַל – G perf. 3 m. l.poj. od נטל „podnieść” (Dn 4,31 נִטְלֵת). יְדוֹהִי – l.podw. + sufiks 3 m. l.poj. בָּרִךְ – D (paʿʿel) perf. 3 m. l.poj. od ברך (zastępcze wydłużenie a > ā przed ר; Dn 2,19). צֶלֶם כַּסְפָּא „posąg ze srebra”.","R":"Greenspahn 22 – na aramejski, 4"},{"k":"E","n":5,"E":"I returned to bring the letter up to the top of the mountain.","Q":"Wróciłem, aby wnieść list na szczyt góry.","A":"תָּבֵת לְהַנְסָקָה אִגַּרְתָּא לְרֵאשׁ טוּרָא׃","T":"tābēt ləhansāqâ ʾiggartā lərēʾš ṭûrā","N":"תָּבֵת – G perf. 1 l.poj. od תוב „wrócić” (II-ו; hebr. שַׁבְתִּי; ת ~ שׁ). לְהַנְסָקָה – H (hafʿel) bezokolicznik od סלק z dysymilacją ל > נ (Dn 6,24).","R":"Greenspahn 22 – na aramejski, 5"}],"23":[{"k":"A","n":1,"A":"מַלְכָּא כַּפֵּת חַרְטֻמַּיָּא׃","T":"malkā kappēt ḥarṭummayyā","P":"Król związał magów.","N":"Ćwiczenie: zapisz zdanie na dwa inne sposoby, wyrażając dopełnienie bliższe inaczej. (a) מַלְכָּא כַּפֵּת לְחַרְטֻמַּיָּא – dopełnienie z לְ; (b) מַלְכָּא כַּפֵּת יַת חַרְטֻמַּיָּא – z partykułą יַת (= hebr. אֶת). Zmiana szyku: כַּפֵּת מַלְכָּא חַרְטֻמַּיָּא (V–S–O); חַרְטֻמַּיָּא כַּפֵּת מַלְכָּא (O–V–S). כַּפֵּת – D (paʿʿel) perf. 3 m. l.poj. od כפת.","R":"Greenspahn 23,1"},{"k":"A","n":2,"A":"יַת חֶלְמָא פְּשַׁר דָּנִיֵּאל׃","T":"yat ḥelmā pəšar dāniyyēʾl","P":"Daniel wyłożył sen (dosł. sen wyłożył Daniel).","N":"Dopełnienie z partykułą יַת (znacznik dopełnienia bliższego = hebr. אֶת; w Dn 3,12 z sufiksem: יָתְהוֹן), wysunięte na początek (O–V–S). Warianty: (a) לְחֶלְמָא פְּשַׁר דָּנִיֵּאל; (b) חֶלְמָא פְּשַׁר דָּנִיֵּאל (bez znacznika). Zmiana szyku: דָּנִיֵּאל פְּשַׁר יַת חֶלְמָא; פְּשַׁר דָּנִיֵּאל יַת חֶלְמָא. פְּשַׁר – G perf. 3 m. l.poj. „wykładać, interpretować”.","R":"Greenspahn 23,2"},{"k":"A","n":3,"A":"קְטַלוּ גֻּבְרַיָּא לְכָהֲנַיָּא׃","T":"qəṭalû gubrayyā ləkāhănayyā","P":"Mężowie zabili kapłanów.","N":"Szyk V–S–O, dopełnienie z לְ. Warianty: (a) קְטַלוּ גֻּבְרַיָּא יַת כָּהֲנַיָּא; (b) קְטַלוּ גֻּבְרַיָּא כָּהֲנַיָּא. Zmiana szyku: גֻּבְרַיָּא קְטַלוּ לְכָהֲנַיָּא; לְכָהֲנַיָּא קְטַלוּ גֻּבְרַיָּא. קְטַלוּ – G perf. 3 m. l.mn. od קטל.","R":"Greenspahn 23,3"},{"k":"E","n":1,"E":"They drank wine with the meal.","Q":"Pili wino podczas posiłku.","A":"אִשְׁתִּיו חַמְרָא עִם לַחְמָא׃","T":"ʾištîw ḥamrā ʿim laḥmā","N":"אִשְׁתִּיו – G perf. 3 m. l.mn. od שׁתי „pić” z alefem prostetycznym (Dn 5,3–4). חַמְרָא „wino” (Dn 5,1). לַחְמָא – st. emf. od לְחֶם „posiłek, uczta”.","R":"Greenspahn 23 – na aramejski, 1"},{"k":"E","n":2,"E":"The big finger wrote a message.","Q":"Duży palec napisał wiadomość.","A":"אֶצְבְּעָא רַבְּתָא כִּתְבַת פִּתְגָם׃","T":"ʾeṣbəʿā rabbətā kitbat pitgām","N":"אֶצְבַּע jest r. ż. → przymiotnik רַבְּתָא i orzeczenie כִּתְבַת (G perf. 3 ż. l.poj.).","R":"Greenspahn 23 – na aramejski, 2"},{"k":"E","n":3,"E":"The golden vessels were found in the temple.","Q":"Złote naczynia zostały znalezione w świątyni.","A":"מָאנֵי דַהֲבָא הִשְׁתְּכַחוּ בְּהֵיכְלָא׃","T":"māʾnê dahăbā hištəkaḥû bəhêkəlā","N":"מָאנֵי דַהֲבָא „naczynia złota” = złote naczynia (Dn 5,3). הִשְׁתְּכַחוּ – Gt (hitpeʿel) perf. 3 m. l.mn. od שׁכח z metatezą ת i שׁ.","R":"Greenspahn 23 – na aramejski, 3"},{"k":"E","n":4,"E":"The priest called the people to pray.","Q":"Kapłan wezwał lud do modlitwy.","A":"כָּהֲנָא קְרָא לְעַמָּא לְצַלָּיָה׃","T":"kāhănā qərā ləʿammā ləṣallāyâ","N":"קְרָא – G perf. 3 m. l.poj. od קרא „wołać, wzywać”. לְצַלָּיָה – D (paʿʿel) bezokolicznik od צלי.","R":"Greenspahn 23 – na aramejski, 4"},{"k":"E","n":5,"E":"The queen wore gold on her head.","Q":"Królowa nosiła złoto na głowie.","A":"מַלְכְּתָא לִבְשַׁת דַּהֲבָא עַל רֵאשַׁהּ׃","T":"malkətā libšat dahăbā ʿal rēʾšah","N":"מַלְכְּתָא – „królowa” (Dn 5,10). לִבְשַׁת – G perf. 3 ż. l.poj. od לבשׁ (wzór qətil). רֵאשַׁהּ – רֵאשׁ + sufiks 3 ż. l.poj. -ah.","R":"Greenspahn 23 – na aramejski, 5"},{"k":"E","n":6,"E":"The strong thoughts frightened me.","Q":"Silne myśli mnie przeraziły.","A":"רַעְיוֹנַיָּא תַקִּיפַיָּא בַּהֲלוּנִי׃","T":"raʿyônayyā taqqîpayyā bahălûnî","N":"רַעְיוֹנַיָּא – l.mn. st. emf. od רַעְיוֹן „myśl” (Dn 5,6). בַּהֲלוּנִי – D (paʿʿel) perf. 3 m. l.mn. od בהל + sufiks 1 l.poj.","R":"Greenspahn 23 – na aramejski, 6"},{"k":"E","n":7,"E":"The wall of the house is wood.","Q":"Ściana domu jest z drewna.","A":"כְּתַל בַּיְתָא אָע׃","T":"kətal baytā ʾāʿ","N":"Zdanie nominalne. כְּתַל „ściana” (Dn 5,5). אָע „drewno” (hebr. עֵץ; dysymilacja: *ʿiḍ > ʾāʿ).","R":"Greenspahn 23 – na aramejski, 7"},{"k":"E","n":8,"E":"The splendor of his wisdom went out to the whole land.","Q":"Blask jego mądrości rozszedł się na całą ziemię.","A":"זִיו חָכְמְתֵהּ נְפַק לְכָל־אַרְעָא׃","T":"zîw ḥokmətēh nəpaq ləkol-ʾarʿā","N":"זִיו „blask” (Dn 2,31). חָכְמְתֵהּ – חָכְמָה + sufiks 3 m. l.poj. (ת żeńskie wraca). נְפַק – G perf. 3 m. l.poj. „wyszedł”.","R":"Greenspahn 23 – na aramejski, 8"}],"24":[{"k":"E","n":1,"E":"The letter was written in Jerusalem.","Q":"List został napisany w Jerozolimie.","A":"אִגַּרְתָּא כְּתִיבַת בִּירוּשְׁלֶם׃","T":"ʾiggartā kətîbat bîrûšəlem","N":"כְּתִיבַת – G bierny (peʿil) perf. 3 ż. l.poj. od כתב (por. Dn 5,28 פְּרִיסַת).","R":"Greenspahn 24 – na aramejski, 1"},{"k":"E","n":2,"E":"He is raising the palace on the mountain.","Q":"On wznosi pałac na górze.","A":"הוּא מָרִים הֵיכְלָא עַל טוּרָא׃","T":"hûʾ mārîm hêkəlā ʿal ṭûrā","N":"מָרִים – H/A (ʾafʿel) imiesłów od רום „wywyższać, wznosić” (Dn 5,19). Zaimek + imiesłów = czas teraźniejszy.","R":"Greenspahn 24 – na aramejski, 2"},{"k":"E","n":3,"E":"The throne was lowered from the heavens.","Q":"Tron został opuszczony z niebios.","A":"כָּרְסְיָא הָנְחַת מִן שְׁמַיָּא׃","T":"korsəyā honḥat min šəmayyā","N":"כָּרְסְיָא – st. emf. od כָּרְסֵא „tron” (dysymilacja rs; hebr. כִּסֵּא). הָנְחַת – H bierny (hufʿal) perf. 3 m. l.poj. od נחת (Dn 5,20).","R":"Greenspahn 24 – na aramejski, 3"},{"k":"E","n":4,"E":"The master’s dream was interpreted there.","Q":"Sen pana został tam wyłożony.","A":"חֶלְמָא דִּי מָרֵא פְּשִׁר תַּמָּה׃","T":"ḥelmā dî mārēʾ pəšir tammâ","N":"חֶלְמָא דִּי מָרֵא – dopełniacz analityczny „sen pana” (מָרֵא „pan”, Dn 5,23). פְּשִׁר – G bierny (peʿil) perf. 3 m. l.poj. od פשׁר (samogłoska i).","R":"Greenspahn 24 – na aramejski, 4"},{"k":"E","n":5,"E":"The great gods are praised on earth.","Q":"Wielcy bogowie są wysławiani na ziemi.","A":"אֱלָהַיָּא רַבְרְבַיָּא מִשְׁתַּבְּחִין בְּאַרְעָא׃","T":"ʾĕlāhayyā rabrəbayyā mištabbəḥîn bəʾarʿā","N":"רַבְרְבַיָּא – l.mn. od רַב z reduplikacją (Dn 7,3). מִשְׁתַּבְּחִין – Dt (hitpaʿʿal) imiesłów m. l.mn. od שׁבח z metatezą ת i שׁ – znaczenie bierne „wysławiani”.","R":"Greenspahn 24 – na aramejski, 5"},{"k":"E","n":6,"E":"They asked him to bring the silver to the big palace.","Q":"Poprosili go, aby przyniósł srebro do wielkiego pałacu.","A":"בְּעוֹ מִנֵּהּ לְהֵיבָלָה כַּסְפָּא לְהֵיכְלָא רַבָּא׃","T":"bəʿô minnēh ləhêbālâ kaspā ləhêkəlā rabbā","N":"בְּעוֹ – G perf. 3 m. l.mn. od בעי „prosić” (III-י: -ô). בְּעָא מִן „prosić kogoś” (Dn 2,16). לְהֵיבָלָה – H (hafʿel) bezokolicznik od יבל „zanieść” (Ezd 7,15).","R":"Greenspahn 24 – na aramejski, 6"},{"k":"E","n":7,"E":"Daniel became ruler, and his glory was like a king.","Q":"Daniel stał się władcą, a jego chwała była jak [chwała] króla.","A":"דָּנִיֵּאל הֲוָה שַׁלִּיט וִיקָרֵהּ הֲוָה כְּמֶלֶךְ׃","T":"dāniyyēʾl hăwâ šallîṭ wîqārēh hăwâ kəmelek","N":"הֲוָה + orzecznik = „był, stał się”. שַׁלִּיט „władca, panujący”. וִיקָרֵהּ – וְ + יְקָר „chwała” + sufiks 3 m. l.poj. (wə + yə > wî).","R":"Greenspahn 24 – na aramejski, 7"},{"k":"E","n":8,"E":"God gave greatness to the province and to its governor.","Q":"Bóg dał wielkość prowincji i jej namiestnikowi.","A":"אֱלָהָא יְהַב רְבוּ לִמְדִינְתָּא וּלְפַחֲתַהּ׃","T":"ʾĕlāhā yəhab rəbû limdîntā ûləpaḥătah","N":"רְבוּ „wielkość” (Dn 4,33; 5,18). פַּחֲתַהּ – פֶּחָה (st. konstr. פַּחַת) + sufiks 3 ż. l.poj. -ah „jej namiestnik” (sufiks odnosi się do מְדִינְתָּא, r. ż.).","R":"Greenspahn 24 – na aramejski, 8"},{"k":"E","n":9,"E":"The earth was finished in six days.","Q":"Ziemia została ukończona w sześć dni.","A":"אַרְעָא שְׁלִמַת בְּיוֹמִין שִׁתָּה׃","T":"ʾarʿā šəlimat bəyômîn šittâ","N":"שְׁלִמַת – G perf. 3 ż. l.poj. od שׁלם „zostać ukończonym” (czasownik stanowy; Ezd 5,16 שְׁלִם). Liczebnik 6 przy rzeczowniku męskim: שִׁתָּה, po rzeczowniku.","R":"Greenspahn 24 – na aramejski, 9"}],"25":[{"k":"E","n":1,"E":"The wise father wrote a statute at night.","Q":"Mądry ojciec napisał ustawę w nocy.","A":"אַבָּא חַכִּימָא כְּתַב קְיָם בְּלֵילְיָא׃","T":"ʾabbā ḥakkîmā kətab qəyām bəlêlyā","N":"קְיָם „ustawa, postanowienie” (Dn 6,8). בְּלֵילְיָא „w nocy” (Dn 5,30).","R":"Greenspahn 25 – na aramejski, 1"},{"k":"E","n":2,"E":"A strong lion fell into the big pit.","Q":"Silny lew wpadł do wielkiej jamy.","A":"אַרְיֵה תַּקִּיף נְפַל לְגֻבָּא רַבָּא׃","T":"ʾaryē taqqîp nəpal ləgubbā rabbā","N":"אַרְיֵה – st. abs. „lew” (l.mn. det. אַרְיָוָתָא). גֻּבָּא – st. emf. od גֹּב „jama” (Dn 6,17).","R":"Greenspahn 25 – na aramejski, 2"},{"k":"E","n":3,"E":"The satraps assembled before the throne.","Q":"Satrapowie zgromadzili się przed tronem.","A":"אֲחַשְׁדַּרְפְּנַיָּא הִתְכַּנַּשׁוּ קֳדָם כָּרְסְיָא׃","T":"ʾăḥašdarpənayyā hitkannašû qŏdām korsəyā","N":"הִתְכַּנַּשׁוּ – Dt (hitpaʿʿal) perf. 3 m. l.mn. od כנשׁ „zgromadzić się” (zwrotne; por. Dn 3,3 מִתְכַּנְּשִׁין). אֲחַשְׁדַּרְפְּנַיָּא – perskie „satrapowie”.","R":"Greenspahn 25 – na aramejski, 3"},{"k":"E","n":4,"E":"The message was received in the rebellious city.","Q":"Wiadomość została przyjęta w buntowniczym mieście.","A":"פִּתְגָמָא אִתְקַבַּל בְּקִרְיְתָא מָרָדְתָּא׃","T":"pitgāmā ʾitqabbal bəqiryətā mārādtā","N":"אִתְקַבַּל – Dt (ʾitpaʿʿal; prefiks אִת־ zamiast הִת־) perf. 3 m. l.poj. od קבל – znaczenie bierne „został przyjęty”.","R":"Greenspahn 25 – na aramejski, 4"},{"k":"E","n":5,"E":"Surely, the faithful priest will be pleasing to the people.","Q":"Na pewno wierny kapłan spodoba się ludowi.","A":"מִן־יַצִּיב כָּהֲנָא מְהֵימְנָא יִשְׁפַּר קֳדָם עַמָּא׃","T":"min-yaṣṣîb kāhănā məhêmnā yišpar qŏdām ʿammā","N":"מְהֵימְנָא – H (hafʿel) imiesłów bierny od אמן „wierny”, st. emf. (Dn 6,5 מְהֵימַן). שְׁפַר קֳדָם „spodobać się (komuś)” (Dn 6,2); יִשְׁפַּר – G imperf. 3 m. l.poj.","R":"Greenspahn 25 – na aramejski, 5"},{"k":"E","n":6,"E":"The governor sought a pretext to kill the men.","Q":"Namiestnik szukał pretekstu, aby zabić mężów.","A":"פֶּחָה בְּעָא עִלָּה לְקַטָּלָה לְגֻבְרַיָּא׃","T":"peḥâ bəʿā ʿillâ ləqaṭṭālâ ləgubrayyā","N":"בְּעָא – G perf. 3 m. l.poj. od בעי „szukać”. עִלָּה „pretekst” (Dn 6,5). לְקַטָּלָה – D (paʿʿel) bezokolicznik od קטל (Dn 2,14); dopełnienie z לְ.","R":"Greenspahn 25 – na aramejski, 6"}],"26":[{"k":"E","n":1,"E":"The father saved his son from the wild animals (lit. “animals of the field”).","Q":"Ojciec ocalił swojego syna przed dzikimi zwierzętami (dosł. zwierzętami pola).","A":"אַבָּא שֵׁיזִב לִבְרֵהּ מִן חֵיוַת בָּרָא׃","T":"ʾabbā šêzib librēh min ḥêwat bārā","N":"שֵׁיזִב – Š (šafʿel) perf. 3 m. l.poj. „ocalić” (zapożyczenie akad. šūzubu; Dn 3,28). לִבְרֵהּ – dopełnienie z לְ. חֵיוַת בָּרָא „zwierzęta pola” (Dn 2,38).","R":"Greenspahn 26 – na aramejski, 1"},{"k":"E","n":2,"E":"The scribe completed the work on the fourth kingdom.","Q":"Pisarz ukończył dzieło o czwartym królestwie.","A":"סָפְרָא שַׁכְלֵל עֲבִידְתָּא עַל מַלְכוּתָא רְבִיעָיְתָא׃","T":"sāprā šaklēl ʿăbîdtā ʿal malkûtā rəbîʿāytā","N":"שַׁכְלֵל – Š (šafʿel) perf. 3 m. l.poj. od כלל „ukończyć” (Ezd 5,11 שַׁכְלְלֵהּ). עֲבִידְתָּא – st. emf. od עֲבִידָה. רְבִיעָיְתָא – liczebnik porządkowy r. ż., st. emf. (מַלְכוּ jest r. ż.).","R":"Greenspahn 26 – na aramejski, 2"},{"k":"E","n":3,"E":"The king assembled the people to praise God at night.","Q":"Król zgromadził lud, aby w nocy wysławiać Boga.","A":"מַלְכָּא כְּנַשׁ לְעַמָּא לְשַׁבָּחָה לֶאֱלָהָא בְּלֵילְיָא׃","T":"malkā kənaš ləʿammā ləšabbāḥâ leʾĕlāhā bəlêlyā","N":"כְּנַשׁ – G perf. 3 m. l.poj. „zgromadzić” (Dn 3,2 לְמִכְנַשׁ). לְשַׁבָּחָה – D bezokolicznik od שׁבח. לֶאֱלָהָא – dopełnienie z לְ (segol przed ḥaṭef segol).","R":"Greenspahn 26 – na aramejski, 3"},{"k":"E","n":4,"E":"I sought to leave the city when the king issued that prohibition.","Q":"Starałem się (dosł. szukałem, by) opuścić miasto, gdy król wydał tamten zakaz.","A":"בְּעֵית לְמִשְׁבַּק קִרְיְתָא כְּדִי מַלְכָּא רְשַׁם אֱסָרָא דֵךְ׃","T":"bəʿêt ləmišbaq qiryətā kədî malkā rəšam ʾĕsārā dēk","N":"בְּעֵית – G perf. 1 l.poj. od בעי (III-י: -êt). כְּדִי „gdy”. רְשַׁם אֱסָרָא „podpisać/wydać zakaz” (Dn 6,10.13). דֵךְ – zaimek odległy m. l.poj.","R":"Greenspahn 26 – na aramejski, 4"},{"k":"E","n":5,"E":"I went up on the mountain when a lion approached.","Q":"Wszedłem na górę, gdy zbliżył się lew.","A":"סִלְקֵת עַל טוּרָא כְּדִי אַרְיֵה קְרֵב׃","T":"silqēt ʿal ṭûrā kədî ʾaryē qərēb","N":"סִלְקֵת – G perf. 1 l.poj. od סלק „wejść, wstąpić”. קְרֵב – G perf. 3 m. l.poj. od קרב „zbliżyć się” (Dn 3,26).","R":"Greenspahn 26 – na aramejski, 5"},{"k":"E","n":6,"E":"We are closing the statue’s mouth.","Q":"Zamykamy usta posągu.","A":"אֲנַחְנָה סָגְרִין פֻּם צַלְמָא׃","T":"ʾănaḥnâ sāgərîn pum ṣalmā","N":"סָגְרִין – G imiesłów czynny m. l.mn. od סגר „zamykać” (Dn 6,23 סֲגַר). פֻּם צַלְמָא – st. konstr. „usta posągu”.","R":"Greenspahn 26 – na aramejski, 6"},{"k":"E","n":7,"E":"The Jews succeeded when they were driven out into exile.","Q":"Żydom powiodło się, gdy zostali wypędzeni na wygnanie.","A":"יְהוּדָיֵא הַצְלַחוּ כְּדִי טְרִידוּ לְגָלוּתָא׃","T":"yəhûdāyē haṣlaḥû kədî ṭərîdû ləgālûtā","N":"הַצְלַחוּ – H (hafʿel) perf. 3 m. l.mn. od צלח, nieprzechodnio „mieć powodzenie” (Dn 6,29). טְרִידוּ – G bierny (peʿil) perf. 3 m. l.mn. od טרד „zostali wypędzeni”. גָּלוּתָא „wygnanie” (Dn 2,25).","R":"Greenspahn 26 – na aramejski, 7"},{"k":"E","n":8,"E":"The living God spoke in former times.","Q":"Żywy Bóg przemówił w dawnych czasach.","A":"אֱלָהָא חַיָּא מַלִּל מִן־קַדְמַת דְּנָה׃","T":"ʾĕlāhā ḥayyā mallil min-qadmat dənâ","N":"אֱלָהָא חַיָּא „Bóg żywy” (Dn 6,21). מַלִּל – D (paʿʿel) perf. 3 m. l.poj. od מלל „mówić” (Dn 6,22). מִן־קַדְמַת דְּנָה „przedtem, dawniej” (Ezd 5,11).","R":"Greenspahn 26 – na aramejski, 8"}]};

</script>
<script>
(function(){
'use strict';
/* ---------- narzędzia ---------- */
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app');
const HEB=/[֐-׿יִ-ﭏ]/;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* tekst mieszany: zawija ciągi hebrajskie w span.he */
function rich(s){
  s=esc(s);
  return s.replace(/[֐-׿יִ-ﭏ](?:[֐-׿יִ-ﭏ\s\/·,]*[֐-׿יִ-ﭏ])?/g,m=>'<span class="he" lang="arc">'+m+'</span>');
}
const he=s=>'<span class="he" lang="arc">'+esc(s)+'</span>';
const repBtn=ctx=>`<button type="button" class="repbtn" data-rep="${encodeURIComponent(ctx)}" title="Zgłoś błąd w tym miejscu">⚑ Zgłoś błąd</button>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const strip=s=>s.normalize('NFD').replace(/[֑-ׇ̀-ͯ]/g,'').replace(/[ʾʿ]/g,'').replace(/ł/g,'l').replace(/Ł/g,'L').toLowerCase();

/* ---------- transliteracja automatyczna (zdania) ---------- */
