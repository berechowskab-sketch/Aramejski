<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Trener aramejskiego biblijnego: lekcje, słówka, fiszki, quizy i zdania (Greenspahn, wykład TSL I).">
<meta name="theme-color" content="#1E3C8A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%231E3C8A%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23E0B05A%22 font-family=%22serif%22%3E%D7%9B%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Trener aramejskiego biblijnego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@500;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+Hebrew:wght@400;500;600&display=swap">
<style>
/* Układ: wąska kolumna robocza (max 980px) pod lapisowym pasem nagłówka zakończonym „szkliwionymi cegłami” z Bramy Isztar. */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --sunk:#F5F6F9; --ink:#141A29; --muted:#4C566B; --line:#D4D9E2;
  --lapis:#1E3C8A; --lapis-ink:#FFFFFF; --lapis-soft:#E2E8F6; --gold:#A8761F; --gold-soft:#F4E9D3;
  --good:#2C7A4B; --good-soft:#E1F1E7; --bad:#B03E2C; --bad-soft:#F8E3DF;
  --f-display:"Brygada 1918", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-tr:"Gentium Book Plus", "Noto Serif", Georgia, serif;
  --f-he:"Noto Serif Hebrew", "SBL Hebrew", "Ezra SIL", "Times New Roman", serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#151D31; --sunk:#111829; --ink:#EEF0F6; --muted:#AAB3C8; --line:#26314B;
  --lapis:#223F8F; --lapis-ink:#F3F5FB; --lapis-soft:#1C2850; --gold:#E0B05A; --gold-soft:#372C17;
  --good:#6CC490; --good-soft:#163222; --bad:#EE8B77; --bad-soft:#3B1D18; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#151D31; --sunk:#111829; --ink:#EEF0F6; --muted:#AAB3C8; --line:#26314B;
  --lapis:#223F8F; --lapis-ink:#F3F5FB; --lapis-soft:#1C2850; --gold:#E0B05A; --gold-soft:#372C17;
  --good:#6CC490; --good-soft:#163222; --bad:#EE8B77; --bad-soft:#3B1D18; color-scheme:dark }
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.he{font-family:var(--f-he);direction:rtl;unicode-bidi:isolate;font-size:1.28em;line-height:1.75;font-weight:500}
.tr{font-family:var(--f-tr);font-style:italic;letter-spacing:.01em}
.muted{color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* nagłówek */
.top{background:var(--lapis);color:var(--lapis-ink);position:relative}
.top::after{content:"";display:block;height:8px;background:
  repeating-linear-gradient(90deg,var(--gold) 0 26px,transparent 26px 30px),var(--lapis);opacity:.95}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit}
.brand .he{font-size:28px;line-height:1;color:var(--lapis-ink)}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-size:12px;opacity:.8;font-weight:400}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main button{background:transparent;border:1px solid transparent;color:var(--lapis-ink);padding:8px 13px;border-radius:999px;cursor:pointer;font-size:15px;opacity:.9;min-height:40px}
nav.main button:hover{opacity:1;border-color:rgba(255,255,255,.35)}
nav.main button[aria-current="true"]{background:rgba(255,255,255,.16);opacity:1;border-color:rgba(255,255,255,.4)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#1A1406;font-size:11px;font-weight:600;line-height:18px;text-align:center;margin-left:4px}

main{padding-block:22px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.2}
h2{font-size:21px}
h3{font-size:16px}
.eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;min-height:44px;border-radius:9px;cursor:pointer;font-weight:500;font-size:15px}
.btn:hover{border-color:var(--lapis)}
.btn.primary{background:var(--lapis);color:var(--lapis-ink);border-color:var(--lapis)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}

/* strona główna */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:stretch}
.hero .intro p{margin:6px 0 0;max-width:60ch;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat>span{display:block;font-size:13px;line-height:1.3;color:var(--muted);margin-top:2px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:14px}
.lcard{display:grid;grid-template-columns:44px 1fr;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;align-items:start}
.lcard:hover{border-color:var(--lapis)}
.lnum{width:44px;height:44px;border-radius:8px;background:var(--lapis-soft);color:var(--lapis);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
:root[data-theme="dark"] .lnum{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lnum{color:var(--ink)}}
.lcard.done .lnum{background:var(--gold-soft);color:var(--gold)}
.lcard .lbody{min-width:0;display:block}
.lcard .lt{display:block;font-family:var(--f-display);font-weight:700;font-size:16.5px;line-height:1.3;text-wrap:balance}
.lcard .meta{display:block}
.lcard .bar{display:block}
.lcard .meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.bar{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
button.chip{cursor:pointer}
button.chip.proc{background:var(--gold-soft);color:var(--ink);border-color:transparent}

/* lekcja */
.lhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.lhead .lnum{width:56px;height:56px;font-size:20px}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:14px;margin-bottom:10px}
.back:hover{color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;cursor:pointer;font-weight:600;font-size:16px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.gblock{margin-bottom:18px}
.gblock h3{margin-bottom:6px;color:var(--lapis)}
:root[data-theme="dark"] .gblock h3{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gblock h3{color:var(--gold)}}
.gblock p{margin:0;max-width:72ch}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:12px;color:var(--muted)}
tr:last-child td{border-bottom:0}
td .he{font-size:1.4em}

/* słówka: dwie formy (aram. | hebr.) – każda z transliteracją pod spodem – oraz znaczenie */
.vlist{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.forms{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-right:1px solid var(--line)}
.form{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:2px;padding:12px 10px 14px;min-width:0}
.form+.form{border-left:1px dashed var(--line)}
.form .lab{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.form .w{display:block;max-width:100%;overflow-wrap:anywhere;line-height:1.5}
.form.ar .w{font-size:36px;font-weight:600}
.form.hb .w{font-size:29px}
.form .tr{display:block;font-size:16.5px;line-height:1.35;margin-top:2px;overflow-wrap:anywhere}
.form.ar .tr{color:var(--ink)}
.form.hb .tr{color:var(--muted)}
.form .none{font-size:22px;color:var(--muted);padding:6px 0}
.vrow .pl{padding:12px 16px 14px;min-width:0}
.vrow .pl .mean{font-size:18px;font-weight:600;line-height:1.35}
.vrow .note{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.5}
.lvl{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--gold)}
.procbox{margin-top:6px;font-size:15px;background:var(--gold-soft);border-radius:6px;padding:7px 10px}

/* fiszki */
.fc-wrap{max-width:560px;margin:0 auto}
.fc{perspective:1200px;height:300px;cursor:pointer;margin:14px 0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;gap:6px;overflow:auto}
.fc-face.back{transform:rotateY(180deg);background:var(--sunk)}
.fc-face .big.he{font-size:54px;line-height:1.35}
.fc-face .big.pl{font-family:var(--f-display);font-size:28px}
.fc-face .hint{position:absolute;bottom:10px;font-size:12px;color:var(--muted)}
.fc-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:16px;align-items:baseline}
.fc-grid dt{color:var(--muted);font-size:13px}
.fc-grid dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 12px;min-height:42px;cursor:pointer;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lapis-soft);color:var(--ink);font-weight:600}
.answer-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (prefers-reduced-motion: reduce){.fc-in{transition:none}}

/* quiz */
.q-card{max-width:640px;margin:0 auto}
.q-prompt{font-size:19px;margin:10px 0 16px;line-height:1.5}
.q-prompt .he{font-size:1.75em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 16px;min-height:52px;cursor:pointer;font-size:17px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--lapis)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt .he{font-size:1.5em}
.feedback{margin-top:12px;padding:12px 14px;border-radius:9px;font-size:16px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap}
.progress-dots i{width:18px;height:5px;border-radius:3px;background:var(--line)}
.progress-dots i.ok{background:var(--good)}
.progress-dots i.no{background:var(--bad)}
.progress-dots i.cur{background:var(--gold)}
.score{font-family:var(--f-display);font-size:48px;font-variant-numeric:tabular-nums}

/* zdania */
.sent{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.sent .he.line{display:block;text-align:right;font-size:1.85em;line-height:1.85}
.sent .ref{font-size:13.5px;color:var(--muted)}
.sent .reveal{margin-top:8px;font-size:16px;border-top:1px dashed var(--line);padding-top:8px}
.sent .reveal p{margin:4px 0}
.sent .reveal .he.line{font-size:1.85em}
.sent .sq{font-size:19px;font-weight:600;margin:8px 0 2px;line-height:1.45}
.sent .sen{font-size:14.5px;color:var(--muted);font-style:italic;margin:0 0 4px}
.sent .sex{font-size:14.5px;color:var(--muted);margin:6px 0 0}
.sent .sex .he{font-size:1.2em}
.sent .tr{font-size:17px}
h3.sh{margin:22px 0 10px;font-size:18px}
.builder{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.slot{min-height:56px;border:1px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:rtl;background:var(--sunk)}
.pool{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;margin-top:8px}
.tile{font-family:var(--f-he);font-weight:500;font-size:25px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 10px;cursor:pointer;line-height:1.7}
.tile:hover{border-color:var(--lapis)}
.tile.used{visibility:hidden}
.slot.ok{border-color:var(--good);background:var(--good-soft)}
.slot.no{border-color:var(--bad);background:var(--bad-soft)}

/* z Biblii */
.bhead{margin-bottom:12px}
.bhelp{font-size:15px;padding:12px 14px;margin-bottom:12px;color:var(--muted)}
.bhelp b{color:var(--ink)}
.togs{gap:8px;margin-bottom:14px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer;font-size:14.5px;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--lapis-soft);color:var(--ink);border-color:var(--lapis);font-weight:600}
.tog[aria-pressed="true"]::before{content:"✓ "}
.bv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px 14px}
.bvref{display:inline-block;font-size:13px;font-weight:600;color:var(--gold);background:var(--gold-soft);border-radius:6px;padding:1px 8px}
.bv .arline{display:block;text-align:right;font-size:2em;line-height:2;margin:4px 0 2px;overflow-wrap:anywhere}
.bw{background:none;border:0;padding:0 3px;margin:0 -1px;border-radius:6px;cursor:pointer;font:inherit;color:inherit;line-height:inherit}
.bw:hover{background:var(--sunk)}
.bw.on{background:var(--gold-soft);box-shadow:inset 0 -3px 0 var(--gold)}
.wd{background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;margin:4px 0 8px;font-size:15.5px}
.wdh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.wdh .he{font-size:1.9em;line-height:1.4}
.wdh .tr{font-size:17px}
.wdh .mean{font-weight:600;font-size:17px}
.wd dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 0}
.wd dt{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
.wd dd{margin:0;line-height:1.5}
.bv .trl{font-family:var(--f-tr);font-style:italic;font-size:17.5px;margin:4px 0;line-height:1.55;color:var(--ink)}
.bv .bpl{font-size:17px;margin:6px 0;line-height:1.55;font-weight:500}
.bv .syn{font-size:15.5px;line-height:1.6;background:var(--lapis-soft);border-radius:8px;padding:8px 12px;margin-top:8px}
.bv .syn .he{font-size:1.2em}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px;margin:4px 6px 0 0}
.morph{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.morph summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--lapis);padding:4px 0}
:root[data-theme="dark"] .morph summary{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .morph summary{color:var(--gold)}}
.morph .tbl{margin-top:8px}
.morph td{font-size:14.5px}
.morph td.he{font-size:1.5em;white-space:nowrap;text-align:right}
.morph td.tr{white-space:nowrap}
.morph td .muted{font-size:13px;margin-top:2px}

/* zgłoś błąd */
.repbtn{background:none;border:1px solid transparent;color:var(--muted);font-size:12.5px;padding:3px 8px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:30px}
.repbtn:hover{color:var(--bad);border-color:var(--line);background:var(--surface)}
.rep-form{display:flex;flex-direction:column;gap:12px;max-width:720px}
.rep-form label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:15px}
.rep-form textarea{font:16px/1.5 var(--f-ui);min-height:84px;background:var(--surface)}
.rep-form input{font-size:16px;font-weight:400}
.rep-form textarea{font-weight:400}
.rep-form label .muted{font-weight:400}
.rep-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rep-item p{margin:6px 0}
.rep-where{font-size:14px;color:var(--muted)}
.rep-reply{background:var(--good-soft);border-radius:8px;padding:8px 10px;margin-top:6px}

/* słowniczek, paradygmaty */
.search{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.par td .he{font-size:1.3em}
.par th:first-child,.par td.lab{position:sticky;left:0;z-index:1;background:var(--sunk)}
.par td.lab{background:var(--surface)}
.swipe{display:none;font-size:13.5px;color:var(--muted);margin:0 0 6px}
.par td.lab{white-space:nowrap;color:var(--muted);font-size:14px}
.sync{font-size:12px;color:var(--muted)}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:middle}
.sync.acc i{background:var(--good)}
textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kbd{font-size:12.5px;color:var(--muted)}

@media (max-width:720px){
  body{font-size:17px}
  .hero{grid-template-columns:1fr}
  .vrow{grid-template-columns:1fr}

 {h:'A. Przekształcenie kananejskie (ā > ō)', p:'W hebrajskim długie ā często przeszło w ō; aramejski zachował ā. שָׁלוֹם – שְׁלָם, דּוֹר – דָּר, טוֹב – טָב, לֹא – לָא, עוֹלָם – עָלַם, קוֹל – קָל, אֱנוֹשׁ – אֱנָשׁ.'},
 {h:'B. Redukcja pretoniczna', p:'Pierwotnie krótka samogłoska tuż przed akcentem w hebrajskim się wydłuża, w aramejskim redukuje się do szwy: hebr. שָׁלוֹם (šā-), aram. שְׁלָם (šə-); hebr. כָּתַב, aram. כְּתַב; hebr. נָהָר, aram. נְהַר.'},
 {h:'C. Rzeczowniki „segolowe”', p:'Hebrajskie wyrazy typu מֶלֶךְ mają dwie krótkie samogłoski. W aramejskim tylko sylaba akcentowana ma pełną samogłoskę: hebr. כֶּסֶף – aram. כְּסַף, hebr. צֶלֶם – aram. צְלֵם. Z sufiksem albo rodzajnikiem wraca pierwotny wzór: מַלְכָּא, כַּסְפָּא, פִּשְׁרֵהּ. Rozwój: *malk > *malek > מֶלֶךְ.'},
 {h:'Ketiw i qere', p:'Masoreci czasem zostawiają w tekście jedną formę spółgłoskową (ketiw), a wokalizują inną (qere), np. przy formach z sufiksami.'}
],

L({id:6, ch:'6', title:'Rzeczownik i rodzajnik', read:'Ezd 5,1–5 · Mk 14,36',

 {h:'Trzy stany (status)', p:'Rzeczownik ma rodzaj (m./ż.), liczbę (poj./podw./mn.) i stan: absolutus (nieokreślony), constructus (w łańcuchu dopełniaczowym) i determinatus/emphaticus (określony, z ־ָא). Hebrajski zna tylko absolutus i constructus, określoność wyraża przedrostkiem הַ־.'},

 {h:'Skąd te końcówki?', p:'Pierwotna żeńska końcówka ־ַת przetrwała w constructusie i determinatusie (מְדִינְתָּא); w absolutusie t odpadło, a ה jest tylko mater lectionis – jak w hebr. W l.mn. aram. zachowuje ā (־ָן, ־ָתָא), hebr. ma ō (־וֹת, przekształcenie kananejskie). Męska l.mn.: aram. ־ִין (nunacja), hebr. ־ִים (mimacja); w determinatusie nun asymiluje się do jod: ־ַיָּא.'},
 {h:'Liczba podwójna i nieregularności', p:'יְדַיִן „obie ręce”, מָאתַיִן „200”. נְשִׁין „kobiety” (hebr. נָשִׁים), אֲבָהָן „ojcowie” (cstr. אֲבָהָת), שֻׁם „imię” – l.mn. שְׁמָהָן (cstr. שְׁמָהָת), רַבְרְבִין „wielcy” (reduplikacja od רַב). Czasem ־ָא traci funkcję rodzajnika i staje się częścią słowa: אַבָּא, אִמָּא.'}
],

L({id:12, ch:'12', title:'Przyimki', read:'Ezd 7,12–26',
g:[
 {h:'Przyimki wspólne z hebrajskim', p:'בְּ „w”, לְ „do, dla”, כְּ „jak”, מִן „z, od” (bez asymilacji n przed rzeczownikiem: מִן שְׁמַיָּא; ale מִנִּי „ode mnie”), עַל „na, o, przeciw”, עַד „aż do”, עִם „z”, בֵּין „między”, תְּחוֹת „pod”.'},
 {h:'Przyimki typowo aramejskie', t:[['Przyimek','Znaczenie','Pochodzenie'],['בָּתַר','po (czasowo)','בְּ + אֲתַר „miejsce”'],['בְּגוֹא','pośród','גַּו „wnętrze”'],['לָקֳבֵל','naprzeciw, zgodnie z','קבל'],['כָּל קֳבֵל דִּי','ponieważ','„wobec tego że”'],['קֳדָם','przed (miejsce)','קַדְמָה „dawniej” (czas)'],['לְוָת','u, do','—']]},
 {h:'לְ jako znacznik dopełnienia', p:'Aramejski biblijny zwykle nie używa odpowiednika hebr. אֵת. Dopełnienie bliższe (zwłaszcza osobowe, określone) bywa wprowadzone przez לְ: שְׁבֻקוּ לַעֲבִידַת „zostawcie pracę”. Partykuła יָת (fenickie אית, hebr. אֵת) występuje tylko raz – Dn 3,12; jest typowa dla późniejszych dialektów.'},
 {h:'Przyimki z sufiksami', p:'Jednosylabowe łączą się z sufiksami jak rzeczownik l.poj. (לֵהּ „jemu”, מִנָּךְ „od ciebie”), dwusylabowe – jak l.mn. (עֲלוֹהִי „na nim”, קָדָמַי „przede mną”). Tak samo w hebrajskim: לוֹ, עָלָיו.'}

 {h:'I-y i I-ʾ', p:'Prefiks + jod: asymilacja (יִנְדְּעוּן z dysymilacją) albo mater lectionis (יֵיטַב). W H jod przechodzi w waw: הוֹדַע (hebr. הוֹדִיעַ). Imperatyw bez jod (הַב „daj”). I-ʾ może przejść w jod (אֲתָה → הַיְתִי) lub stać się mater lectionis (יֵאמַר).'},

L({id:23, ch:'23', title:'Składnia', read:'Dn 5,1–12',
g:[
 {h:'Szyk zdania', p:'Aramejski jest bardziej elastyczny niż hebrajski. Szyk wyjściowy VSO, ale częste są SVO i OV. Wysunięty na początek wyraz (casus pendens) bywa podjęty zaimkiem: מַלְכָּא זִיוֹהִי שְׁנוֹהִי „król – jego cera się zmieniła”. Pod wpływem akadyjskiego czasownik często stoi na końcu: חַמְרָא שָׁתֵה „wino pił”.'},
 {h:'Dopełnienie bliższe', p:'Zwykle wprowadzone przez לְ albo nieoznaczone. יָת (hebr. אֵת) tylko w Dn 3,12; częste w targumach.'},
 {h:'Zgoda przymiotnika', p:'Rzeczownik i przymiotnik zgadzają się w rodzaju i liczbie (choć końcówka morfologiczna nie zawsze jest ta sama). Przydawka – ten sam stan; orzecznik – nieokreślony. Zaimek wskazujący jako przydawka zwykle po rzeczowniku, jako orzecznik – przed nim.'},
 {h:'Formy opisowe', p:'אִיתַי oraz הוה jako spójka z imiesłowem są znacznie częstsze niż w hebrajskim: הֲוָא שָׁתֵה „pił”, הֲוֵית חָזֵה „patrzyłem”, אִיתֵיכוֹן פָּלְחִין „służycie”.'},
 {h:'Schemat narracji i dyskursu (P. Messina)', p:'W narracji pierwszy plan niesie qətal (perfectum) i x-qətal; tło – imiesłów, x-yiqtul i zdania imienne. W mowie zależnej przeszłość to x-qətal, teraźniejszość – imiesłów lub zdanie imienne, przyszłość – x-yiqtul, rozkaz – imperatyw i yiqtul krótki (wolitywny).'}
],

const BIBLE={"3":{"ref":"Ezd 4,8–11","intro":"Początek aramejskiej części Księgi Ezdrasza: urzędnicy perscy z Samarii piszą do króla Artakserksesa skargę na Żydów odbudowujących Jerozolimę. Podręcznik podaje tekst w wersji skróconej.","v":[{"r":"4,8","a":"רְחוּם וְשִׁמְשַׁי סָפְרָא כְּתַבוּ אִגְּרָה עַל־יְרוּשְׁלֶם לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא׃","p":"Rechum i Szimszaj, pisarz, napisali list przeciw Jerozolimie do Artakserksesa, króla.","s":"Szyk podmiot – orzeczenie – dopełnienie (S–V–O), częsty w aramejskim (w hebrajskiej prozie typowy jest szyk V–S–O z wayyiqtol). סָפְרָא jest apozycją do שִׁמְשַׁי, מַלְכָּא – apozycją do אַרְתַּחְשַׁשְׂתְּא; apozycja stoi w stanie emfatycznym (z rodzajnikiem -ā). עַל oznacza tu „przeciw / w sprawie”, a לְ wskazuje adresata.","t":"rəḥûm wəšimšay sāprā kətabû ʾiggərâ ʿal-yərûšəlem ləʾartaḥšaśt malkā","w":[["רְחוּם",0,"רְחוּם"],["וְשִׁמְשַׁי",0,"וְשִׁמְשַׁי"],["סָפְרָא",0,"סָפְרָא"],["כְּתַבוּ",0,"כְּתַבוּ"],["אִגְּרָה",0,"אִגְּרָה"],["עַל",1,"עַל"],["יְרוּשְׁלֶם",0,"יְרוּשְׁלֶם"],["לְאַרְתַּחְשַׁשְׂתְּא",0,"לְאַרְתַּחְשַׁשְׂתְּא"],["מַלְכָּא׃",0,"מַלְכָּא"]]},{"r":"4,11","a":"דְּנָה אִגַּרְתָּא דִּי שְׁלַחוּ עַל־אַרְתַּחְשַׁשְׂתְּא מַלְכָּא׃","p":"Oto list, który wysłali do Artakserksesa, króla.","s":"Zdanie nominalne (bez czasownika „być”): דְּנָה (podmiot) – אִגַּרְתָּא (orzecznik), dosł. „to [jest] list”. דִּי wprowadza zdanie względne (jak hebr. אֲשֶׁר); podmiot czasownika שְׁלַחוּ jest zawarty w formie (3 m. l.mn.). Przyimek עַל wyraża tu kierunek „do” – typowe dla aramejskiego urzędowego.","t":"dənâ ʾiggartā dî šəlaḥû ʿal-ʾartaḥšaśt malkā","w":[["דְּנָה",0,"דְּנָה"],["אִגַּרְתָּא",0,"אִגַּרְתָּא"],["דִּי",0,"דִּי"],["שְׁלַחוּ",0,"שְׁלַחוּ"],["עַל",1,"עַל"],["אַרְתַּחְשַׁשְׂתְּא",0,"אַרְתַּחְשַׁשְׂתְּא"],["מַלְכָּא׃",0,"מַלְכָּא"]]}]},"4":{"ref":"Ezd 4,12–16","intro":"Treść listu do Artakserksesa: oskarżenie, że odbudowa Jerozolimy doprowadzi do buntu i utraty podatków.","v":[{"r":"4,12","a":"יְדִיעַ לֶהֱוֵא לְמַלְכָּא דִּי יְהוּדָיֵא יְרוּשְׁלֶם קִרְיְתָא מָרָדְתָּא בָּנַיִן׃","p":"Niech będzie wiadome królowi, że Żydzi budują Jerozolimę, miasto buntownicze.","s":"Formuła urzędowa יְדִיעַ לֶהֱוֵא לְ־ „niech będzie wiadome (komuś)”: imiesłów bierny + jussiw od הֲוָא. Zdanie dopełnieniowe wprowadza דִּי „że”. W nim szyk S–O–V: dopełnienie (יְרוּשְׁלֶם z apozycją קִרְיְתָא מָרָדְתָּא) wysunięte przed orzeczenie; orzeczeniem jest imiesłów בָּנַיִן (czas teraźniejszy, czynność trwająca).","t":"yədîaʿ lehĕwē ləmalkā dî yəhûdāyē yərûšəlem qiryətā mārādtā bānayin","w":[["יְדִיעַ",0,"יְדִיעַ"],["לֶהֱוֵא",0,"לֶהֱוֵא"],["לְמַלְכָּא",0,"לְמַלְכָּא"],["דִּי",0,"דִּי"],["יְהוּדָיֵא",0,"יְהוּדָיֵא"],["יְרוּשְׁלֶם",0,"יְרוּשְׁלֶם"],["קִרְיְתָא",0,"קִרְיְתָא"],["מָרָדְתָּא",0,"מָרָדְתָּא"],["בָּנַיִן׃",0,"בָּנַיִן"]]},{"r":"4,13","a":"כְּעַן יְדִיעַ לֶהֱוֵא לְמַלְכָּא דִי הֵן קִרְיְתָא דָךְ תִּתְבְּנֵא בְּלוֹ לָא יִנְתְּנוּן׃","p":"Teraz niech będzie wiadome królowi, że jeśli to miasto zostanie odbudowane, nie będą płacić daniny.","s":"כְּעַן „teraz” – partykuła przejścia w listach. Okres warunkowy: protaza z הֵן „jeśli” (hebr. אִם) + imperf.; apodoza bez spójnika, z imperf. (przyszłość). W apodozie szyk O–V: dopełnienie בְּלוֹ przed przeczeniem i czasownikiem. Zaimek wskazujący דָךְ stoi po rzeczowniku w st. emfatycznym (jak hebr. הָעִיר הַזֹּאת).","t":"kəʿan yədîaʿ lehĕwē ləmalkā dî hēn qiryətā dāk titbənē bəlô lā yintənûn","w":[["כְּעַן",0,"כְּעַן"],["יְדִיעַ",0,"יְדִיעַ"],["לֶהֱוֵא",0,"לֶהֱוֵא"],["לְמַלְכָּא",0,"לְמַלְכָּא"],["דִי",0,"דִי"],["הֵן",0,"הֵן"],["קִרְיְתָא",0,"קִרְיְתָא"],["דָךְ",0,"דָךְ"],["תִּתְבְּנֵא",0,"תִּתְבְּנֵא"],["בְּלוֹ",0,"בְּלוֹ"],["לָא",0,"לָא"],["יִנְתְּנוּן׃",0,"יִנְתְּנוּן"]]},{"r":"4,14–15","a":"עַל־דְּנָה שְׁלַחְנָא וְהוֹדַעְנָא לְמַלְכָּא דִּי יְבַקַּר בִּסְפַר־דָּכְרָנַיָּא וּתְהַשְׁכַּח דִּי קִרְיְתָא דָךְ קִרְיָא מָרָדָא׃","p":"Dlatego wysłaliśmy [list] i powiadomiliśmy króla, aby przeszukał księgę kronik; a znajdziesz, że to miasto jest miastem buntowniczym.","s":"עַל־דְּנָה „z tego powodu, dlatego” (dosł. „na tym”). דִּי wprowadza tu zdanie celowe („aby”) z imperf. (jussiwnym) – podmiotem יְבַקַּר jest król (3 os.), potem następuje przejście na 2 os. (וּתְהַשְׁכַּח) – częsta w listach zmiana osoby. Końcowe zdanie po דִּי jest nominalne: קִרְיְתָא דָךְ (podmiot) – קִרְיָא מָרָדָא (orzecznik).","t":"ʿal-dənâ šəlaḥnā wəhôdaʿnā ləmalkā dî yəbaqqar bispar-dokrānayyā ûtəhaškaḥ dî qiryətā dāk qiryā mārādā","w":[["עַל",1,"עַל"],["דְּנָה",0,"דְּנָה"],["שְׁלַחְנָא",0,"שְׁלַחְנָא"],["וְהוֹדַעְנָא",0,"וְהוֹדַעְנָא"],["לְמַלְכָּא",0,"לְמַלְכָּא"],["דִּי",0,"דִּי"],["יְבַקַּר",0,"יְבַקַּר"],["בִּסְפַר",1,"בִּסְפַר"],["דָּכְרָנַיָּא",0,"דָּכְרָנַיָּא"],["וּתְהַשְׁכַּח",0,"וּתְהַשְׁכַּח"],["דִּי",0,"דִּי"],["קִרְיְתָא",0,"קִרְיְתָא"],["דָךְ",0,"דָךְ"],["קִרְיָא",0,"קִרְיָא"],["מָרָדָא׃",0,"מָרָדָא"]]},{"r":"4,16","a":"מְהוֹדְעִין אֲנַחְנָה לְמַלְכָּא דִּי הֵן קִרְיְתָא דָךְ תִּתְבְּנֵא חֲלָק בַּעֲבַר נַהֲרָא לָא אִיתַי לָךְ׃","p":"Oznajmiamy królowi, że jeśli to miasto zostanie odbudowane, nie będziesz miał udziału w Zarzeczu.","s":"Imiesłów + zaimek osobowy (מְהוֹדְעִין אֲנַחְנָה) = czas teraźniejszy „my oznajmiamy” – typowo aramejska konstrukcja. Okres warunkowy jak w w. 13. W apodozie: לָא אִיתַי לָךְ „nie ma dla ciebie” = „nie masz” (aram. i hebr. wyrażają posiadanie przez byt + לְ: hebr. אֵין לְךָ). חֲלָק wysunięte na początek dla emfazy.","t":"məhôdəʿîn ʾănaḥnâ ləmalkā dî hēn qiryətā dāk titbənē ḥălāq baʿăbar nahărā lā ʾîtay lāk","w":[["מְהוֹדְעִין",0,"מְהוֹדְעִין"],["אֲנַחְנָה",0,"אֲנַחְנָה"],["לְמַלְכָּא",0,"לְמַלְכָּא"],["דִּי",0,"דִּי"],["הֵן",0,"הֵן"],["קִרְיְתָא",0,"קִרְיְתָא"],["דָךְ",0,"דָךְ"],["תִּתְבְּנֵא",0,"תִּתְבְּנֵא"],["חֲלָק",0,"חֲלָק"],["בַּעֲבַר",0,"בַּעֲבַר"],["נַהֲרָא",0,"נַהֲרָא"],["לָא",0,"לָא"],["אִיתַי",0,"אִיתַי"],["לָךְ׃",0,"לָךְ"]]}]},"5":{"ref":"Ezd 4,17–24","intro":"Odpowiedź Artakserksesa: polecenie wstrzymania odbudowy Jerozolimy i wykonanie dekretu.","v":[{"r":"4,17","a":"פִּתְגָמָא שְׁלַח מַלְכָּא עַל־רְחוּם בְּעֵל־טְעֵם וְשִׁמְשַׁי סָפְרָא דִּי יָתְבִין בְּשָׁמְרָיִן וּשְׁאָר עֲבַר־נַהֲרָה שְׁלָם׃","p":"Odpowiedź wysłał król do Rechuma, pana dekretu (tytuł urzędnika), i Szimszaja, pisarza, którzy mieszkają w Samarii i w pozostałej [części] Zarzecza: Pokój!","s":"Szyk O–V–S: dopełnienie פִּתְגָמָא wysunięte na początek (temat zdania). בְּעֵל־טְעֵם – połączenie konstrukcyjne (st. constructus + rzeczownik) jako tytuł urzędowy. Zdanie względne z דִּי i imiesłowem יָתְבִין (stan trwały). שְׁלָם – formuła pozdrowienia w liście (hebr. שָׁלוֹם).","t":"pitgāmā šəlaḥ malkā ʿal-rəḥûm bəʿēl-ṭəʿēm wəšimšay sāprā dî yātəbîn bəšāmərāyin ûšəʾār ʿăbar-nahărâ šəlām","w":[["פִּתְגָמָא",0,"פִּתְגָמָא"],["שְׁלַח",0,"שְׁלַח"],["מַלְכָּא",0,"מַלְכָּא"],["עַל",1,"עַל"],["רְחוּם",0,"רְחוּם"],["בְּעֵל",1,"בְּעֵל"],["טְעֵם",0,"טְעֵם"],["וְשִׁמְשַׁי",0,"וְשִׁמְשַׁי"],["סָפְרָא",0,"סָפְרָא"],["דִּי",0,"דִּי"],["יָתְבִין",0,"יָתְבִין"],["בְּשָׁמְרָיִן",0,"בְּשָׁמְרָיִן"],["וּשְׁאָר",0,"וּשְׁאָר"],["עֲבַר",1,"עֲבַר"],["נַהֲרָה",0,"נַהֲרָה"],["שְׁלָם׃",0,"שְׁלָם"]]},{"r":"4,18","a":"נִשְׁתְּוָנָא דִּי שְׁלַחְתּוּן קֱרִי קָדָמָי׃","p":"Pismo, które wysłaliście, zostało odczytane przede mną.","s":"Rzeczownik z dopowiedzeniem względnym (דִּי שְׁלַחְתּוּן) stoi na początku jako podmiot; orzeczenie w stronie biernej (peʿil) – sprawca nie jest wyrażony. קָדָמָי „przede mną” – dworski sposób mówienia o królu.","t":"ništəwānā dî šəlaḥtûn qĕrî qādāmāy","w":[["נִשְׁתְּוָנָא",0,"נִשְׁתְּוָנָא"],["דִּי",0,"דִּי"],["שְׁלַחְתּוּן",0,"שְׁלַחְתּוּן"],["קֱרִי",0,"קֱרִי"],["קָדָמָי׃",0,"קָדָמָי"]]},{"r":"4,19–20","a":"מְרַד מִתְעֲבֶד בְּקִרְיְתָא דָךְ מִן־יוֹמָת עָלְמָא וּמַלְכִין תַּקִּיפִין הֲווֹ עַל־יְרוּשְׁלֶם׃","p":"Bunt był wzniecany w tym mieście od dawnych czasów; i potężni królowie panowali nad Jerozolimą.","s":"Imiesłów Gt מִתְעֲבֶד z podmiotem מְרַד = zdanie opisowe (czynność powtarzalna, „bywa czyniony”). מִן־יוֹמָת עָלְמָא – połączenie konstrukcyjne „od dni wieczności” = od zawsze. Przymiotnik תַּקִּיפִין stoi po rzeczowniku i zgadza się z nim (m. l.mn., st. abs.). הֲווֹ עַל „byli nad” = panowali.","t":"mərad mitʿăbēd bəqiryətā dāk min-yômāt ʿālmā ûmalkîn taqqîpîn hăwô ʿal-yərûšəlem","w":[["מְרַד",0,"מְרַד"],["מִתְעֲבֶד",0,"מִתְעֲבֶד"],["בְּקִרְיְתָא",0,"בְּקִרְיְתָא"],["דָךְ",0,"דָךְ"],["מִן",1,"מִן"],["יוֹמָת",0,"יוֹמָת"],["עָלְמָא",0,"עָלְמָא"],["וּמַלְכִין",0,"וּמַלְכִין"],["תַּקִּיפִין",0,"תַּקִּיפִין"],["הֲווֹ",0,"הֲווֹ"],["עַל",1,"עַל"],["יְרוּשְׁלֶם׃",0,"יְרוּשְׁלֶם"]]},{"r":"4,21","a":"כְּעַן שִׂימוּ טְעֵם לְבַטָּלָה מִבְנֵא קִרְיְתָא דָּךְ׃","p":"Teraz wydajcie dekret, aby wstrzymać budowę tego miasta.","s":"שִׂימוּ טְעֵם „połóżcie dekret” = wydajcie dekret – stały zwrot urzędowy. Bezokolicznik z לְ (לְבַטָּלָה) wyraża cel/treść dekretu. מִבְנֵא קִרְיְתָא – bezokolicznik G jako rzeczownik w st. konstrukcyjnym („budowanie miasta”).","t":"kəʿan śîmû ṭəʿēm ləbaṭṭālâ mibnē qiryətā dāk","w":[["כְּעַן",0,"כְּעַן"],["שִׂימוּ",0,"שִׂימוּ"],["טְעֵם",0,"טְעֵם"],["לְבַטָּלָה",0,"לְבַטָּלָה"],["מִבְנֵא",0,"מִבְנֵא"],["קִרְיְתָא",0,"קִרְיְתָא"],["דָּךְ׃",0,"דָּךְ"]]},{"r":"4,23","a":"אֱדַיִן מִן־דִּי נִשְׁתְּוָנָא דִּי אַרְתַּחְשַׁשְׂתָּא מַלְכָּא קֱרִי קֳדָם־רְחוּם וְשִׁמְשַׁי סָפְרָא אֲזַלוּ לִירוּשְׁלֶם עַל־יְהוּדָיֵא וּבַטִּלוּ הִמּוֹ׃","p":"Wtedy, gdy tylko pismo króla Artakserksesa zostało odczytane przed Rechumem i Szimszajem, pisarzem, poszli [oni] do Jerozolimy do Żydów i powstrzymali ich.","s":"אֱדַיִן „wtedy” otwiera nowy etap narracji. מִן־דִּי „odkąd, gdy tylko” – spójnik czasowy wprowadzający zdanie podrzędne. דִּי przed אַרְתַּחְשַׁשְׂתָּא wyraża dopełniacz („pismo, które [należy do] Artakserksesa”) – aram. konstrukcja analityczna obok st. constructus. Zdanie główne: אֲזַלוּ ... וּבַטִּלוּ – narracja w perfectum łączona spójnikiem וְ (bez hebrajskiego wayyiqtol). הִמּוֹ – zaimek 3 m. l.mn. jako dopełnienie bliższe.","t":"ʾĕdayin min-dî ništəwānā dî ʾartaḥšaśtā malkā qĕrî qŏdām-rəḥûm wəšimšay sāprā ʾăzalû lîrûšəlem ʿal-yəhûdāyē ûbaṭṭilû himmô","w":[["אֱדַיִן",0,"אֱדַיִן"],["מִן",1,"מִן"],["דִּי",0,"דִּי"],["נִשְׁתְּוָנָא",0,"נִשְׁתְּוָנָא"],["דִּי",0,"דִּי"],["אַרְתַּחְשַׁשְׂתָּא",0,"אַרְתַּחְשַׁשְׂתָּא"],["מַלְכָּא",0,"מַלְכָּא"],["קֱרִי",0,"קֱרִי"],["קֳדָם",1,"קֳדָם"],["רְחוּם",0,"רְחוּם"],["וְשִׁמְשַׁי",0,"וְשִׁמְשַׁי"],["סָפְרָא",0,"סָפְרָא"],["אֲזַלוּ",0,"אֲזַלוּ"],["לִירוּשְׁלֶם",0,"לִירוּשְׁלֶם"],["עַל",1,"עַל"],["יְהוּדָיֵא",0,"יְהוּדָיֵא"],["וּבַטִּלוּ",0,"וּבַטִּלוּ"],["הִמּוֹ׃",0,"הִמּוֹ"]]},{"r":"4,24","a":"בֵּאדַיִן בְּטֵלַת עֲבִידַת בֵּית־אֱלָהָא דִּי בִּירוּשְׁלֶם׃","p":"Wtedy ustała praca przy domu Boga, który [jest] w Jerozolimie.","s":"Szyk V–S: czasownik przed podmiotem. Łańcuch połączeń konstrukcyjnych: עֲבִידַת (st. konstr.) בֵּית (st. konstr.) אֱלָהָא (st. emf.) – określony jest cały łańcuch dzięki ostatniemu członowi. דִּי + wyrażenie przyimkowe = zdanie względne bez czasownika („który jest w...”).","t":"bēʾdayin bəṭēlat ʿăbîdat bêt-ʾĕlāhā dî bîrûšəlem","w":[["בֵּאדַיִן",0,"בֵּאדַיִן"],["בְּטֵלַת",0,"בְּטֵלַת"],["עֲבִידַת",0,"עֲבִידַת"],["בֵּית",1,"בֵּית"],["אֱלָהָא",0,"אֱלָהָא"],["דִּי",0,"דִּי"],["בִּירוּשְׁלֶם׃",0,"בִּירוּשְׁלֶם"]]}]},"6":{"ref":"Ezd 5,1–5","intro":"Za sprawą proroków Aggeusza i Zachariasza budowa świątyni zostaje wznowiona; namiestnik Tattenaj przychodzi sprawdzić, kto na nią zezwolił.","v":[{"r":"5,1","a":"וְהִתְנַבִּי חַגַּי וּזְכַרְיָה בַר־עִדּוֹא נְבִאַיָּא עַל־יְהוּדָיֵא דִּי בִיהוּד וּבִירוּשְׁלֶם בְּשֻׁם אֱלָהּ יִשְׂרָאֵל עֲלֵיהוֹן׃","p":"I prorokowali prorocy Aggeusz i Zachariasz, syn Iddo, do Żydów, którzy [byli] w Judzie i w Jerozolimie, w imię Boga Izraela, [który był] nad nimi.","s":"Szyk V–S: czasownik na początku, podmiot złożony (חַגַּי וּזְכַרְיָה) z apozycją נְבִיאַיָּא. Czasownik w l.poj. przy podmiocie mnogim stojącym po nim – zgoda z najbliższym członem. בְּשֻׁם אֱלָהּ יִשְׂרָאֵל – połączenie konstrukcyjne trzyczłonowe; עֲלֵיהוֹן odnosi się do Boga („który [czuwał] nad nimi”).","t":"wəhitnabbî ḥaggay ûzəkaryâ bar-ʿiddôʾ nəbiʾayyā ʿal-yəhûdāyē d בּוֹזְנַי",0,"בּוֹזְנַי"],["וְכֵן",0,"וְכֵן"],["אָמְרִין",0,"אָמְרִין"],["לְהֹם׃",0,"לְהֹם"]]},{"r":"5,3–4","a":"מַן שָׂם טְעֵם בַּיְתָא דְנָה לְמִבְנֵא מַן שְׁמָהָת גֻּבְרַיָּא דִּי דְנָא בָּנַיִן׃","p":"„Kto wydał dekret, aby budować ten dom? Jakie są imiona mężów, którzy to budują?”","s":"Dwa pytania z zaimkiem pytającym מַן „kto” (hebr. מִי). W pierwszym: dopełnienie bezokolicznika (בַּיְתָא דְנָה) wysunięte przed לְמִבְנֵא. W drugim: zdanie nominalne „kto [są] imiona...”; w zdaniu względnym szyk O–V (דְנָה בָּנַיִן). דְנָה bez dagesz po wyrazie zakończonym samogłoską.","t":"man śām ṭəʿēm baytā dənâ ləmibnē man šəmāhāt gubrayyā dî dənā bānayin","w":[["מַן",0,"מַן"],["שָׂם",0,"שָׂם"],["טְעֵם",0,"טְעֵם"],["בַּיְתָא",0,"בַּיְתָא"],["דְנָה",0,"דְנָה"],["לְמִבְנֵא",0,"לְמִבְנֵא"],["מַן",0,"מַן"],["שְׁמָהָת",0,"שְׁמָהָת"],["גֻּבְרַיָּא",0,"גֻּבְרַיָּא"],["דִּי",0,"דִּי"],["דְנָא",0,"דְנָא"],["בָּנַיִן׃",0,"בָּנַיִן"]]},{"r":"5,5","a":"וְעֵין אֱלָהֲהֹם הֲוָת עַל־יְהוּדָיֵא וְלָא־בַטִּלוּ הִמּוֹ׃","p":"Lecz oko ich Boga było nad Żydami i nie powstrzymali ich.","s":"Szyk S–V w pierwszym zdaniu (podmiot עֵין wysunięty – kontrast). Orzeczenie הֲוָת w rodzaju żeńskim, bo עַיִן „oko” jest r. ż. Drugie zdanie: וְ + לָא + perf. – skutek; podmiot (urzędnicy) domyślny. הִמּוֹ = dopełnienie (ich, tj. Żydów).","t":"wəʿên ʾĕlāhăhōm hăwāt ʿal-yəhûdāyē wəlā-baṭṭilû himmô","w":[["וְעֵין",0,"וְעֵין"],["אֱלָהֲהֹם",0,"אֱלָהֲהֹם"],["הֲוָת",0,"הֲוָת"],["עַל",1,"עַל"],["יְהוּדָיֵא",0,"יְהוּדָיֵא"],["וְלָא",1,"וְלָא"],["בַטִּלוּ",0,"בַטִּלוּ"],["הִמּוֹ׃",0,"הִמּוֹ"]]}]},"7":{"ref":"Ezd 5,6–10","intro":"Raport Tattenaja do króla Dariusza o odbudowie świątyni w Jerozolimie.","v":[{"r":"5,6–7","a":"אִגַּרְתָּא דִּי שְׁלַח תַּתְּנַי פַּחַת עֲבַר־נַהֲרָה וּשְׁתַר בּוֹזְנַי וּכְנָוָתֵהּ דִּי בַּעֲבַר נַהֲרָה עַל־דָּרְיָוֶשׁ מַלְכָּא וְכִדְנָה כְּתִיב בְּגַוֵּהּ׃","p":"[Oto odpis] listu, który wysłał Tattenaj, namiestnik Zarzecza, i Szetar-Boznaj, i jego towarzysze, którzy [byli] w Zarzeczu, do króla Dariusza; a tak było w nim napisane:","s":"Nagłówek bez orzeczenia: אִגַּרְתָּא z długim zdaniem względnym (דִּי שְׁלַח...). Czasownik שְׁלַח w l.poj. zgadza się z pierwszym członem podmiotu złożonego. וְכִדְנָה כְּתִיב – imiesłów bierny jako orzeczenie (stan: „jest napisane”); כִּדְנָה „tak” zapowiada cytat.","t":"ʾiggartā dî šəlaḥ tattənay paḥat ʿăbar-nahărâ ûšətar bôzənay ûkənāwātēh dî baʿăbar nahărâ ʿal-dāryāweš malkā wəkidnâ kətîb bəgawwēh","w":[["אִגַּרְתָּא",0,"אִגַּרְתָּא"],["דִּי",0,"דִּי"],["שְׁלַח",0,"שְׁלַח"],["תַּתְּנַי",0,"תַּתְּנַי"],["פַּחַת",0,"פַּחַת"],["עֲבַר",1,"עֲבַר"],["נַהֲרָה",0,"נַהֲרָה"],["וּשְׁתַר",0,"וּשְׁתַר"],["בּוֹזְנַי",0,"בּוֹזְנַי"],["וּכְנָוָתֵהּ",0,"וּכְנָוָתֵהּ"],["דִּי",0,"דִּי"],["בַּעֲבַר",0,"בַּעֲבַר"],["נַהֲרָה",0,"נַהֲרָה"],["עַל",1,"עַל"],["דָּרְיָוֶשׁ",0,"דָּרְיָוֶשׁ"],["מַלְכָּא",0,"מַלְכָּא"],["וְכִדְנָה",0,"וְכִדְנָה"],["כְּתִיב",0,"כְּתִיב"],["בְּגַוֵּהּ׃",0,"בְּגַוֵּהּ"]]},{"r":"5,7","a":"לְדָרְיָוֶשׁ מַלְכָּא שְׁלָמָא כֹלָּא׃","p":"Do króla Dariusza: wszelki pokój!","s":"Formuła adresowa listu (לְ + adresat) i pozdrowienie bez czasownika. כֹלָּא stoi po rzeczowniku jako wzmocnienie („pokój – cały”), inaczej niż hebr. כָּל־ przed rzeczownikiem.","t":"lədāryāweš malkā šəlāmā kōllā","w":[["לְדָרְיָוֶשׁ",0,"לְדָרְיָוֶשׁ"],["מַלְכָּא",0,"מַלְכָּא"],["שְׁלָמָא",0,"שְׁלָמָא"],["כֹלָּא׃",0,"כֹלָּא"]]},{"r":"5,8","a":"יְדִיעַ לֶהֱוֵא לְמַלְכָּא דִּי־אֲזַלְנָא לִיהוּד מְדִינְתָּא לְבֵית אֱלָהָא רַבָּא׃","p":"Niech będzie wiadome królowi, że poszliśmy do prowincji Judy, do domu wielkiego Boga.","s":"Formuła יְדִיעַ לֶהֱוֵא + zdanie dopełnieniowe z דִּי „że”. מְדִינְתָּא – apozycja po nazwie własnej („Juda, prowincja”). רַבָּא jako przymiotnik określa אֱלָהָא (st. emf. – zgodny z rzeczownikiem); por. hebr. הָאֵל הַגָּדוֹל.","t":"yədîaʿ lehĕwē ləmalkā dî-ʾăzalnā lîhûd mədîntā ləbêt ʾĕlāhā rabbā","w":[["יְדִיעַ",0,"יְדִיעַ"],["לֶהֱוֵא",0,"לֶהֱוֵא"],["לְמַלְכָּא",0,"לְמַלְכָּא"],["דִּי",1,"דִּי"],["אֲזַלְנָא",0,"אֲזַלְנָא"],["ל ę świątyni: zburzenie przez Nabuchodonozora i dekret Cyrusa o odbudowie.","v":[{"r":"5,11","a":"הֲתִיבוּ׃","p":"Odpowiedzieli:","s":"Pojedynczy czasownik wprowadzający mowę niezależną (podręcznik skraca tu dłuższą formułę וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא).","t":"hătîbû","w":[["הֲתִיבוּ׃",0,"הֲתִיבוּ"]]},{"r":"5,11","a":"אֲנַחְנָא עַבְדוֹהִי דִי־אֱלָהּ שְׁמַיָּא וְאַרְעָא וּבָנַיִן בַּיְתָא דִּי־הֲוָא בְנֵה מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן׃","p":"„My jesteśmy sługami Boga nieba i ziemi i budujemy dom, który był zbudowany przed tym wiele lat temu.”","s":"Zdanie nominalne: אֲנַחְנָא (podmiot) – עַבְדוֹהִי (orzecznik). Konstrukcja proleptyczna עַבְדוֹהִי דִי־אֱלָהּ „jego słudzy, [słudzy] Boga” – sufiks zapowiada określenie z דִּי (typowo aramejskie). Drugie orzeczenie – imiesłów בָּנַיִן (teraźniejszość). הֲוָא בְנֵה = perfectum הֲוָא + imiesłów bierny → stan w przeszłości („był zbudowany”). שְׁנִין שַׂגִּיאָן – okolicznik czasu w biernik.","t":"ʾănaḥnā ʿabdôhî dî-ʾĕlāh šəmayyā wəʾarʿā ûbānayin baytā dî-hăwā bənēh miqqadmat dənâ šənîn śaggîʾān","w":[["אֲנַחְנָא",0,"אֲנַחְנָא"],["עַבְדוֹהִי",0,"עַבְדוֹהִי"],["דִי",1,"דִי"],["אֱלָהּ",0,"אֱלָהּ"],["שְׁמַיָּא",0,"שְׁמַיָּא"],["וְאַרְעָא",0,"וְאַרְעָא"],["וּבָנַיִן",0,"וּבָנַיִן"],["בַּיְתָא",0,"בַּיְתָא"],["דִּי",1,"דִּי"],["הֲוָא",0,"הֲוָא"],["בְנֵה",0,"בְנֵה"],["מִקַּדְמַת",0,"מִקַּדְמַת"],["דְּנָה",0,"דְּנָה"],["שְׁנִין",0,"שְׁנִין"],["שַׂגִּיאָן׃",0,"שַׂגִּיאָן"]]},{"r":"5,12","a":"הַרְגִּזוּ אֲבָהֳתַנָא לֶאֱלָהּ שְׁמַיָּא וִיהַב הִמּוֹ לִנְבוּכַדְנֶצַּר מֶלֶךְ־בָּבֶל כַּסְדָּיָא וּבַיְתָה דְנָה סְתַר וְעַמָּה הַגְלִי לְבָבֶל׃","p":"Nasi ojcowie rozgniewali Boga nieba, więc wydał ich Nabuchodonozorowi, królowi Babilonu, Chaldejczykowi; i ten dom zburzył, a lud uprowadził do Babilonu.","s":"Narracja w perfectum łączona przez וְ. Dwa ostatnie zdania mają szyk O–V (וּבַיְתָה דְנָה סְתַר, וְעַמָּה הַגְלִי) – wysunięte dopełnienia tworzą paralelizm. כַּסְדָּיָא – apozycja do imienia. הַרְגִּזוּ לְ־ – dopełnienie przez לְ ysunięte na początek i podjęte zaimkiem הִמּוֹ po czasowniku. Liczne דִּי: dopełniacz (דִי־בֵית), zdanie względne (דִּי נְבוּכַדְנֶצַּר הַנְפֵּק), określenie miejsca (דִּי בִירוּשְׁלֶם). וִיהִיבוּ – strona bierna (peʿil) zamiast podmiotu nieokreślonego.","t":"ûmāʾnayyā dî-bêt-ʾĕlāhā dî nəbûkadneṣṣar hanpēq min-hêkəlā dî bîrûšəlem ləhêkəlā dî bābel hanpēq himmô kôreš malkā min-hêkəlā dî bābel wîhîbû ləšēšbaṣṣar","w":[["וּמָאנַיָּא",0,"וּמָאנַיָּא"],["דִי",1,"דִי"],["בֵית",1,"בֵית"],["אֱלָהָא",0,"אֱלָהָא"],["דִּי",0,"דִּי"],["נְבוּכַדְנֶצַּר",0,"נְבוּכַדְנֶצַּר"],["הַנְפֵּק",0,"הַנְפֵּק"],["מִן",1,"מִן"],["הֵיכְלָא",0,"הֵיכְלָא"],["דִּי",0,"דִּי"],["בִירוּשְׁלֶם",0,"בִירוּשְׁלֶם"],["לְהֵיכְלָא",0,"לְהֵיכְלָא"],["דִּי",0,"דִּי"],["בָבֶל",0,"בָבֶל"],["הַנְפֵּק",0,"הַנְפֵּק"],["הִמּוֹ",0,"הִמּוֹ"],["כּוֹרֶשׁ",0,"כּוֹרֶשׁ"],["מַלְכָּא",0,"מַלְכָּא"],["מִן",1,"מִן"],["הֵיכְלָא",0,"הֵיכְלָא"],["דִּי",0,"דִּי"],["בָבֶל",0,"בָבֶל"],["וִיהִיבוּ",0,"וִיהִיבוּ"],["לְשֵׁשְׁבַּצַּר׃",0,"לְשֵׁשְׁבַּצַּר"]]},{"r":"5,15","a":"וַאֲמַר אֵלֶּה מָאנַיָּא אֲחֵת הִמּוֹ בְּהֵיכְלָא דִּי בִירוּשְׁלֶם וּבֵית אֱלָהָא יִתְבְּנֵא׃","p":"I powiedział [mu]: „Te naczynia – złóż je w świątyni w Jerozolimie, a dom Boży niech będzie odbudowany”.","s":"Mowa niezależna bez spójnika wprowadzającego. Znów casus pendens: אֵלֶּה מָאנַיָּא podjęte przez הִמּוֹ. Imperatyw אֲחֵת, potem jussiw (imperf.) w stronie biernej יִתְבְּנֵא – polecenie w 3 os. Szyk S–V w ostatnim zdaniu.","t":"waʾămar ʾēlleh māʾnayyā ʾăḥēt himmô bəhêkəlā dî bîrûšəlem ûbêt ʾĕlāhā yitbənē","w":[["וַאֲמַר",0,"וַאֲמַר"],["אֵלֶּה",0,"אֵלֶּה"],["מָאנַיָּא",0,"מָאנַיָּא"],["אֲחֵת",0,"אֲחֵת"],["הִמּוֹ",0,"הִמּוֹ"],["בְּהֵיכְלָא",0,"בְּהֵיכְלָא"],["דִּי",0,"דִּי"],["בִירוּשְׁלֶם",0,"בִירוּשְׁלֶם"],["וּבֵית",0,"וּבֵית"],["אֱלָהָא",0,"אֱלָהָא"],["יִתְבְּנֵא׃",0,"יִתְבְּנֵא"]]}]},"9":{"ref":"Ezd 5,16–6,5","intro":"Koniec raportu Tattenaja i odnalezienie w archiwum dekretu Cyrusa.","v":[{"r":"5,16","a":"אֱדַיִן שֵׁשְׁבַּצַּר אֲתָא יְהַב אֻשַּׁיָּא דִּי־בֵית אֱלָהָא דִּי בִירוּשְׁלֶם וּמִן־אֱדַיִן וְעַד־כְּעַן מִתְבְּנֵא וְלָא שְׁלִם׃","p":"Wtedy ten Szeszbassar przyszedł [i] położył fundamenty domu Bożego w Jerozolimie, i od tego czasu aż dotąd jest budowany, a nie jest ukończony.","s":"Asyndeton dwóch czasowników אֲתָא יְהַב („przyszedł [i] położył”) – seryjne użycie czasownika ruchu. מִן־אֱדַיִן וְעַד־כְּעַן „od wtedy aż do teraz”. Imiesłów Gt מִתְבְּנֵא (bez wyrażonego podmiotu – „[dom] jest budowany”) opisuje stan trwający; perf. שְׁלִם – stan niezakończony.","t":"ʾĕdayin šēšbaṣṣar ʾătā yəhab ʾuššayyā dî-bêt ʾĕlāhā dî bîrûšəlem ûmin-ʾĕdayin wəʿad-kəʿan mitbənē wəlā šəlim","w":[["אֱדַיִן",0,"אֱדַיִן"],["שֵׁשְׁבַּצַּר",0,"שֵׁשְׁבַּצַּר"],["אֲתָא",0,"אֲתָא"],["יְהַב",0,"יְהַב"],["אֻשַּׁיָּא",0,"אֻשַּׁיָּא"],["דִּי",1,"דִּי"],["בֵית",0,"בֵית"],["אֱלָהָא",0,"אֱלָהָא"],["דִּי",0,"דִּי"],["בִירוּשְׁלֶם",0,"בִירוּשְׁלֶם"],["וּמִן",1,"וּמִן"],["אֱדַיִן",0,"אֱדַיִן"],["וְעַד",1,"וְעַד"],["כְּעַן",0,"כְּעַן"],["מִתְבְּנֵא",0,"מִתְבְּנֵא"],["וְלָא",0,"וְלָא"],["שְׁלִם׃",0,"שְׁלִם"]]},{"r":"5,17","a":"וּכְעַן הֵן עַל־מַלְכָּא טָב יִתְבַּקַּר בְּבֵית גִּנְזַיָּא דִּי־מַלְכָּא תַמָּה דִּי בְּבָבֶל הֵן אִיתַי דִּי־מִן־כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם לְמִבְנֵא בֵּית־אֱלָהָא בִּירוּשְׁלֶם וּרְעוּת מַלְכָּא עַל־דְּנָה יִשְׁלַח עֲלֶינָא׃","p":"A teraz, jeśli królowi się podoba, niech przeszukają skarbiec królewski, który jest tam w Babilonie, czy istnieje [prawda], że przez króla Cyrusa został wydany dekret, aby budować dom Boży w Jerozolimie; a wolę swoją w tej sprawie niech król przyśle nam.","s":"הֵן עַל־מַלְכָּא טָב – grzecznościowa formuła „jeśli [to] dobre dla króla” (zdanie nominalne). יִתְבַּקַּר – bezosobowy jussiw bierny. Drugie הֵן oznacza „czy” (pytanie zależne). מִן כּוֹרֶשׁ przy biernym שִׂים wskazuje sprawcę („przez Cyrusa”). Ostatnie zdanie ma szyk O–V: dopełnienie רְעוּת מַלְכָּא wysunięte przed orzeczenie (dosł. „a wolę króla w tej sprawie niech [król] przyśle nam”).","t":"ûkəʿan hēn ʿal-malkā ṭāb yitbaqqar bə nikiem.","t":"ûminnî śîm ṭəʿēm lîhûdāyē ləmibnē bêt-ʾĕlāhā ûminniksê malkā nipqətā tehĕwē mityahăbā ləgubrayyā ʾillēk dî-lā ləbaṭṭālā","w":[["וּמִנִּי",0,"וּמִנִּי"],["שִׂים",0,"שִׂים"],["טְעֵם",0,"טְעֵם"],["לִיהוּדָיֵא",0,"לִיהוּדָיֵא"],["לְמִבְנֵא",0,"לְמִבְנֵא"],["בֵּית",1,"בֵּית"],["אֱלָהָא",0,"אֱלָהָא"],["וּמִנִּכְסֵי",0,"וּמִנִּכְסֵי"],["מַלְכָּא",0,"מַלְכָּא"],["נִפְקְתָא",0,"נִפְקְתָא"],["תֶּהֱוֵא",0,"תֶּהֱוֵא"],["מִתְיַהֲבָא",0,"מִתְיַהֲבָא"],["לְגֻבְרַיָּא",0,"לְגֻבְרַיָּא"],["אִלֵּךְ",0,"אִלֵּךְ"],["דִּי",1,"דִּי"],["לָא",0,"לָא"],["לְבַטָּלָא׃",0,"לְבַטָּלָא"]]},{"r":"6,9–10","a":"וּמַה חַשְׁחָן לֶאֱלָהּ שְׁמַיָּא לֶהֱוֵא מִתְיְהֵב לְהֹם דִּי־לֶהֱוֹן מְהַקְרְבִין לֶאֱלָהּ שְׁמַיָּא וּמְצַלַּיִן לְחַיֵּי מַלְכָּא׃","p":"A co jest potrzebne [na ofiary] dla Boga nieba, niech im będzie dawane, aby składali ofiary Bogu nieba i modlili się za życie króla.","s":"וּמָה חַשְׁחָן „a to, co [jest] potrzebne” – zaimek pytający jako względny (casus pendens, podmiot zdania). לֶהֱוֵא מִתְיְהֵב – jussiw od הוה + imiesłów („niech będzie stale dawane”). דִּי + לֶהֱוֹן + imiesłowy = zdanie celowe z czynnością trwałą („aby stale składali”).","t":"ûmâ ḥašḥān leʾĕlāh šəmayyā lehĕwē mityəhēb ləhōm dî-lehĕwôn məhaqrəbîn leʾĕlāh šəmayyā ûməṣallayin ləḥayyê malkā","w":[["וּמַה",0,"וּמַה"],["חַשְׁחָן",0,"חַשְׁחָן"],["לֶאֱלָהּ",0,"לֶאֱלָהּ"],["שְׁמַיָּא",0,"שְׁמַיָּא"],["לֶהֱוֵא",0,"לֶהֱוֵא"],["מִתְיְהֵב",0,"מִתְיְהֵב"],["לְהֹם",0,"לְהֹם"],["דִּי",1,"דִּי"],["לֶהֱוֹן",0,"לֶהֱוֹן"],["מְהַקְרְבִין",0,"מְהַקְרְבִין"],["לֶאֱלָהּ",0,"לֶאֱלָהּ"],["שְׁמַיָּא",0,"שְׁמַיָּא"],["וּמְצַלַּיִן",0,"וּמְצַלַּיִן"],["לְחַיֵּי",0,"לְחַיֵּי"],["מַלְכָּא׃",0,"מַלְכָּא"]]},{"r":"6,11","a":"וּמִנִּי שִׂים טְעֵם דִּי כָל־אֱנָשׁ דִּי יְהַשְׁנֵא פִּתְגָמָא דְנָה וּבַיְתֵהּ נְוָלוּ יִתְעֲבֵד עַל־דְּנָה׃","p":"Przeze mnie też został wydany dekret, że każdemu człowiekowi, który zmieni ten dekret – jego dom zostanie z tego powodu zamieniony w gruzowisko.","s":"Po דִּי następuje casus pendens: כָל־אֱנָשׁ דִּי יְהַשְׁנֵא... „każdy człowiek, który zmieni” – potem nowe zdanie z sufiksem nawiązującym (בַּיְתֵהּ „jego dom”). Podwójny mianownik przy biernym יִתְעֲבֵד: dom zostanie uczyniony gruzowiskiem.","t":"ûminnî śîm ṭəʿēm dî kol-ʾĕnāš dî yəhašnē pitgāmā dənâ ûbaytēh nəwālû yitʿăbēd ʿal-dənâ","w":[["וּמִנִּי",0,"וּמִנִּי"],["שִׂים",0,"שִׂים"],["טְעֵם",0,"טְעֵם"],["דִּי",0,"דִּי"],["כָל",1,"כָל"],["אֱנָשׁ",0,"אֱנָשׁ"],["דִּי",0,"דִּי"],["יְהַשְׁנֵא",0,"יְהַשְׁנֵא"],["פִּתְגָמָא",0,"פִּתְגָמָא"],["דְנָה",0,"דְנָה"],["וּבַיְתֵהּ",0,"וּבַיְתֵהּ"],["נְוָלוּ",0,"נְוָלוּ"],["יִתְעֲבֵד",0,"יִתְעֲבֵד"],["עַל",1,"עַל"],["דְּנָה׃",0,"דְּנָה"]]},{"r":"6,12","a":"וֵאלָהָא יְמַגַּר כָּל־מֶלֶךְ וְעַם דִּי יִשְׁלַח יְדֵהּ לְחַבָּלָה בֵּית־אֱלָהָא דִּי בִירוּשְׁלֶם אֲנָא דָּרְיָוֶשׁ שָׂמֶת טְעֵם׃","p":"A Bóg niech obali każdego króla i lud, który wyciągnie swoją rękę, aby zniszczyć ten dom Boży w Jerozolimie. Ja, Dariusz, wydałem dekret.","s":"Szyk S–V z jussiwem (יְמַגַּר) – życzenie/przekleństwo. Zdanie względne דִּי יִשְׁלַח z bezokolicznikiem celowym לְחַבָּלָה. Na końcu podpis z zaimkiem osobowym i apozycją: אֲנָה דָרְיָוֶשׁ (casus pendens) + שָׂמֶת.","t":"wēʾlāhā yəmaggar kol-melek wəʿam dî yišlaḥ yədēh ləḥabbālâ bêt-ʾĕlāhā dî bîrûšəlem ʾănā dāryāweš śāmet ṭəʿēm","w":[["וֵאלָהָא",0,"וֵאלָהָא"],["יְמַגַּר",0,"יְמַגַּר"],["כָּל",1,"כָּל"],["מֶלֶךְ",0,"מֶלֶךְ"],["וְעַם",0,"וְעַם"],["דִּי",0,"דִּי"],["יִשְׁלַח",0,"יִשְׁלַח"],["יְדֵהּ",0,"יְדֵהּ"],["לְחַבָּלָה",0,"לְחַבָּלָה"],["בֵּית",1,"בֵּית"],["אֱלָהָא",0,"אֱלָהָא"],["דִּי",0,"דִּי"],["בִירוּשְׁלֶם",0,"בִירוּשְׁלֶם"],["אֲנָא",0,"אֲנָא"],["דָּרְיָוֶשׁ",0,"דָּרְיָוֶשׁ"],["שָׂמֶת",0,"שָׂמֶת"],["טְעֵם׃",0,"טְעֵם"]]}]},"11":{"ref":"Ezd 6,13–18","intro":"Ukończenie i poświęcenie drugiej świątyni w szóstym roku Dariusza (515 r. przed Chr.).","v":[{"r":"6,13","a":"אֱדַיִן תַּתְּנַי פַּחַת עֲבַר־נַהֲרָה שְׁתַר בּוֹזְנַי וּכְנָוָתְהוֹן לָקֳבֵל דִּי־שְׁלַח דָּרְיָוֶשׁ מַלְכָּא כְּנֵמָא אָסְפַּרְנָא עֲבַדוּ׃","p":"Wtedy Tattenaj, namiestnik Zarzecza, Szetar-Boznaj i ich towarzysze – zgodnie z tym, co polecił król Dariusz – tak dokładnie uczynili.","s":"Długi podmiot złożony na początku, orzeczenie עֲבַדוּ na samym końcu (szyk S–V, typowy dla aram. urzędowego pod wpływem akadyjskiego i perskiego). לָקֳבֵל דִּי „zgodnie z tym, że” – spójnik złożony. כְּנֵמָא „tak” i אָסְפַּרְנָא „dokładnie” – przysłówki przed orzeczeniem.","t":"ʾĕdayin tattənay paḥat ʿăbar-nahărâ šətar bôzənay ûkənāwāthôn lāqŏbēl dî-šəlaḥ dāryāweš malkā kənēmā ʾāsparnā ʿăbadû","w":[["אֱדַיִן",0,"אֱדַיִן"],["תַּתְּנַי",0,"תַּתְּנַי"],["פַּחַת",0,"פַּחַת"],["עֲבַר",1,"עֲבַר"],["נַהֲרָה",0,"נַהֲרָה"],["שְׁתַר",0,"שְׁתַר"],["בּוֹזְנַי",0,"בּוֹזְנַי"],["וּכְנָוָתְהוֹן",0,"וּכְנָוָתְהוֹן"],["לָקֳבֵל",0,"לָקֳבֵל"],["דִּי",1,"דִּי"],["שְׁלַח",0,"שְׁלַח"],["דָּרְיָוֶשׁ",0,"דָּרְיָוֶשׁ"],["מַלְכָּא",0,"מַלְכָּא"],["כְּנֵמָא",0,"כְּנֵמָא"],["אָסְפַּרְנָא",0,"אָסְפַּרְנָא"],["עֲבַדוּ׃",0,"עֲבַדוּ"]]},{"r":"6,14","a":"יְהוּדָיֵא בָּנַיִן וּמַצְלְחִין בִּנְבוּאַת חַגַּי וּזְכַרְיָה בַּר־עִדּוֹא וְשַׁכְלִלוּ מִן־טַעַם אֱלָהּ יִשְׂרָאֵל וּמִטְּעֵם כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא מֶלֶךְ פָּרָס׃","p":"A Żydzi budowali i szczęściło się [im] dzięki prorokowaniu Aggeusza i Zachariasza, syna Iddo; i ukończyli [budowę] według dekretu Boga Izraela i według dekretu Cyrusa, Dariusza i Artakserksesa, króla Persji.","s":"Imiesłowy בָּנַיִן וּמַצְלְחִין opisują trwającą czynność w przeszłości (tło), a perf. וְשַׁכְלִלוּ – zakończenie. Gra słów: טַעַם (dekret Boga) i טְעֵם (dekret królów) – ten sam rzeczownik w dwóch wokalizacjach (masoreci odróżnili dekret Boży). מִן wyraża przyczynę („z dekretu”).","t":"yəhûdāyē bānayin ûmaṣləḥîn binbûʾat ḥaggay ûzəkaryâ bar-ʿiddôʾ wəšaklilû min-ṭaʿam ʾĕlāh yiśrāʾēl ûmiṭṭəʿēm kôreš wədāryāweš wəʾartaḥšaśt melek pārās","w":[["יְהוּדָיֵא",0,"יְהוּדָיֵא"],["בָּנַיִן",0,"בָּנַיִן"],["וּמַצְלְחִין",0,"וּמַצְלְחִין"],["בִּנְבוּאַת",0,"בִּנְבוּאַת"],["חַגַּי",0,"חַגַּי"],["וּזְכַרְיָה",0,"וּזְכַרְיָה"],["בַּר",1,"בַּר"],["עִדּוֹא" 0,"וּשְׁאָר"],["בְּנֵי",1,"בְּנֵי"],["גָלוּתָה",0,"גָלוּתָה"],["חֲנֻכַּת",0,"חֲנֻכַּת"],["בֵּית",1,"בֵּית"],["אֱלָהָא",0,"אֱלָהָא"],["דְנָה",0,"דְנָה"],["בְּחֶדְוָה׃",0,"בְּחֶדְוָה"]]},{"r":"6,18","a":"וַהֲקִימוּ כָהֲנַיָּא וְלֵוָיֵא עַל־עֲבִידַת אֱלָהָא דִּי בִירוּשְׁלֶם כִּכְתָב סְפַר מֹשֶׁה׃","p":"I ustanowili kapłanów i lewitów do służby Bożej w Jerozolimie, według tego, co napisane w księdze Mojżesza.","s":"Hafʿel kauzatywny z dopełnieniem bez znacznika (כָהֲנַיָּא). עַל oznacza tu przydział („nad służbą”). כִּכְתָב סְפַר מֹשֶׁה – łańcuch konstrukcyjny „według pisma księgi Mojżesza” = „jak napisano w księdze Mojżesza”.","t":"wahăqîmû kāhănayyā wəlēwāyē ʿal-ʿăbîdat ʾĕlāhā dî bîrûšəlem kiktāb səpar mōše","w":[["וַהֲקִימוּ",0,"וַהֲקִימוּ"],["כָהֲנַיָּא",0,"כָהֲנַיָּא"],["וְלֵוָיֵא",0,"וְלֵוָיֵא"],["עַל",1,"עַל"],["עֲבִידַת",0,"עֲבִידַת"],["אֱלָהָא",0,"אֱלָהָא"],["דִּי",0,"דִּי"],["בִירוּשְׁלֶם",0,"בִירוּשְׁלֶם"],["כִּכְתָב",0,"כִּכְתָב"],["סְפַר",0,"סְפַר"],["מֹשֶׁה׃",0,"מֹשֶׁה"]]}]},"12":{"ref":"Ezd 7,12–26","intro":"Reskrypt Artakserksesa dla Ezdrasza: pozwolenie na powrót, fundusze na świątynię i władza sądownicza.","v":[{"r":"7,12","a":"אַרְתַּחְשַׁסְתְּא מֶלֶךְ מַלְכַיָּא לְעֶזְרָא כָהֲנָא סָפַר דָּתָא דִּי־אֱלָהּ שְׁמַיָּא׃","p":"Artakserkses, król królów, do Ezdrasza, kapłana, pisarza prawa Boga nieba.","s":"Nagłówek listu bez orzeczenia: nadawca (z tytułem) + לְ + adresat (z apozycjami). מֶלֶךְ מַלְכַיָּא – konstrukcja superlatywna „król królów” (st. konstr. + l.mn. emf.). סָפַר דָּתָא – st. konstr. „pisarz prawa”, dalej analityczny dopełniacz z דִּי.","t":"ʾartaḥšast melek malkayyā ləʿezrā kāhănā sāpar dātā dî-ʾĕlāh šəmayyā","w":[["אַרְתַּחְשַׁסְתְּא",0,"אַרְתַּחְשַׁסְתְּא"],["מֶלֶךְ",0,"מֶלֶךְ"],["מַלְכַיָּא",0,"מַלְכַיָּא"],["לְעֶזְרָא",0,"לְעֶזְרָא"],["כָהֲנָא",0,"כָהֲנָא"],["סָפַר",0,"סָפַר"],["דָּתָא",0,"דָּתָא"],["דִּי",1,"דִּי"],["אֱלָהּ",0,"אֱלָהּ"],["שְׁמַיָּא׃",0,"שְׁמַיָּא"]]},{"r":"7,13","a":"מִנִּי שִׂים טְעֵם דִּי כָל־מִתְנַדַּב בְּמַלְכוּתִי מִן־עַמָּא יִשְׂרָאֵל וְכָהֲנוֹהִי וְלֵוָיֵא לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ יְהָךְ׃","p":"Przeze mnie zostaje wydany dekret, że każdy w moim królestwie z ludu Izraela, jego kapłanów i lewitów, kto dobrowolnie zechce iść do Jerozolimy, może iść z tobą.","s":"Podmiot zdania po דִּי: כָל־מִתְנַדַּב ... (imiesłów zsubstantywizowany „każdy chętny”) z rozbudowanymi okolicznikami; orzeczenie יְהָךְ na końcu. Bezokolicznik לִמְהָךְ zależy od מִתְנַדַּב („chętny, by iść”). עַמָּה יִשְׂרָאֵל – apozycja.","t":"minnî śîm ṭəʿēm dî kol-mitnaddab bəmalkûtî min-ʿammā yiśrāʾēl wəkāhănôhî wəlēwāyē limhāk lîrûšəlem ʿimmāk yəhāk","w":[["מִנִּי",0,"מִנִּי"],["שִׂים",0,"שִׂים"],["טְעֵם",0,"טְעֵם"],["דִּי",0,"דִּי"],["כָל",1,"כָל"],["מִתְנַדַּב",0,"מִתְנַדַּב"],["בְּמַלְכוּתִי",0,"בְּמַלְכוּתִי"],["מִן",1,"מִן"],["עַמָּא",0,"עַמָּא"],["יִשְׂרָאֵל",0,"יִשְׂרָאֵל"],["וְכָהֲנוֹהִי",0,"וְכָהֲנוֹהִי"],["וְלֵוָיֵא",0,"וְלֵוָיֵא"],["לִמְהָךְ",0,"לִמְהָךְ"],["לִירוּשְׁלֶם",0,"לִירוּשְׁלֶם"],["עִמָּךְ",0,"עִמָּךְ"],["יְהָךְ׃",0,"יְהָךְ"]]},{"r":"7,14","a":"מִן־קֳדָם מַלְכָּא שְׁלִיחַ לְבַקָּרָה עַל־יְהוּד וְלִירוּשְׁלֶם בְּדָת אֱלָהָךְ׃","p":"Jesteś wysłany przez króla, aby zbadać [sytuację] w Judzie i Jerozolimie według prawa twego Boga.","s":"Zdanie nominalne z imiesłowem biernym שְׁלִיחַ (domyślny podmiot: ty). מִן־קֳדָם „od (strony)” – grzecznościowe wskazanie sprawcy. Cel wyrażony bezokolicznikiem D z לְ.","t":"min-qŏdām malkā šəlîaḥ ləbaqqārâ ʿal-yəhûd wəlîrûšəlem bədāt ʾĕlāhāk","w":[["מִן",1,"מִן"],["קֳדָם",0,"קֳדָם"],["מַלְכָּא",0,"מַלְכָּא"],["שְׁלִיחַ",0,"שְׁלִיחַ"],["לְבַקָּרָה",0,"לְבַקָּרָה"],["עַל",1,"עַל"],["יְהוּד",0,"יְהוּד"],["וְלִירוּשְׁלֶם",0,"וְלִירוּשְׁלֶם"],["בְּדָת",0,"בְּדָת"],["אֱלָהָךְ׃",0,"אֱלָהָךְ"]]},{"r":"7,15–16","a":"וּלְהֵיבָלָה כְּסַף וּדְהַב דִּי־מַלְכָּא לֶאֱלָהּ יִשְׂרָאֵל דִּי בִירוּשְׁלֶם וְכֹל כְּסַף וּדְהַב בְכֹל מְדִינַת בָּבֶל לְבֵית אֱלָהֲהֹם דִּי בִירוּשְׁלֶם׃","p":"I aby zanieść srebro i złoto [ofiarowane przez] króla Bogu Izraela, który [mieszka] w Jerozolimie, oraz wszelkie srebro i złoto w całej prowincji Babilonu – do domu ich Boga w Jerozolimie.","s":"Drugi bezokolicznik celowy (וּלְהֵיבָלָה) zależny od שְׁלִיחַ. Dopełnienia w st. absolutnym (כְּסַף וּדְהַב – nieokreślone). כֹּל przed rzeczownikiem (st. konstr.) = „każdy, wszelki” (jak hebr. כָּל־).","t":"ûləhêbālâ kəsap ûdəhab dî-malkā leʾĕlāh yiśrāʾēl dî bîrûšəlem wəkōl kəsap ûdəhab bəkōl mədînat bābel ləbêt ʾĕlāhăhōm dî bîrûšəlem","w":[["וּלְהֵיבָלָה",0,"וּלְהֵיבָלָה"],["כְּסַף",0,"כְּסַף"],["וּדְהַב",0,"וּדְהַב"],["דִּי",1,"דִּי"],["מַלְכָּא",0,"מַלְכָּא"],["לֶאֱלָהּ",0,"לֶאֱלָהּ"],["יִשְׂרָאֵל",0,"יִשְׂרָאֵל"],["דִּי",0,"דִּי"],["בִירוּשְׁלֶם",0,"בִירוּשְׁלֶם"],["וְכֹל",0,"וְכֹל"],["כְּסַף",0,"כְּסַף"],["וּדְהַב",0,"וּדְהַב"],["בְכֹל",0,"בְכֹל"],["מְדִינַת",0,"מְדִינַת"],["בָּבֶל",0,"בָּבֶל"],["לְבֵית",0,"לְבֵית"],["אֱלָהֲהֹם",0,"אֱלָהֲהֹם"],["דִּי",0,"דִּי"],["בִירוּשְׁלֶם׃",0,"בִירוּשְׁלֶם"]]},{"r":"7,17","a":"אָסְפַּרְנָא תִקְנֵא בְּכַסְפָּא דְנָה דִּכְרִין וּתְקָרֵב הִמּוֹ בִירוּשְׁלֶם׃","p":"Starannie zakupisz za te pieniądze barany i złożysz je w ofierze w Jerozolimie.","s":"Imperf. 2 os. w funkcji polecenia (tryb rozkazujący urzędowy). בְּ wyraża cenę („za to srebro”). Dopełnienie powtórzone zaimkiem הִמּוֹ w drugim zdaniu.","t":"ʾāsparnā tiqnē bəkaspā dənâ dikrîn ûtəqārēb himmô bîrûšəlem","w":[["אָסְפַּרְנָא",0,"אָסְפַּרְנָא"],["תִקְנֵא",0,"תִקְנֵא"],["בְּכַסְפָּא",0,"בְּכַסְפָּא"],["דְנָה",0,"דְנָה"],["דִּכְרִין",0,"דִּכְרִין"],["וּתְקָרֵב",0,"וּתְקָרֵב"],["הִמּוֹ",0,"הִמּוֹ"],["בִירוּשְׁלֶם׃",0,"בִירוּשְׁלֶם"]]},{"r":"7,18","a":"וּמָה דִי עֲלָךְ יֵיטַב בִּשְׁאַר כַּסְפָּא וְדַהֲבָה לְמֶעְבַּד כִּרְעוּת אֱלָהֲכֹם תַּעַבְדוּן׃","p":"A co tobie wyda się dobre, by uczynić z resztą srebra i złota, uczyńcie według woli waszego Boga.","s":"Casus pendens: וּמָה דִי ... יֵיטַב „to, co uzna się za dobre” – zdanie względne jako dopełnienie wysunięte; czasownik główny תַּעַבְדוּן na końcu. עֲלָךְ יֵיטַב „będzie dobre dla ciebie” (idiom: „będziesz uważał  mądrości twego Boga ustanów sędziów dla całego ludu, który [jest] w Zarzeczu – dla wszystkich znających prawa twego Boga; a kto [ich] nie zna, tego pouczycie.","s":"Wołacz z zaimkiem (וְאַנְתְּ עֶזְרָא) na początku. Imperatyw מֶנִּי, dopełnienie דַיָּנִין. Apozycja לְכָל־יָדְעֵי... doprecyzowuje לְכָל־עַמָּה. Ostatnie zdanie: wysunięte dopełnienie וְדִי לָא יָדַע („a [tego], kto nie zna”) + imperf. 2 l.mn. jako polecenie.","t":"wəʾant ʿezrā kəḥokmat ʾĕlāhāk mennî dayyānîn ləkol-ʿammā dî baʿăbar nahărâ ləkol-yādəʿê dātê ʾĕlāhāk wədî lā yādaʿ təhôdəʿûn","w":[["וְאַנְתְּ",0,"וְאַנְתְּ"],["עֶזְרָא",0,"עֶזְרָא"],["כְּחָכְמַת",0,"כְּחָכְמַת"],["אֱלָהָךְ",0,"אֱלָהָךְ"],["מֶנִּי",0,"מֶנִּי"],["דַיָּנִין",0,"דַיָּנִין"],["לְכָל",1,"לְכָל"],["עַמָּא",0,"עַמָּא"],["דִּי",0,"דִּי"],["בַּעֲבַר",0,"בַּעֲבַר"],["נַהֲרָה",0,"נַהֲרָה"],["לְכָל",1,"לְכָל"],["יָדְעֵי",0,"יָדְעֵי"],["דָּתֵי",0,"דָּתֵי"],["אֱלָהָךְ",0,"אֱלָהָךְ"],["וְדִי",0,"וְדִי"],["לָא",0,"לָא"],["יָדַע",0,"יָדַע"],["תְּהוֹדְעוּן׃",0,"תְּהוֹדְעוּן"]]},{"r":"7,26","a":"וְכָל־דִּי־לָא לֶהֱוֵא עָבֵד דָּתָא דִי־אֱלָהָךְ וְדָתָא דִּי מַלְכָּא אָסְפַּרְנָא דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ׃","p":"A każdy, kto nie będzie przestrzegał prawa twego Boga i prawa króla – niech będzie nad nim skrupulatnie wykonany wyrok.","s":"Casus pendens וְכָל־דִּי ... podjęty sufiksem w מִנֵּהּ „z niego / na nim”. Peryfrazy לֶהֱוֵא + imiesłów (עָבֵד, מִתְעֲבֵד) – czynność trwała w przyszłości/jussiwie. דָּתָא דִי־אֱלָהָךְ וְדָתָא דִּי מַלְכָּא – paralelizm prawa Bożego i królewskiego.","t":"wəkol-dî-lā lehĕwē ʿābēd dātā dî-ʾĕlāhāk wədātā dî malkā ʾāsparnā dînâ lehĕwē mitʿăbēd minnēh","w":[["וְכָל",1,"וְכָל"],["דִּי",1,"דִּי"],["לָא",0,"לָא"],["לֶהֱוֵא",0,"לֶהֱוֵא"],["עָבֵד",0,"עָבֵד"],["דָּתָא",0,"דָּתָא"],["דִי",1,"דִי"],["אֱלָהָךְ",0,"אֱלָהָךְ"],["וְדָתָא",0,"וְדָתָא"],["דִּי",0,"דִּי"],["מַלְכָּא",0,"מַלְכָּא"],["אָסְפַּרְנָא",0,"אָסְפַּרְנָא"],["דִּינָה",0,"דִּינָה"],["לֶהֱוֵא",0,"לֶהֱוֵא"],["מִתְעֲבֵד",0,"מִתְעֲבֵד"],["מִנֵּהּ׃",0,"מִנֵ לְכָּא לָהֵן אֱלָהִין׃","p":"Sprawa, o którą król pyta, jest trudna i nie ma nikogo innego, kto by ją oznajmił przed królem, oprócz bogów.","s":"Zdanie nominalne: וּמִלְּתָא דִי ... (podmiot ze zdaniem względnym) – יַקִּירָה (orzecznik, przym. ż. st. emf.). W drugim zdaniu אָחֳרָן „inny” wysunięte; לָהֵן „oprócz”. Sufiks -innah w יְחַוִּנַּהּ (z n energicznym) odnosi się do מִלְּתָא.","t":"ûmillətā dî-malkâ šāʾēl yaqqîrâ wəʾoḥŏrān lā ʾîtay dî yəḥawwinah qŏdām malkā lāhēn ʾĕlāhîn","w":[["וּמִלְּתָא",0,"וּמִלְּתָא"],["דִי",1,"דִי"],["מַלְכָּה",0,"מַלְכָּה"],["שָׁאֵל",0,"שָׁאֵל"],["יַקִּירָה",0,"יַקִּירָה"],["וְאָחֳרָן",0,"וְאָחֳרָן"],["לָא",0,"לָא"],["אִיתַי",0,"אִיתַי"],["דִּי",0,"דִּי"],["יְחַוִּנַהּ",0,"יְחַוִּנַהּ"],["קֳדָם",0,"קֳדָם"],["מַלְכָּא",0,"מַלְכָּא"],["לָהֵן",0,"לָהֵן"],["אֱלָהִין׃",0,"אֱלָהִין"]]},{"r":"2,12","a":"מַלְכָּא קְצַף שַׂגִּיא וַאֲמַר לְהוֹבָדָה לְכָל חַכִּימֵי בָבֶל׃","p":"Król rozgniewał się bardzo i powiedział, aby wytracić wszystkich mędrców Babilonu.","s":"Szyk S–V. שַׂגִּיא jako przysłówek („bardzo”). אֲמַר + bezokolicznik z לְ = „powiedział, aby…” (wypowiedź w znaczeniu polecenia). Dopełnienie bezokolicznika wprowadzone przez לְ.","t":"malkā qəṣap śaggîʾ waʾămar ləhôbādâ ləkol ḥakkîmê bābel","w":[["מַלְכָּא",0,"מַלְכָּא"],["קְצַף",0,"קְצַף"],["שַׂגִּיא",0,"שַׂגִּיא"],["וַאֲמַר",0,"וַאֲמַר"],["לְהוֹבָדָה",0,"לְהוֹבָדָה"],["לְכָל",0,"לְכָל"],["חַכִּימֵי",0,"חַכִּימֵי"],["בָבֶל׃",0,"בָבֶל"]]}]},"14":{"ref":"Dn 2,14–24","intro":"Daniel prosi o czas, modli się z przyjaciółmi i otrzymuje objawienie tajemnicy; dziękczynny hymn Daniela.","v":[{"r":"2,16","a":"בֵּאדַיִן דָּנִיֵּאל בְּעָה מִן־מַלְכָּא דִּי זְמָן יִנְתֵּן־לֵהּ וּפִשְׁרָא לְהַחֲוָיָה לְמַלְכָּא׃","p":"Wtedy Daniel poprosił króla, aby dał mu czas, a [on] oznajmi królowi wykład.","s":"Szyk S–V. בְּעָה מִן „prosić od (kogoś)”. דִּי + imperf. – zdanie dopełnieniowe/celowe („aby dał”). Ostatni człon (וּפִשְׁרָא לְהַחֲוָיָה) – bezokolicznik z לְ w funkcji przyszłości/celu („i wykład [miał] oznajmić”).","t":"bēʾdayin dāniyyēʾl bəʿâ min-malkā dî zəmān yintēn-lēh ûpišrā ləhaḥăwāyâ ləmalkā","w":[["בֵּאדַיִן",0,"בֵּאדַיִן"],["דָּנִיֵּאל",0,"דָּנִיֵּאל"],["בְּעָה",0,"בְּעָה"],["מִן",1,"מִן"],["מַלְכָּא",0,"מַלְכָּא"],["דִּי",0,"דִּי"],["זְמָן",0,"זְמָן"],["יִנְתֵּן",1,"יִנְתֵּן"],["לֵהּ",0,"לֵהּ"],["וּפִשְׁרָא",0,"וּפִשְׁרָא"],["לְהַחֲוָיָה",0,"לְהַחֲוָיָה"],["לְמַלְכָּא׃",0,"לְמַלְכָּא"]]},{"r":"2,17–18","a":"אֱדַיִן דָנִיֵּאל לְבַיְתֵהּ אֲזַל וְלַחֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה חַבְרוֹהִי מִלְּתָא הוֹדַע וְרַחֲמִין לְמִבְעֵא מִן־קֳדָם אֱלָהּ שְׁמַיָּא עַל־רָזָה דְּנָה דִּי לָא יְהֹבְדוּן דָּנִיֵּאל וְחַבְרוֹהִי עִם־חַכִּימֵי בָבֶל׃","p":"Wtedy Daniel poszedł do swego domu i powiadomił o sprawie swoich towarzyszy: Chananiasza, Miszaela i Azariasza, aby błagali o miłosierdzie Boga nieba w sprawie tej tajemnicy, żeby Daniel i jego towarzysze nie zginęli razem z [innymi] mędrcami Babilonu.","s":"Wyraźny szyk z czasownikiem na końcu: S–(okolicznik)–V (דָנִיֵּאל לְבַיְתֵהּ אֲזַל), (dop. dalsze)–O–V (וְלַחֲנַנְיָה ... מִלְּתָא הוֹדַע). Bezokolicznik celowy z wysuniętym dopełnieniem (וְרַחֲמִין לְמִבְעֵא). דִּי לָא + imperf. – zdanie celowe przeczące („żeby nie”).","t":"ʾĕdayin dāniyyēʾl ləbaytēh ʾăzal wəlaḥănanyâ mîšāʾēl waʿăzaryâ ḥabrôhî millətā hôdaʿ wəraḥămîn ləmibʿē min-qŏdām ʾĕlāh šəmayyā ʿal-rāzâ dənâ dî lā yəhōbədûn dāniyyēʾl wəḥabrôhî ʿim-ḥakkîmê bābel","w":[["אֱדַיִן",0,"אֱדַיִן"],["דָנִיֵּאל",0,"דָנִיֵּאל"],["לְבַיְתֵהּ",0,"לְבַיְתֵהּ"],["אֲזַל",0,"אֲזַל"],["וְלַחֲנַנְיָה",0,"וְלַחֲנַנְיָה"],["מִישָׁאֵל",0,"מִישָׁאֵל"],["וַעֲזַרְיָה",0,"וַעֲזַרְיָה"],["חַבְרוֹהִי",0,"חַבְרוֹהִי"],["מִלְּתָא",0,"מִלְּתָא"],["הוֹדַע",0,"הוֹדַע"],["וְרַחֲמִין",0,"וְרַחֲמִין"],["לְמִבְעֵא",0,"לְמִבְעֵא"],["מִן",1,"מִן"],["קֳדָם",0,"קֳדָם"],["אֱלָהּ",0,"אֱלָהּ"],["שְׁמַיָּא",0,"שְׁמַיָּא"],["עַל",1,"עַל"],["רָזָה",0,"רָזָה"],["דְּנָה",0,"דְּנָה"],["דִּי",0,"דִּי"],["לָא",0,"לָא"],["יְהֹבְדוּן",0,"יְהֹבְדוּן"],["דָּנִיֵּאל",0,"דָּנִיֵּאל"],["וְחַבְרוֹהִי",0,"וְחַבְרוֹהִ ość mędrcom.","s":"Seria imiesłowów (מְהַשְׁנֵא, מְהָקֵים, יָהֵב) jako orzeczeń prawd ogólnych – styl hymniczny (por. hebr. psalmy z imiesłowami). Asyndeton – brak spójników między członami.","t":"wəhûʾ məhašnē ʿiddānayyā wəzimnayyā məhāqēm malkîn yāhēb ḥokmətā ləḥakkîmîn","w":[["וְהוּא",0,"וְהוּא"],["מְהַשְׁנֵא",0,"מְהַשְׁנֵא"],["עִדָּנַיָּא",0,"עִדָּנַיָּא"],["וְזִמְנַיָּא",0,"וְזִמְנַיָּא"],["מְהָקֵים",0,"מְהָקֵים"],["מַלְכִין",0,"מַלְכִין"],["יָהֵב",0,"יָהֵב"],["חָכְמְתָא",0,"חָכְמְתָא"],["לְחַכִּימִין׃",0,"לְחַכִּימִין"]]},{"r":"2,22","a":"הוּא גָּלֵא עַמִּיקָתָא׃","p":"On objawia rzeczy głębokie.","s":"Zdanie z zaimkiem-podmiotem i imiesłowem (prawda ogólna). Przymiotnik w l.mn. ż. st. emf. użyty rzeczownikowo (neutrum: „rzeczy głębokie”).","t":"hûʾ gālē ʿammîqātā","w":[["הוּא",0,"הוּא"],["גָּלֵא",0,"גָּלֵא"],["עַמִּיקָתָא׃",0,"עַמִּיקָתָא"]]},{"r":"2,23","a":"לָךְ אֱלָהּ אֲבָהָתִי מְשַׁבַּח אֲנָה דִּי חָכְמְתָא וּגְבוּרְתָא יְהַבְתְּ לִי וּכְעַן הוֹדַעְתַּנִי דִּי־בְעֵינָא מִנָּךְ דִּי־מִלַּת מַלְכָּא הוֹדַעְתֶּנָא׃","p":"Ciebie, Boże moich ojców, wysławiam, bo dałeś mi mądrość i moc, a teraz oznajmiłeś mi to, o co Cię prosiliśmy – sprawę króla nam oznajmiłeś.","s":"Dopełnienie (לָךְ) wysunięte na początek – emfaza; wołacz אֱלָהּ אֲבָהָתִי. מְשַׁבַּח אֲנָה – imiesłów + zaimek = czas teraźniejszy. דִּי przyczynowe („bo”). Szyk O–V w zdaniu przyczynowym. דִּי־בְעֵינָא – zdanie względne bez poprzednika („to, o co prosiliśmy”); ostatnie דִּי rozwija je (apozycyjnie).","t":"lāk ʾĕlāh ʾăbāhātî məšabbaḥ ʾănâ dî ḥokmətā ûgəbûrətā yəhabt lî ûkəʿan hôdaʿtanî dî-bəʿênā minnāk dî-millat malkā hôdaʿtenā","w":[["לָךְ",0,"לָךְ"],["אֱלָהּ",0,"אֱלָהּ"],["אֲבָהָתִי",0,"אֲבָהָתִי"],["מְשַׁבַּח",0,"מְשַׁבַּח"],["אֲנָה",0,"אֲנָה"],["דִּי",0,"דִּי"],["חָכְמְתָא",0,"חָכְמְתָא"],["וּגְבוּרְתָא",0,"וּגְבוּרְתָא"],["יְהַבְתְּ",0,"יְהַבְתְּ"],["לִי",0,"לִי"],["וּכְעַן",0,"וּכְעַן"],["הוֹדַעְתַּנִי",0,"הוֹדַעְתַּנִי"],["דִּי",1,"דִּי"],["בְעֵינָא",0,"בְעֵינָא"],["מִנָּךְ",0,"מִנָּךְ"],[  יְהוֹדְעוּן – 3 m. l.mn. bezosobowe = strona bierna („oznajmią” = zostanie oznajmione).","t":"waʾănâ lā bəḥokmâ dî-ʾîtay bî rāzā dənâ gălî lî lāhēn dî pišrā ləmalkā yəhôdəʿûn","w":[["וַאֲנָה",0,"וַאֲנָה"],["לָא",0,"לָא"],["בְחָכְמָה",0,"בְחָכְמָה"],["דִּי",1,"דִּי"],["אִיתַי",0,"אִיתַי"],["בִּי",0,"בִּי"],["רָזָא",0,"רָזָא"],["דְנָה",0,"דְנָה"],["גֲּלִי",0,"גֲּלִי"],["לִי",0,"לִי"],["לָהֵן",0,"לָהֵן"],["דִּי",0,"דִּי"],["פִשְׁרָא",0,"פִשְׁרָא"],["לְמַלְכָּא",0,"לְמַלְכָּא"],["יְהוֹדְעוּן׃",0,"יְהוֹדְעוּן"]]},{"r":"2,31","a":"אַנְתְּ מַלְכָּא חָזֵה הֲוַיְתָ צְלֵם חַד שַׂגִּיא צַלְמָא דִּכֵּן רַב׃","p":"Ty, królu, patrzyłeś, [a oto] jakiś wielki posąg. Ten posąg był ogromny.","s":"חָזֵה הֲוַיְתָ – imiesłów + perf. od הוה = czynność trwająca w przeszłości („patrzyłeś”, stała formuła wizji). חַד jako rodzajnik nieokreślony („pewien posąg”). Zdanie nominalne: צַלְמָא דִּכֵּן (podmiot) – רַב (orzecznik).","t":"ʾant malkā ḥāzē hăwaytā ṣəlēm ḥad śaggîʾ ṣalmā dikkēn rab","w":[["אַנְתְּ",0,"אַנְתְּ"],["מַלְכָּא",0,"מַלְכָּא"],["חָזֵה",0,"חָזֵה"],["הֲוַיְתָ",0,"הֲוַיְתָ"],["צְלֵם",0,"צְלֵם"],["חַד",0,"חַד"],["שַׂגִּיא",0,"שַׂגִּיא"],["צַלְמָא",0,"צַלְמָא"],["דִּכֵּן",0,"דִּכֵּן"],["רַב׃",0,"רַב"]]},{"r":"2,32–33","a":"הוּא צַלְמָא רֵאשֵׁהּ דִּי־דְהַב טָב חֲדוֹהִי וּדְרָעוֹהִי דִּי כְסַף מְעוֹהִי וְיַרְכָתֵהּ דִּי נְחָשׁ שָׁקוֹהִי דִּי פַרְזֶל רַגְלוֹהִי מִנְּהֵן דִּי פַרְזֶל וּמִנְּהֵן דִּי חֲסַף׃","p":"Ten posąg – jego głowa [była] ze szczerego złota, jego pierś i ramiona ze srebra, jego brzuch i biodra z brązu, jego golenie z żelaza, jego stopy częściowo z żelaza, a częściowo z gliny.","s":"Casus pendens הוּא צַלְמָא „ten posąg” (zaimek osobowy w funkcji wskazującej), a potem seria zdań nominalnych: część ciała z sufiksem (podmiot) + דִּי + materiał (orzecznik). מִנְּהֵן ... וּמִנְּהֵן „częściowo... częściowo” (dosł. „z nich... i z nich”).","t":"hûʾ ṣalmā rēʾšēh dî-dəhab ṭāb ḥădôhî ûdərāʿôhî dî kəsap məʿôhî wəyarkātēh dî nəḥāš šāqôhî dî parzel raglôhî minnəhēn dî parzel ûmi  Ezd 4,12). Kontrast aspektów: imiesłów z אִיתַי (stała postawa: „nie jesteśmy służącymi”) i imperf. (postanowienie: „nie oddamy pokłonu”).","t":"wəhēn lā yədîaʿ lehĕwē-lāk malkā dî lēʾlāhāk lā-ʾîtaynā pāləḥîn ûləṣelem dahăbā dî hăqêmtā lā nisgud","w":[["וְהֵן",0,"וְהֵן"],["לָא",0,"לָא"],["יְדִיעַ",0,"יְדִיעַ"],["לֶהֱוֵא",1,"לֶהֱוֵא"],["לָךְ",0,"לָךְ"],["מַלְכָּא",0,"מַלְכָּא"],["דִּי",0,"דִּי"],["לֵאלָהָיךְ",0,"לֵאלָהָיךְ"],["לָא",1,"לָא"],["אִיתַינָא",0,"אִיתַינָא"],["פָּלְחִין",0,"פָּלְחִין"],["וּלְצֶלֶם",0,"וּלְצֶלֶם"],["דַּהֲבָא",0,"דַּהֲבָא"],["דִי",0,"דִי"],["הֲקֵימְתָּ",0,"הֲקֵימְתָּ"],["לָא",0,"לָא"],["נִסְגֻּד׃",0,"נִסְגֻּד"]]},{"r":"3,19–20","a":"בֵּאדַיִן נְבוּכַדְנֶצַּר עָנֵה וְאָמַר לְמֵזֵא לְאַתּוּנָא חַד־שִׁבְעָה עַל דִּי חֲזֵה לְמֵזְיֵהּ וּלְכַפָּתָה לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֶד־נְגוֹ לְמִרְמֵא לְאַתּוּן נוּרָא יָקִדְתָּא׃","p":"Wtedy Nabuchodonozor odezwał się i powiedział, aby rozpalić piec siedem razy bardziej, niż zwykle go rozpalano, i aby związać Szadraka, Meszaka i Abed-Nego, by wrzucić [ich] do pieca z płonącym ogniem.","s":"Ciąg bezokoliczników z לְ zależnych od אֲמַר („powiedział, aby…”). חַד־שִׁבְעָה „jeden – siedem” = siedmiokrotnie. עַל דִּי חֲזֵה „ponad to, co stosowne” – porównanie przez עַל. Bezokolicznik z sufiksem (לְמֵזְיֵהּ).","t":"bēʾdayin nəbûkadneṣṣar ʿānē wəʾāmar ləmēzē ləʾattûnā ḥad-šibʿâ ʿal dî ḥăzē ləmēzəyēh ûləkappātâ ləšadrak mêšak waʿăbed-nəgô ləmirmē ləʾattûn nûrā yāqidtā","w":[["בֵּאדַיִן",0,"בֵּאדַיִן"],["נְבוּכַדְנֶצַּר",0,"נְבוּכַדְנֶצַּר"],["עָנֵה",0,"עָנֵה"],["וְאָמַר",0,"וְאָמַר"],["לְמֵזֵא",0,"לְמֵזֵא"],["לְאַתּוּנָא",0,"לְאַתּוּנָא"],["חַד",1,"חַד"],["שִׁבְעָה",0,"שִׁבְעָה"],["עַל",0,"עַל"],["דִּי",0,"דִּי"],["חֲזֵה",0,"חֲזֵה"],["לְמֵזְיֵהּ",0,"לְמֵזְיֵהּ"],["וּלְכַפָּתָה",0,"וּלְכַפָּתָה"],["לְשַׁדְרַךְ",0,"לְשַׁדְרַךְ"],["מֵישַׁךְ",0,"מֵישַׁךְ"],["וַעֲבֶד",1,"וַעֲבֶד"],["נְגוֹ",0,"נְגוֹ"],["לְמִרְמֵא",0,"לְמִרְמֵא"],["לְאַתּוּן",0,"לְאַתּוּן"],["נוּרָא",0,"נוּרָא"],["יָקִדְתָּא׃",0,"יָקִדְתָּא"]]},{"r":"3,22 są nieba”.","s":"Imperatywy l.mn. (גֹּדּוּ, שְׁבֻקוּ) i jussiwy 3 os. (תְּנֻד, יִצְטַבַּע). בְּרַם – kontrast. Wysunięte dopełnienie (שָׁרְשׁוֹהִי) przed imperatywem. Przejście od drzewa do człowieka: יִצְטַבַּע (3 m.) odnosi się już do króla.","t":"qārē wəkēn ʾāmar gōddû ʾîlānā tənud ḥêwətā min-taḥtôhî bəram šoršôhî bəʾarʿā šəbuqû ûbəṭal šəmayyā yiṣṭabbaʿ","w":[["קָרֵא",0,"קָרֵא"],["וְכֵן",0,"וְכֵן"],["אָמַר",0,"אָמַר"],["גֹּדּוּ",0,"גֹּדּוּ"],["אִילָנָא",0,"אִילָנָא"],["תְּנֻד",0,"תְּנֻד"],["חֵיוְתָא",0,"חֵיוְתָא"],["מִן",1,"מִן"],["תַּחְתּוֹהִי",0,"תַּחְתּוֹהִי"],["בְּרַם",0,"בְּרַם"],["שָׁרְשׁוֹהִי",0,"שָׁרְשׁוֹהִי"],["בְּאַרְעָא",0,"בְּאַרְעָא"],["שְׁבֻקוּ",0,"שְׁבֻקוּ"],["וּבְטַל",0,"וּבְטַל"],["שְׁמַיָּא",0,"שְׁמַיָּא"],["יִצְטַבַּע׃",0,"יִצְטַבַּע"]]},{"r":"4,13–14","a":"לִבְבֵהּ מִן־אֲנָשָׁא יְשַׁנּוֹן וּלְבַב חֵיוָה יִתְיְהִב לֵהּ עַד דִּי יִנְדְּעוּן חַיַּיָּא דִּי־שַׁלִּיט עִלָּיָא בְּמַלְכוּת אֲנָשָׁא וּלְמַן־דִּי יִצְבֵּא יִתְּנִנַּהּ׃","p":"Niech jego serce zostanie zmienione z ludzkiego, i niech mu będzie dane serce zwierzęcia – aż poznają żyjący, że Najwyższy panuje nad królestwem ludzi i daje je, komu zechce.","s":"יְשַׁנּוֹן – 3 m. l.mn. bezosobowe = strona bierna („zmienią”). עַד דִּי + imperf. – zdanie czasowo-celowe. Dopełnienie z לְ (וּלְמַן־דִּי) wysunięte przed czasownik z sufiksem i n energicznym (יִתְּנִנַּהּ).","t":"libbəbēh min-ʾănāšā yəšannôn ûləbab ḥêwâ yityəhib lēh ʿad dî yindəʿûn ḥayyayyā dî-šallîṭ ʿillāyā bəmalkût ʾănāšā ûləman-dî yiṣbē yittəninnah","w":[["לִבְבֵהּ",0,"לִבְבֵהּ"],["מִן",1,"מִן"],["אֲנָשָׁא",0,"אֲנָשָׁא"],["יְשַׁנּוֹן",0,"יְשַׁנּוֹן"],["וּלְבַב",0,"וּלְבַב"],["חֵיוָה",0,"חֵיוָה"],["יִתְיְהִב",0,"יִתְיְהִב"],["לֵהּ",0,"לֵהּ"],["עַד",0,"עַד"],["דִּי",0,"דִּי"],["יִנְדְּעוּן",0,"יִנְדְּעוּן"],["חַיַּיָּא",0,"חַיַּיָּא"],["דִּי",1,"דִּי"],["שַׁלִּיט",0,"שַׁלִּיט"],["עִלָּיָא",0,"עִלָּיָא"],["בְּמַלְכוּת",0,"בְּמַלְכוּת"],["אֲנָשָׁא",0,"אֲנָשָׁא"],["וּלְמַן",1,"וּלְמַן"],["דִּי",0,"דִּי"],["יִצְבֵּא",0,"יִצְבֵּא"],["יִתְּ ól bardzo się ucieszył i powiedział, aby wydobyć Daniela z jamy. I wydobyto Daniela z jamy, i nie znaleziono na nim żadnej rany, bo zaufał swemu Bogu.","s":"טְאֵב עֲלוֹהִי – bezosobowo („było dobrze na nim”), przeciwieństwo בְּאֵשׁ עֲלוֹהִי (w. 15). Dopełnienie bezokolicznika wysunięte przed אֲמַר. הֻסַּק – hufʿal z asymilacją. דִּי przyczynowe.","t":"bēʾdayin malkā śaggîʾ ṭəʾēb ʿălôhî ûlədāniyyēʾl ʾămar ləhansāqâ min-gubbā wəhussaq dāniyyēʾl min-gubbā wəkol-ḥăbāl lā-hištəkaḥ bēh dî hêmin bēʾlāhēh","w":[["בֵּאדַיִן",0,"בֵּאדַיִן"],["מַלְכָּא",0,"מַלְכָּא"],["שַׂגִּיא",0,"שַׂגִּיא"],["טְאֵב",0,"טְאֵב"],["עֲלוֹהִי",0,"עֲלוֹהִי"],["וּלְדָנִיֵּאל",0,"וּלְדָנִיֵּאל"],["אֲמַר",0,"אֲמַר"],["לְהַנְסָקָה",0,"לְהַנְסָקָה"],["מִן",1,"מִן"],["גֻּבָּא",0,"גֻּבָּא"],["וְהֻסַּק",0,"וְהֻסַּק"],["דָּנִיֵּאל",0,"דָּנִיֵּאל"],["מִן",1,"מִן"],["גֻּבָּא",0,"גֻּבָּא"],["וְכָל",1,"וְכָל"],["חֲבָל",0,"חֲבָל"],["לָא",1,"לָא"],["הִשְׁתְּכַח",0,"הִשְׁתְּכַח"],["בֵּהּ",0,"בֵּהּ"],["דִּי",0,"דִּי"],["הֵימִן",0,"הֵימִן"],["בֵּאלָהֵהּ׃",0,"בֵּאלָהֵהּ"]]},{"r":"6,25","a":"וַאֲמַר מַלְכָּא וְהַיְתִיו גֻּבְרַיָּא אִלֵּךְ דִּי־אֲכַלוּ קַרְצוֹהִי דִּי דָנִיֵּאל וּלְגֹב אַרְיָוָתָא רְמוֹ אִנּוּן בְּנֵיהוֹן וּנְשֵׁיהוֹן וְלָא־מְטוֹ לְאַרְעִית גֻּבָּא עַד דִּי־שְׁלִטוּ בְהוֹן אַרְיָוָתָא׃","p":"I powiedział król, i przyprowadzono tych mężów, którzy oskarżyli Daniela, i wrzucono do jamy lwów ich, ich synów i ich żony; i nie dosięgli dna jamy, zanim lwy ich opanowały.","s":"Idiom אֲכַלוּ קַרְצוֹהִי דִּי „zjedli kawałki (kogoś)” = oskarżyli, oczernili (akadyzm). Dopełnienie okolicznikowe wysunięte (וּלְגֹב אַרְיָוָתָא) + zaimek אִנּוּן jako dopełnienie bliższe z apozycją. עַד דִּי „zanim, aż”.","t":"waʾămar malkā wəhaytîw gubrayyā ʾillēk dî-ʾăkalû qarṣôhî dî dāniyyēʾl ûləgōb ʾaryāwātā rəmô ʾinnûn bənêhôn ûnəšêhôn wəlā-məṭô ləʾarʿît gubbā ʿad dî-šəliṭû bəhôn ʾaryāwātā","w":[["וַאֲמַר",0,"וַאֲמַר"],["מַלְכָּא",0,"מַלְכָּא"],["וְהַיְתִיו",0,"וְהַיְתִיו"],["גֻּבְרַיָּא",0,"גֻּבְרַיָּא"],["אִלֵּךְ",0,"אִלֵּךְ"], const SENT={"3":[{"k":"A","n":1,"A":"סָפְרָא כְּתַב אִגַּרְתָּא לְהוֹם׃","T":"sāprā kətab ʾiggartā ləhôm","P":"Pisarz napisał list do nich.","N":"Szyk S–V–O. סָפְרָא – rzecz. m. l.poj., st. emfatyczny (rodzajnik -ā). כְּתַב – G perf. 3 m. l.poj. (hebr. כָּתַב; redukcja pretoniczna ā > ə). אִגַּרְתָּא – st. emf. od אִגְּרָה „list” (dlatego dosł. „ten list”). לְהוֹם – przyimek לְ + sufiks 3 m. l.mn. (hebr. לָהֶם).","R":"Greenspahn 3,1"},{"k":"A","n":2,"A":"אֱלָהָא עֲבַד שְׁמַיָּא׃","T":"ʾĕlāhā ʿăbad šəmayyā","P":"Bóg uczynił niebiosa.","N":"Szyk S–V–O. אֱלָהָא – st. emf. od אֱלָהּ (hebr. אֱלוֹהַּ, ā > ō). עֲבַד – G perf. 3 m. l.poj. „czynić” (= hebr. עָשָׂה); fałszywy przyjaciel: hebr. עָבַד znaczy „służyć”. שְׁמַיָּא – l.mn., st. emf. (hebr. הַשָּׁמַיִם).","R":"Greenspahn 3,2"},{"k":"A","n":3,"A":"אֲמַר מַלְכָּא עַל יְרוּשְׁלֶם׃ …","T":"ʾămar malkā ʿal yərûšəlem","P":"Król powiedział o Jerozolimie: …","N":"Szyk V–S (orzeczenie przed podmiotem). אֲמַר – G perf. 3 m. l.poj. (hebr. אָמַר). עַל – „o, w sprawie” (może też znaczyć „przeciw”). W podręczniku zdanie kończy się wielokropkiem – treść wypowiedzi nie jest podana.","R":"Greenspahn 3,3"},{"k":"A","n":4,"A":"מַלְכָּא שְׁלַח אִגַּרְתָּא לְסָפְרָא׃","T":"malkā šəlaḥ ʾiggartā ləsāprā","P":"Król wysłał list do pisarza.","N":"Szyk S–V–O + dopełnienie dalsze z לְ. שְׁלַח – G perf. 3 m. l.poj. (hebr. שָׁלַח). לְסָפְרָא – przyimek לְ + st. emf. „do pisarza”.","R":"Greenspahn 3,4"},{"k":"A","n":5,"A":"אֲמַר אֱלָהָא מִן שְׁמַיָּא׃ …","T":"ʾămar ʾĕlāhā min šəmayyā","P":"Bóg powiedział z niebios: …","N":"Szyk V–S. מִן – „z, od” (w aram. n zwykle zachowane przed rzeczownikiem w osobnym słowie; hebr. częściej מִ־ z asymilacją). Zdanie urywa się wielokropkiem, jak w ćw. 3.","R":"Greenspahn 3,5"},{"k":"A","n":6,"A":"אֲבַד סָפְרָא דְּנָה תְּחוֹת אַרְעָא׃","T":"ʾăbad sāprā dənâ təḥôt ʾarʿā","P":"Ten pisarz zginął pod ziemią.","N":"Szyk V–S. אֲבַד – G perf. 3 m. l.poj. „zginąć, przepaść” (hebr. אָבַד). Zaimek wskazujący דְּנָה stoi po rzeczowniku w st. emf. (hebr. הַסּוֹפֵר הַזֶּה); ד < *ḏ (hebr. זֶה). תְּחוֹת „pod” (hebr. תַּחַת; ā > ō). אַרְעָא „ziemia” (hebr. אֶרֶץ; *ḍ: aram. ע – hebr. צ). Por. Jr 10,11.","R":"Greenspahn 3,6"},{"k":"A","n":7,"A":"אֱלָהָא אֲמַר דִּי אַרְעָא לְמַלְכָּא׃","T":"ʾĕlāhā ʾămar dî ʾarʿā ləmalkā","P":"Bóg powiedział, że ziemia [należy] do króla.","N":"Szyk S–V. דִּי – spójnik „że” wprowadzający zdanie dopełnieniowe (hebr. כִּי / אֲשֶׁר). Zdanie podrzędne jest nominalne (bez czasownika „być”): אַרְעָא (podmiot) – לְמַלְכָּא (orzecznik: לְ wyraża przynależność, jak hebr. הָאָרֶץ לַמֶּלֶךְ).","R":"Greenspahn 3,7"}],"4":[{"k":"A","n":1,"A":"אֲנַחְנָה בָּנַיִן קִרְיְתָא׃","T":"ʾănaḥnâ bānayin qiryətā","P":"My budujemy miasto.","N":"Zaimek osobowy + imiesłów = czas teraźniejszy (czynność trwająca). אֲנַחְנָה „my” (hebr. אֲנַחְנוּ). בָּנַיִן – G imiesłów czynny m. l.mn. od בנה (III-י; końcówka -īn zamiast hebr. -îm – nunacja). קִרְיְתָא – st. emf. od קִרְיָה „miasto”.","R":"Greenspahn 4,1"},{"k":"A","n":2,"A":"סָפְרָא שְׁלַח אִגַּרְתָּא דָּךְ׃","T":"sāprā šəlaḥ ʾiggartā dāk","P":"Pisarz wysłał tamten list.","N":"Szyk S–V–O. דָּךְ – zaimek wskazujący (odległy) r. ż. l.poj., zgodny z אִגַּרְתָּא (r. ż.); stoi po rzeczowniku w st. emf. ד < *ḏ (por. hebr. זֶה / זוֹ).","R":"Greenspahn 4,2"},{"k":"A","n":3,"A":"תְּהַשְׁכַּח אֱלָהָא בִּירוּשְׁלֶם מָרָדְתָּא׃","T":"təhaškaḥ ʾĕlāhā bîrûšəlem mārādtā","P":"Znajdziesz Boga w buntowniczej Jerozolimie.","N":"תְּהַשְׁכַּח – H (hafʿel) imperf. 2 m. l.poj. od שׁכח „znaleźć” (hebr. שָׁכַח znaczy „zapomnieć” – fałszywy przyjaciel; hebr. odpowiednik: מָצָא). Podmiot „ty” zawarty w formie. בִּירוּשְׁלֶם – בְּ + יְרוּשְׁלֶם (bə + yə > bî). מָרָדְתָּא – przymiotnik r. ż., st. emf., odnosi się do Jerozolimy (miasta są rodzaju żeńskiego).","R":"Greenspahn 4,3"},{"k":"A","n":4,"A":"לָא אִיתַי חֲלָק לְהוֹם בַּעֲבַר־נַהֲרָה׃","T":"lā ʾîtay ḥălāq ləhôm baʿăbar-nahărâ","P":"Nie mają udziału w Zarzeczu (dosł. nie ma dla nich udziału w Zarzeczu).","N":"Po
