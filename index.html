<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Trener aramejskiego biblijnego: lekcje, słówka, fiszki, quizy i zdania (Greenspahn, wykład TSL I).">
<meta name="theme-color" content="#1E3C8A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%231E3C8A%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23E0B05A%22 font-family=%22serif%22%3E%D7%9B%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Trener aramejskiego biblijnego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@500;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+Hebrew:wght@400;500;600&display=swap">
<style>
/* Układ: wąska kolumna robocza (max 980px) pod lapisowym pasem nagłówka zakończonym „szkliwionymi cegłami” z Bramy Isztar. */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --sunk:#F5F6F9; --ink:#141A29; --muted:#4C566B; --line:#D4D9E2;
  --lapis:#1E3C8A; --lapis-ink:#FFFFFF; --lapis-soft:#E2E8F6; --gold:#A8761F; --gold-soft:#F4E9D3;
  --good:#2C7A4B; --good-soft:#E1F1E7; --bad:#B03E2C; --bad-soft:#F8E3DF;
  --f-display:"Brygada 1918", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-tr:"Gentium Book Plus", "Noto Serif", Georgia, serif;
  --f-he:"Noto Serif Hebrew", "SBL Hebrew", "Ezra SIL", "Times New Roman", serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#151D31; --sunk:#111829; --ink:#EEF0F6; --muted:#AAB3C8; --line:#26314B;
  --lapis:#223F8F; --lapis-ink:#F3F5FB; --lapis-soft:#1C2850; --gold:#E0B05A; --gold-soft:#372C17;
  --good:#6CC490; --good-soft:#163222; --bad:#EE8B77; --bad-soft:#3B1D18; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#151D31; --sunk:#111829; --ink:#EEF0F6; --muted:#AAB3C8; --line:#26314B;
  --lapis:#223F8F; --lapis-ink:#F3F5FB; --lapis-soft:#1C2850; --gold:#E0B05A; --gold-soft:#372C17;
  --good:#6CC490; --good-soft:#163222; --bad:#EE8B77; --bad-soft:#3B1D18; color-scheme:dark }
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.he{font-family:var(--f-he);direction:rtl;unicode-bidi:isolate;font-size:1.28em;line-height:1.75;font-weight:500}
.tr{font-family:var(--f-tr);font-style:italic;letter-spacing:.01em}
.muted{color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* nagłówek */
.top{background:var(--lapis);color:var(--lapis-ink);position:relative}
.top::after{content:"";display:block;height:8px;background:
  repeating-linear-gradient(90deg,var(--gold) 0 26px,transparent 26px 30px),var(--lapis);opacity:.95}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit}
.brand .he{font-size:28px;line-height:1;color:var(--lapis-ink)}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-size:12px;opacity:.8;font-weight:400}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main button{background:transparent;border:1px solid transparent;color:var(--lapis-ink);padding:8px 13px;border-radius:999px;cursor:pointer;font-size:15px;opacity:.9;min-height:40px}
nav.main button:hover{opacity:1;border-color:rgba(255,255,255,.35)}
nav.main button[aria-current="true"]{background:rgba(255,255,255,.16);opacity:1;border-color:rgba(255,255,255,.4)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#1A1406;font-size:11px;font-weight:600;line-height:18px;text-align:center;margin-left:4px}

main{padding-block:22px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.2}
h2{font-size:21px}
h3{font-size:16px}
.eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;min-height:44px;border-radius:9px;cursor:pointer;font-weight:500;font-size:15px}
.btn:hover{border-color:var(--lapis)}
.btn.primary{background:var(--lapis);color:var(--lapis-ink);border-color:var(--lapis)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}

/* strona główna */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:stretch}
.hero .intro p{margin:6px 0 0;max-width:60ch;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat>span{display:block;font-size:13px;line-height:1.3;color:var(--muted);margin-top:2px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:14px}
.lcard{display:grid;grid-template-columns:44px 1fr;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;align-items:start}
.lcard:hover{border-color:var(--lapis)}
.lnum{width:44px;height:44px;border-radius:8px;background:var(--lapis-soft);color:var(--lapis);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
:root[data-theme="dark"] .lnum{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lnum{color:var(--ink)}}
.lcard.done .lnum{background:var(--gold-soft);color:var(--gold)}
.lcard .lbody{min-width:0;display:block}
.lcard .lt{display:block;font-family:var(--f-display);font-weight:700;font-size:16.5px;line-height:1.3;text-wrap:balance}
.lcard .meta{display:block}
.lcard .bar{display:block}
.lcard .meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.bar{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
button.chip{cursor:pointer}
button.chip.proc{background:var(--gold-soft);color:var(--ink);border-color:transparent}

/* lekcja */
.lhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.lhead .lnum{width:56px;height:56px;font-size:20px}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:14px;margin-bottom:10px}
.back:hover{color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;cursor:pointer;font-weight:600;font-size:16px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.gblock{margin-bottom:18px}
.gblock h3{margin-bottom:6px;color:var(--lapis)}
:root[data-theme="dark"] .gblock h3{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gblock h3{color:var(--gold)}}
.gblock p{margin:0;max-width:72ch}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:12px;color:var(--muted)}
tr:last-child td{border-bottom:0}
td .he{font-size:1.4em}

/* słówka: dwie formy (aram. | hebr.) – każda z transliteracją pod spodem – oraz znaczenie */
.vlist{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.forms{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-right:1px solid var(--line)}
.form{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:2px;padding:12px 10px 14px;min-width:0}
.form+.form{border-left:1px dashed var(--line)}
.form .lab{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.form .w{display:block;max-width:100%;overflow-wrap:anywhere;line-height:1.5}
.form.ar .w{font-size:36px;font-weight:600}
.form.hb .w{font-size:29px}
.form .tr{display:block;font-size:16.5px;line-height:1.35;margin-top:2px;overflow-wrap:anywhere}
.form.ar .tr{color:var(--ink)}
.form.hb .tr{color:var(--muted)}
.form .none{font-size:22px;color:var(--muted);padding:6px 0}
.vrow .pl{padding:12px 16px 14px;min-width:0}
.vrow .pl .mean{font-size:18px;font-weight:600;line-height:1.35}
.vrow .note{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.5}
.lvl{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--gold)}
.procbox{margin-top:6px;font-size:15px;background:var(--gold-soft);border-radius:6px;padding:7px 10px}

/* fiszki */
.fc-wrap{max-width:560px;margin:0 auto}
.fc{perspective:1200px;height:300px;cursor:pointer;margin:14px 0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;gap:6px;overflow:auto}
.fc-face.back{transform:rotateY(180deg);background:var(--sunk)}
.fc-face .big.he{font-size:54px;line-height:1.35}
.fc-face .big.pl{font-family:var(--f-display);font-size:28px}
.fc-face .hint{position:absolute;bottom:10px;font-size:12px;color:var(--muted)}
.fc-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:16px;align-items:baseline}
.fc-grid dt{color:var(--muted);font-size:13px}
.fc-grid dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 12px;min-height:42px;cursor:pointer;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lapis-soft);color:var(--ink);font-weight:600}
.answer-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (prefers-reduced-motion: reduce){.fc-in{transition:none}}

/* quiz */
.q-card{max-width:640px;margin:0 auto}
.q-prompt{font-size:19px;margin:10px 0 16px;line-height:1.5}
.q-prompt .he{font-size:1.75em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 16px;min-height:52px;cursor:pointer;font-size:17px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--lapis)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt .he{font-size:1.5em}
.feedback{margin-top:12px;padding:12px 14px;border-radius:9px;font-size:16px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap}
.progress-dots i{width:18px;height:5px;border-radius:3px;background:var(--line)}
.progress-dots i.ok{background:var(--good)}
.progress-dots i.no{background:var(--bad)}
.progress-dots i.cur{background:var(--gold)}
.score{font-family:var(--f-display);font-size:48px;font-variant-numeric:tabular-nums}

/* zdania */
.sent{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.sent .he.line{display:block;text-align:right;font-size:1.85em;line-height:1.85}
.sent .ref{font-size:13.5px;color:var(--muted)}
.sent .reveal{margin-top:8px;font-size:16px;border-top:1px dashed var(--line);padding-top:8px}
.sent .reveal p{margin:4px 0}
.builder{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.slot{min-height:56px;border:1px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:rtl;background:var(--sunk)}
.pool{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;margin-top:8px}
.tile{font-family:var(--f-he);font-weight:500;font-size:25px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 10px;cursor:pointer;line-height:1.7}
.tile:hover{border-color:var(--lapis)}
.tile.used{visibility:hidden}
.slot.ok{border-color:var(--good);background:var(--good-soft)}
.slot.no{border-color:var(--bad);background:var(--bad-soft)}

/* słowniczek, paradygmaty */
.search{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.par td .he{font-size:1.3em}
.par th:first-child,.par td.lab{position:sticky;left:0;z-index:1;background:var(--sunk)}
.par td.lab{background:var(--surface)}
.swipe{display:none;font-size:13.5px;color:var(--muted);margin:0 0 6px}
.par td.lab{white-space:nowrap;color:var(--muted);font-size:14px}
.sync{font-size:12px;color:var(--muted)}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:middle}
.sync.acc i{background:var(--good)}
textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kbd{font-size:12.5px;color:var(--muted)}

@media (max-width:720px){
  body{font-size:17px}
  .hero{grid-template-columns:1fr}
  .vrow{grid-template-columns:1fr}
  .forms{border-right:0;border-bottom:1px solid var(--line)}
  .form.ar .w{font-size:38px}
  .form.hb .w{font-size:30px}
  nav.main{margin-left:0;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  nav.main button{padding:8px 2px;font-size:14px}
  .badge{margin-left:2px}
  .top .wrap{padding-block:10px 12px;gap:10px}
  .lhead{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px}
  .lhead>.row{grid-column:1 / -1}
  .lhead>.row .btn{flex:1}
  .swipe{display:block}
  .hide-touch{display:none}
  .fc{height:360px}
  .fc-face .big.he{font-size:48px}
  h1{font-size:25px}
  .tabs button{padding:11px 12px}
  .lhead .row .btn{padding:8px 10px}
}
@media (max-width:420px){
  .stats{grid-template-columns:1fr 1fr 1fr}
  .stat b{font-size:21px}
  .answer-row{grid-template-columns:1fr 1fr 1fr}
  .answer-row .btn{padding:8px 4px}
  .form{padding:10px 6px 12px}
  .brand small{display:none}
}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <button class="brand" id="brand" type="button"><span class="he">כְּתָב</span><span><b>Trener aramejskiego</b><small>Greenspahn · wykład TSL I</small></span></button>
    <nav class="main" id="nav" aria-label="Sekcje">
      <button type="button" data-go="home">Lekcje</button>
      <button type="button" data-go="review">Powtórka<span class="badge" id="dueBadge" hidden>0</span></button>
      <button type="button" data-go="par">Paradygmaty</button>
      <button type="button" data-go="gloss">Słowniczek</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
const LESSONS=[];
function L(o){LESSONS.push(o)}
const PROC={
 K:{n:'Przekształcenie kananejskie',s:'ā > ō',d:'Hebrajski (język kananejski) zmienił długie ā w ō. Aramejski zachował ā: שְׁלָם – שָׁלוֹם, טָב – טוֹב.'},
 R:{n:'Redukcja pretoniczna',s:'aram. ə : hebr. ā',d:'Krótka samogłoska tuż przed akcentem w aramejskim redukuje się do szwy, w hebrajskim wydłuża się: כְּתַב – כָּתַב.'},
 T:{n:'*ṯ: aram. ת – hebr. שׁ',s:'ת ~ שׁ',d:'Prasemickie ṯ (jak „th” w ang. thin) dało w hebrajskim שׁ, w aramejskim ת: יְתִב – יָשַׁב.'},
 D:{n:'*ḏ: aram. ד – hebr. ז',s:'ד ~ ז',d:'Prasemickie ḏ (jak „th” w ang. this) dało w hebrajskim ז, w aramejskim ד: דְּהַב – זָהָב.'},
 TT:{n:'*ṯ̣/ẓ: aram. ט – hebr. צ',s:'ט ~ צ',d:'Emfatyczne ṯ̣ dało w hebrajskim צ, w aramejskim ט: קַיִט – קַיִץ.'},
 A:{n:'*ḍ: aram. ע (ק) – hebr. צ',s:'ע ~ צ',d:'Emfatyczne ḍ dało w hebrajskim צ, w aramejskim ע (dawniej ק): אַרְעָא / אַרְקָא – אֶרֶץ.'},
 P:{n:'Alef prostetyczny',s:'+א',d:'Dodatkowy alef na początku wyrazu w jednym z języków: אֲחִידָה – חִידָה, חַד – אֶחָד.'},
 S:{n:'Wzór segolowy',s:'CəCVC : CeCeC',d:'Hebrajskie rzeczowniki typu מֶלֶךְ mają dwie krótkie samogłoski; aramejskie mają pełną samogłoskę tylko w sylabie akcentowanej (כְּסַף – כֶּסֶף), a pierwotny wzór wraca z sufiksem (כַּסְפָּא).'},
 NM:{n:'Nunacja',s:'-īn : -îm',d:'Aramejska l.mn. męska kończy się na -īn (nun), hebrajska na -îm (mem). Także w zaimkach i czasownikach: אִנּוּן, יִכְתְּבוּן.'},

L({id:5, ch:'5', title:'Samogłoski', read:'Ezd 4,17–24',
g:[
 {h:'Szwa złożona poza gardłowymi', p:'W aramejskim chatef pojawia się nie tylko pod gardłowymi, ale też pod ק i ג oraz przed ל, נ, ר: צִפֲּרִין „ptaki”, גֲּלִי „został objawiony”, סְגַר „zamknął”.'},
 {h:'A. Przekształcenie kananejskie (ā > ō)', p:'W hebrajskim długie ā często przeszło w ō; aramejski zachował ā. שָׁלוֹם – שְׁלָם, דּוֹר – דָּר, טוֹב – טָב, לֹא – לָא, עוֹלָם – עָלַם, קוֹל – קָל, אֱנוֹשׁ – אֱנָשׁ.'},
 {h:'B. Redukcja pretoniczna', p:'Pierwotnie krótka samogłoska tuż przed akcentem w hebrajskim się wydłuża, w aramejskim redukuje się do szwy: hebr. שָׁלוֹם (šā-), aram. שְׁלָם (šə-); hebr. כָּתַב, aram. כְּתַב; hebr. נָהָר, aram. נְהַר.'},
 {h:'C. Rzeczowniki „segolowe”', p:'Hebrajskie wyrazy typu מֶלֶךְ mają dwie krótkie samogłoski. W aramejskim tylko sylaba akcentowana ma pełną samogłoskę: hebr. כֶּסֶף – aram. כְּסַף, hebr. צֶלֶם – aram. צְלֵם. Z sufiksem albo rodzajnikiem wraca pierwotny wzór: מַלְכָּא, כַּסְפָּא, פִּשְׁרֵהּ. Rozwój: *malk > *malek > מֶלֶךְ.'},
 {h:'Ketiw i qere', p:'Masoreci czasem zostawiają w tekście jedną formę spółgłoskową (ketiw), a wokalizują inną (qere), np. przy formach z sufiksami.'}
],

 {h:'I-n', p:'Nun asymiluje się, gdy ma szwę spoczywającą: יִפֵּל < *yinpēl. Imperatyw traci nun (פֻּק). Ale często zachodzi wtórna dysymilacja nosowa i nun pozostaje: יִנְתְּנוּן, הַנְפֵּק. Ta sama dysymilacja tworzy n w czasownikach bez nun: יִנְדַּע (od ידע), מַנְדַּע „rozum”.'},
 {h:'I-y i I-ʾ', p:'Prefiks + jod: asymilacja (יִנְדְּעוּן z dysymilacją) albo mater lectionis (יֵיטַב). W H jod przechodzi w waw: הוֹדַע (hebr. הוֹדִיעַ). Imperatyw bez jod (הַב „daj”). I-ʾ może przejść w jod (אֲתָה → הַיְתִי) lub stać się mater lectionis (יֵאמַר).'},
 {h:'Puste (II-w/y) i geminowane', p:'Puste mają budowę CVC: brak samogłoski rdzeniowej w G pf (קָם), obecna w impf (יְקוּם). Ptc: alef w miejscu II (קָאֵם). Geminowane bywają mocne (גֹּדּוּ) albo upodobnione (עַל < *ʿalal).'},
 {h:'III-h (III-y)', p:'W istocie CCV: dwie spółgłoski + samogłoska (najczęściej i), dlatego jod jako mater lectionis; ה na końcu to tylko znak dla ā. Końcówki: pf בְּנָה, 1 l.poj. בְּנֵית, 3 m. l.mn. בְּנוֹ; impf יִבְנֵא; ptc בָּנֵה, l.mn. בָּנַיִן.'}
],

L({id:23, ch:'23', title:'Składnia', read:'Dn 5,1–12',
g:[
 {h:'Szyk zdania', p:'Aramejski jest bardziej elastyczny niż hebrajski. Szyk wyjściowy VSO, ale częste są SVO i OV. Wysunięty na początek wyraz (casus pendens) bywa podjęty zaimkiem: מַלְכָּא זִיוֹהִי שְׁנוֹהִי „król – jego cera się zmieniła”. Pod wpływem akadyjskiego czasownik często stoi na końcu: חַמְרָא שָׁתֵה „wino pił”.'},
 {h:'Dopełnienie bliższe', p:'Zwykle wprowadzone przez לְ albo nieoznaczone. יָת (hebr. אֵת) tylko w Dn 3,12; częste w targumach.'},
 {h:'Zgoda przymiotnika', p:'Rzeczownik i przymiotnik zgadzają się w rodzaju i liczbie (choć końcówka morfologiczna nie zawsze jest ta sama). Przydawka – ten sam stan; orzecznik – nieokreślony. Zaimek wskazujący jako przydawka zwykle po rzeczowniku, jako orzecznik – przed nim.'},
 {h:'Formy opisowe', p:'אִיתַי oraz הוה jako spójka z imiesłowem są znacznie częstsze niż w hebrajskim: הֲוָא שָׁתֵה „pił”, הֲוֵית חָזֵה „patrzyłem”, אִיתֵיכוֹן פָּלְחִין „służycie”.'},
 {h:'Schemat narracji i dyskursu (P. Messina)', p:'W narracji pierwszy plan niesie qətal (perfectum) i x-qətal; tło – imiesłów, x-yiqtul i zdania imienne. W mowie zależnej przeszłość to x-qətal, teraźniejszość – imiesłów lub zdanie imienne, przyszłość – x-yiqtul, rozkaz – imperatyw i yiqtul krótki (wolitywny).'}
],

(function(){

const $=(s,r=document)=>r.querySelector(s);

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);

const strip=s=>s.normalize('NFD').replace(/[֑-ׇ̀-ͯ]/g,'').replace(/[ʾʿ]/g,'').replace(/ł/g,'l').replace(/Ł/g,'L').toLowerCase();

/* ---------- transliteracja automatyczna (zdania) ---------- */
const TC={'א':'ʾ','ב':'b','ג':'g','ד':'d','ה':'h','ו':'w','ז':'z','ח':'ḥ','ט':'ṭ','י':'y','כ':'k','ך':'k','ל':'l','מ':'m','ם':'m','נ':'n','ן':'n','ס':'s','ע':'ʿ','פ':'p','ף':'p','צ':'ṣ','ץ':'ṣ','ק':'q','ר':'r','ש':'š','ת':'t'};
const TV={'ֱ':'ĕ','ֲ':'ă','ֳ':'ŏ','ִ':'i','ֵ':'ē','ֶ':'e','ַ':'a','ָ':'ā','ֹ':'ō','ֺ':'ō','ֻ':'u'};

function translitWord(w){
  const U=[];

    const u=U[i];

function translit(s){
  return s.replace(/׃/g,'').split(/\s+/).map(w=>w.split('־').map((p,pi,arr)=>{
    if(pi<arr.length-1&&/כָּ?ל$/.test(p.replace(/[\u0591-\u05AF]/g,''))) return translitWord(p).replace(/kāl$/,'kol');
    if(/^כָ?ּ?ל$/.test(p.replace(/[ָּ]/g,''))&&/כָּל|כָל/.test(p)) return 'kol';
    return translitWord(p)}).join('-')).join(' ');
}

const KEY='aramTrainer.v1';
let P=blank();
function blank(){return{v:1,t:0,cards:{},quiz:{},sent:{},last:null,days:{}}}
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)P=Object.assign(blank(),o)}}catch(e){}}
let db=null,uid=null,saveTimer=null,saving=false,pending=false,syncMode='local';
function save(){
  P.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}
  if(db&&uid){clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1500)}
  updateBadge();
}
async function pushRemote(){
  if(saving){pending=true;return}
  saving=true;
  try{await db.doc('data/users/'+uid+'/progress').set(JSON.parse(JSON.stringify(P)))}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked')){db=null;syncMode='local';renderSync()}}
  saving=false;
  if(pending){pending=false;pushRemote()}
}
async function connectRemote(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    const snap=await d.doc('data/users/'+id+'/progress').get();
    db=d;uid=id;syncMode='account';
    if(snap.exists){const r=snap.data();if(r&&r.v===1&&(r.t||0)>(P.t||0)){P=Object.assign(blank(),JSON.parse(JSON.stringify(r)));try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){};route()}else if((P.t||0)>(r&&r.t||0)){pushRemote()}}
    else if(P.t){pushRemote()}
    renderSync();updateBadge();
  }catch(e){}
}
function renderSync(){const el=$('#sync');if(!el)return;el.className='sync'+(syncMode==='account'?' acc':'');el.innerHTML='<i></i>'+(syncMode==='account'?'Postępy zapisują się na Twoim koncie i są dostępne na innych urządzeniach.':'Postępy zapisują się w tej przeglądarce. Zrób kopię zapasową, żeby przenieść je gdzie indziej.')}
function card(id){return P.cards[id]}
function grade(id,ok){
  const c=P.cards[id]||{b:0,d:0,ok:0,no:0};
  if(ok){c.b=Math.min(c.b+1,5);c.ok++}else{c.b=0;c.no++}
  c.d=today()+INT[c.b];P.cards[id]=c;P.days[today()]=(P.days[today()]||0)+1;
}
function dueList(){const t=today();return ALLV.filter(v=>{const c=P.cards[v.id];return c&&c.d<=t})}
function known(v){const c=P.cards[v.id];return c&&c.b>=3}
function lessonPct(l){
  const k=l.V.filter(known).length/l.V.length;
  const q=(P.quiz[l.id]||0)/100;
  const s=l.S.length?l.S.filter(s=>P.sent[s.id]).length/l.S.length:1;
  return Math.round((k*.5+q*.3+s*.2)*100);
}

let deckKey=null;
function runDeck(area,list,onEnd,title){
  if(deckKey){document.removeEventListener('keydown',deckKey);deckKey=null}
  let q=shuffle(list);const total=q.length;let done=0,okN=0;const seen=new Set();
  const front=v=>fcMode==='pl'?`<div class="big pl">${esc(v.pl)}</div>`:`<div class="big he" lang="arc">${esc(v.ar)}</div>${fcMode==='he'?'<div class="muted">odpowiednik hebrajski?</div>':''}`;
  const backHTML=v=>`<div class="big he" lang="arc" style="font-size:46px;line-height:1.35">${esc(v.ar)}</div><div class="tr" style="font-size:18px">${esc(v.tr)}</div>
   <dl class="fc-grid"><dt>polski</dt><dd><b>${esc(v.pl)}</b></dd><dt>hebr.</dt><dd>${v.he&&v.he!=='—'?he(v.he):'—'} <span class="tr muted">${esc(v.htr)}</span></dd>
   ${v.tags.filter(t=>PROC[t]).length?`<dt>proces</dt><dd>${v.tags.filter(t=>PROC[t]).map(t=>esc(PROC[t].n)).join(', ')}</dd>`:''}
   ${v.note?`<dt>uwaga</dt><dd style="font-size:13px">${rich(v.note)}</dd>`:''}</dl>`;
  function show(){
    if(!q.length){area.innerHTML=`<div class="panel" style="margin-top:14px;text-align:center"><div class="score">${okN}/${total}</div><p>Za pierwszym razem rozpoznane. Nieznane słówka wrócą w powtórce już jutro.</p><button class="btn primary" type="button" id="again">Wróć</button></div>`;save();$('#again').onclick=onEnd;return}
    const v=q[0];
    area.innerHTML=`<div class="row" style="justify-content:space-between;margin-top:14px"><span class="muted">${done} / ${total}${title?' · '+esc(title):''}</span><span class="chip">lekcja ${esc(LBYID[v.lid].ch)}</span></div>
    <div class="fc" id="fc" tabindex="0" role="button" aria-label="Odwróć kartę"><div class="fc-in"><div class="fc-face">${front(v)}<span class="hint">Kliknij lub naciśnij spację, aby odwrócić</span></div><div class="fc-face back">${backHTML(v)}</div></div></div>
    <div class="answer-row"><button class="btn bad" type="button" data-a="0">Nie wiem</button><button class="btn" type="button" data-a="1">Trudne</button><button class="btn good" type="button" data-a="2">Wiem</button></div>
    <p class="kbd hide-touch" style="text-align:center">Klawisze: spacja – odwróć · 1 nie wiem · 2 trudne · 3 wiem</p>`;
    const fc=$('#fc',area);fc.onclick=()=>fc.classList.toggle('flip');
    area.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(+b.dataset.a));
  }
  function answer(a){
    const v=q.shift();
    const first=!seen.has(v.id);seen.add(v.id);
    if(a===2){grade(v.id,true);if(first)okN++;done++}
    else if(a===1){const c=P.cards[v.id]||{b:0,d:0,ok:0,no:0};c.d=today()+1;c.b=Math.max(1,Math.min(c.b,2));P.cards[v.id]=c;done++}
    else{grade(v.id,false);q.splice(Math.min(q.length,3),0,v)}
    save();show();
  }
  const key=e=>{if(!area.isConnected){document.removeEventListener('keydown',key);return}
    if(e.target.closest&&e.target.closest('input,textarea'))return;
    const fc=$('#fc',area);if(!fc)return;
    if(e.key===' '){e.preventDefault();fc.classList.toggle('flip')}
    else if(e.key==='1')answer(0);else if(e.key==='2')answer(1);else if(e.key==='3')answer(2)};
  deckKey=key;document.addEventListener('keydown',key);
  show();
}

/* ---------- quiz ---------- */
function buildQuiz(l){
  const Q=[];const pool=ALLV;
  const others=(v,f,n)=>pick(pool.filter(x=>x[f]!==v[f]&&x[f]&&x[f]!=='—'),n*3).filter((x,i,a)=>a.findIndex(y=>y[f]===x[f])===i).slice(0,n);
  const vs=shuffle(l.V);
  vs.slice(0,4).forEach(v=>{const ds=others(v,'pl',3);Q.push({kind:'v',vid:v.id,p:`Co znaczy ${he(v.ar)} <span class="tr muted">${esc(v.tr)}</span>?`,o:shuffle([v.pl,...ds.map(d=>d.pl)]),a:v.pl,ex:`${he(v.ar)} = ${esc(v.pl)}; hebr. ${he(v.he)}`})});
  vs.slice(4,7).forEach(v=>{const ds=others(v,'ar',3);Q.push({kind:'v',vid:v.id,he:true,p:`Jak po aramejsku: <b>${esc(v.pl)}</b>?`,o:shuffle([v.ar,...ds.map(d=>d.ar)]),a:v.ar,ex:`${he(v.ar)} <span class="tr">${esc(v.tr)}</span>`})});
  vs.filter(v=>v.he&&v.he!=='—').slice(0,2).forEach(v=>{const ds=others(v,'he',3);Q.push({kind:'v',vid:v.id,he:true,p:`Hebrajski odpowiednik ${he(v.ar)} („${esc(v.pl)}”) to…`,o:shuffle([v.he,...ds.map(d=>d.he)]),a:v.he,ex:`${he(v.ar)} – ${he(v.he)} <span class="tr">${esc(v.htr)}</span>`+(v.tags.filter(t=>PROC[t]).length?'. '+v.tags.filter(t=>PROC[t]).map(t=>esc(PROC[t].n)).join(', ')+'.':'')})});
  const tagged=shuffle(l.V.filter(v=>v.tags.some(t=>PROC[t]&&!['LW'].includes(t))));
  tagged.slice(0,2).forEach(v=>{const t=v.tags.find(t=>PROC[t]&&t!=='LW');const ds=pick(Object.keys(PROC).filter(k=>!v.tags.includes(k)),3);Q.push({kind:'p',p:`Jaki proces lub zjawisko widać w parze ${he(v.ar)} – ${he(v.he)}?`,o:shuffle([PROC[t].n,...ds.map(k=>PROC[k].n)]),a:PROC[t].n,ex:rich(PROC[t].d)})});
  pick(l.S,2).forEach(s=>{const ds=pick(LESSONS.flatMap(x=>x.S).filter(x=>x.id!==s.id),3);Q.push({kind:'s',p:`Przetłumacz: ${he(s.ar)}`,o:shuffle([s.pl,...ds.map(d=>d.pl)]),a:s.pl,ex:rich(s.an)})});
  l.q.forEach(g=>Q.push({kind:'g',p:rich(g[0]),o:shuffle(g[1]),a:g[1][g[2]],ex:rich(g[3]||''),rich:true}));
  return shuffle(Q).slice(0,14);
}
function paneQuiz(pane,l){
  const Q=buildQuiz(l);let i=0,score=0;const res=[];const wrongV=[];
  function show(){
    if(i>=Q.length){const pct=Math.round(score/Q.length*100);const prev=P.quiz[l.id]||0;if(pct>prev)P.quiz[l.id]=pct;
      wrongV.forEach(id=>grade(id,false));save();
      pane.innerHTML=`<div class="q-card panel" style="text-align:center"><div class="eyebrow">Wynik</div><div class="score">${pct}%</div><p>${score} z ${Q.length} poprawnie. Najlepszy wynik w tej lekcji: ${Math.max(pct,prev)}%.</p>${wrongV.length?`<p class="muted">${wrongV.length} błędnie rozpoznanych słówek trafiło do jutrzejszej powtórki.</p>`:''}<div class="row" style="justify-content:center"><button class="btn primary" id="qa" type="button">Nowy quiz</button><button class="btn" id="qs" type="button">Przejdź do zdań</button></div></div>`;
      $('#qa').onclick=()=>paneQuiz(pane,l);$('#qs').onclick=()=>{view.tab='zdania';renderLesson()};return}
    const q=Q[i];
    pane.innerHTML=`<div class="q-card"><div class="row" style="justify-content:space-between"><div class="progress-dots">${Q.map((x,k)=>`<i class="${k<i?(res[k]?'ok':'no'):(k===i?'cur':'')}"></i>`).join('')}</div><span class="muted">${i+1} / ${Q.length}</span></div>
    <div class="q-prompt">${q.p}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt" type="button" data-k="${k}">${q.he?he(o):(q.rich?rich(o):rich(o))}</button>`).join('')}</div><div id="fb"></div></div>`;
    pane.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;const ok=q.o[k]===q.a;res[i]=ok;if(ok)score++;else if(q.vid)wrongV.push(q.vid);
      pane.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(q.o[j]===q.a)x.classList.add('ok');else if(j===k)x.classList.add('no')});
      $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'Dobrze.':'Niestety nie.'}</b> ${q.ex||''}</div><div class="row" style="margin-top:10px"><button class="btn primary" id="nx" type="button">${i+1<Q.length?'Dalej':'Zobacz wynik'}</button></div>`;
      const nx=$('#nx');nx.focus();nx.onclick=()=>{i++;show()};
    });
  }
  show();
}

/* ---------- zdania ---------- */
function paneSent(pane,l){
  pane.innerHTML=`<p class="muted" style="margin-top:0">Przeczytaj zdanie na głos, spróbuj je przetłumaczyć, a potem odsłoń transliterację i analizę. „Ułóż zdanie” sprawdza, czy pamiętasz szyk. Transliteracja zdań jest generowana automatycznie (uproszczona).</p>
  <div class="stack">${l.S.map((s,k)=>`<div class="sent" data-k="${k}">
   <div class="row" style="justify-content:space-between"><span class="ref">${esc(s.ref)}</span>${P.sent[s.id]?'<span class="chip ok">ułożone</span>':''}</div>
   <span class="he line" lang="arc">${esc(s.ar)}</span>
   <div class="row" style="margin-top:6px"><button class="btn ghost" type="button" data-act="tr">Transliteracja</button><button class="btn ghost" type="button" data-act="pl">Tłumaczenie i analiza</button><button class="btn" type="button" data-act="build">Ułóż zdanie</button></div>
   <div class="reveal" data-r="tr" hidden><p class="tr">${esc(s.tr)}</p></div>
   <div class="reveal" data-r="pl" hidden><p><b>${esc(s.pl)}</b></p><p class="muted">${rich(s.an)}</p></div>
   <div class="bld"></div></div>`).join('')}</div>`;
  pane.querySelectorAll('.sent').forEach(el=>{
    const s=l.S[+el.dataset.k];
    el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
      const a=b.dataset.act;
      if(a==='build'){builder(el.querySelector('.bld'),s,()=>paneSent(pane,l));return}
      const r=el.querySelector(`[data-r="${a}"]`);r.hidden=!r.hidden;
    });
  });
}
function builder(box,s,onDone){
  if(box.innerHTML){box.innerHTML='';return}
  const words=s.ar.split(/\s+/);const ids=words.map((w,i)=>i);
  let order=shuffle(ids);if(words.length>1)while(order.every((x,i)=>x===i))order=shuffle(ids);
  const picked=[];
  box.innerHTML=`<div class="builder"><p style="margin:0 0 6px"><b>${esc(s.pl)}</b></p><div class="slot" id="slot" aria-label="Twoje zdanie"></div><div class="pool">${order.map(i=>`<button class="tile" type="button" data-i="${i}" lang="arc">${esc(words[i])}</button>`).join('')}</div>
  <div class="row" style="margin-top:8px"><button class="btn primary" type="button" data-b="chk">Sprawdź</button><button class="btn ghost" type="button" data-b="clr">Wyczyść</button><span class="msg muted"></span></div></div>`;
  const slot=box.querySelector('.slot'),msg=box.querySelector('.msg');
  const draw=()=>{slot.className='slot';slot.innerHTML=picked.map((i,k)=>`<button class="tile" type="button" data-k="${k}" lang="arc">${esc(words[i])}</button>`).join('');
    slot.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const i=picked.splice(+t.dataset.k,1)[0];box.querySelector(`.pool [data-i="${i}"]`).classList.remove('used');draw()})};
  box.querySelectorAll('.pool .tile').forEach(t=>t.onclick=()=>{if(t.classList.contains('used'))return;t.classList.add('used');picked.push(+t.dataset.i);draw()});
  box.querySelector('[data-b="clr"]').onclick=()=>{picked.length=0;box.querySelectorAll('.pool .tile').forEach(t=>t.classList.remove('used'));draw();msg.textContent=''};
  box.querySelector('[data-b="chk"]').onclick=()=>{
    if(picked.length<words.length){msg.textContent='Użyj wszystkich słów.';return}
    const ok=picked.every((i,k)=>words[i]===words[k]);
    slot.classList.add(ok?'ok':'no');
    if(ok){msg.textContent='Dobrze!';P.sent[s.id]=true;save();setTimeout(onDone,900)}
    else{const firstBad=picked.findIndex((i,k)=>words[i]!==words[k]);msg.textContent='Jeszcze nie. Pierwsze '+firstBad+' słów jest na miejscu.'}
  };
}

/* ---------- powtórka ---------- */

  <p class="muted" style="max-width:62ch">Tu trafiają słówka ze wszystkich lekcji, które już ćwiczyłeś i których termin powtórki minął. Odstępy rosną z każdą poprawną odpowiedzią: 1, 3, 7, 16, 35 dni.</p>
  <div class="row"><div class="seg" role="group" aria-label="Kierunek">${[['ar','aram. → pol.'],['pl','pol. → aram.'],['he','aram. → hebr.']].map(m=>`<button type="button" data-m="${m[0]}" aria-pressed="${fcMode===m[0]}">${m[1]}</button>`).join('')}</div></div>
  <div id="rv">${due.length?`<div class="row" style="margin-top:12px"><button class="btn primary" id="st" type="button">Zacznij (${due.length})</button></div>`:`<div class="empty panel" style="margin-top:14px">Na dziś nie ma nic do powtórki. Otwórz lekcję i poćwicz fiszki, żeby dodać słówka.</div>`}</div>`;

  if($('#st'))$('#st').onclick=()=>runDeck($('#rv'),due.slice(0,40),renderReview,'powtórka');
}

/* ---------- paradygmaty ---------- */
let parTab='pf';
function renderPar(){
  const T=PARAD;
  const tabs=[['pf','Perfectum'],['impf','Imperfectum'],['ptc','Imiesłowy'],['imv','Imperatyw i bezok.'],['nom','Rzeczownik i zaimki'],['drill','Ćwiczenie']];
  let body='';
  if(parTab==='pf'||parTab==='impf'){
    const M=T[parTab];
    body=`<p class="muted">Czasownik wzorcowy כתב „pisać”. W perfectum aram. 2 m. l.poj. ma też formę hebraizującą ־תָּ.</p><p class="swipe">Przesuń tabelę palcem w bok, żeby zobaczyć kolejne koniugacje.</p><div class="tbl par"><table><thead><tr><th>Osoba</th>${T.stems.map(s=>`<th>${esc(s)}</th>`).join('')}</tr></thead><tbody>${PERS.map((p,i)=>`<tr><td class="lab">${p}</td>${M.map(col=>`<td>${he(col[i])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  } else if(parTab==='ptc'){
    body=`<div class="tbl par"><table><thead><tr><th></th>${T.ptcLab.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${T.ptc.map(r=>`<tr><td class="lab">${r[0]}</td>${r.slice(1).map(f=>`<td>${he(f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted">Hebr. G czynny כֹּתֵב (ō < ā), bierny כָּתוּב; aram. zachowuje ā i ma wzór qətîl.</p>`;
  } else if(parTab==='imv'){
    body=`<div class="tbl par"><table><thead><tr><th></th>${T.ptcLab.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${T.imv.map(r=>`<tr><td class="lab">${r[0]}</td>${r.slice(1).map(f=>`<td>${he(f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <h3 style="margin:18px 0 8px">Bezokolicznik</h3><div class="tbl par"><table><tbody>${T.inf.map(r=>`<tr><td class="lab">${r[0]}</td><td>${he(r[1])}</td><td class="tr muted">${esc(translit(r[1]))}</td></tr>`).join('')}</tbody></table></div><p class="muted">G ma prefiks מ־ (zwykle z לְ): לְמִכְתַּב; hebr. לִכְתֹּב.</p>`;
  } else if(parTab==='nom'){
    body=`<h3 style="margin-bottom:8px">Stany rzeczownika</h3><div class="tbl par"><table><thead><tr><th></th><th>Absolutus</th><th>Constructus</th><th>Determinatus</th></tr></thead><tbody>${T.noun.map(r=>`<tr><td class="lab">${r[0]}</td>${r.slice(1).map(f=>`<td>${he(f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <h3 style="margin:18px 0 8px">Zaimki osobowe</h3><div class="tbl par"><table><thead><tr><th>Osoba</th><th>Aramejski</th><th>Hebrajski</th></tr></thead><tbody>${T.pron.map(r=>`<tr><td class="lab">${r[0]}</td><td>${rich(r[1])}</td><td>${rich(r[2])}</td></tr>`).join('')}</tbody></table></div>
    <h3 style="margin:18px 0 8px">Sufiksy dzierżawcze</h3><div class="tbl par"><table><thead><tr><th>Osoba</th><th>przy l.poj. („mój król”)</th><th>przy l.mn. („moi królowie”)</th></tr></thead><tbody>${T.sufS.map((r,i)=>`<tr><td class="lab">${r[0]}</td><td>${he(r[1])}</td><td>${he(T.sufP[i][1])}</td></tr>`).join('')}</tbody></table></div>`;
  }
  app.innerHTML=`<div class="eyebrow">Tabele odmiany</div><h1>Paradygmaty</h1>
  <div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" type="button" data-pt="${t[0]}" aria-selected="${parTab===t[0]}">${t[1]}</button>`).join('')}</div><div id="parBody">${body}</div>`;
  app.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{parTab=b.dataset.pt;renderPar()});
  if(parTab==='drill')parDrill($('#parBody'));
}
function parForms(){
  const F={};const add=(f,lab)=>{(F[f]=F[f]||[]).push(lab)};
  ['pf','impf'].forEach(t=>PARAD[t].forEach((col,s)=>col.forEach((f,i)=>add(f,`${PARAD.short[s]} ${t==='pf'?'pf':'impf'} ${PERS[i]}`))));
  PARAD.ptc.forEach(r=>r.slice(1).forEach((f,i)=>add(f,`ptc ${r[0]} ${PARAD.ptcLab[i]}`)));
  PARAD.imv.forEach(r=>r.slice(1).forEach((f,i)=>add(f,`${r[0]} imv ${PARAD.ptcLab[i]}`)));
  PARAD.inf.forEach(r=>add(r[1],`${r[0]} bezok.`));
  return Object.entries(F).map(([f,l])=>({f,lab:l.join(' / ')}));
}
function parDrill(box){
  const all=parForms();const Q=pick(all,10);let i=0,score=0;
  function show(){
    if(i>=Q.length){box.innerHTML=`<div class="q-card panel" style="text-align:center"><div class="score">${score}/${Q.length}</div><p>Rozpoznane formy.</p><button class="btn primary" type="button" id="ag">Jeszcze raz</button></div>`;$('#ag').onclick=()=>parDrill(box);return}
    const q=Q[i];
    const sameStemPrefix=q.lab.split(' ')[0];
    const ds=shuffle(all.filter(x=>x.lab!==q.lab)).sort((a,b)=>(b.lab.startsWith(sameStemPrefix)?1:0)-(a.lab.startsWith(sameStemPrefix)?1:0)).slice(0,6);
    const opts=shuffle([q.lab,...pick(ds,3).map(d=>d.lab)]);
    box.innerHTML=`<div class="q-card"><div class="row" style="justify-content:space-between"><span class="eyebrow">Określ formę</span><span class="muted">${i+1} / ${Q.length}</span></div>
     <div class="q-prompt" style="text-align:center">${he(q.f)}<div class="tr muted">${esc(translit(q.f))}</div></div>
     <div class="opts">${opts.map((o,k)=>`<button class="opt" type="button" data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;const ok=opts[k]===q.lab;if(ok)score++;
      box.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(opts[j]===q.lab)x.classList.add('ok');else if(j===k)x.classList.add('no')});
      $('#fb',box).innerHTML=`<div class="row" style="margin-top:10px"><button class="btn primary" id="nx" type="button">Dalej</button></div>`;const nx=$('#nx',box);nx.focus();nx.onclick=()=>{i++;show()}});
  }
  show();
}

  <input class="search" id="gq" type="search" placeholder="Szukaj po polsku, aramejsku, hebrajsku lub w transliteracji" value="${esc(glossQ)}" style="margin:14px 0" aria-label="Szukaj">
