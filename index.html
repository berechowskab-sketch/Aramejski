const TC={'א':'ʾ','ב':'b','ג':'g','ד':'d','ה':'h','ו':'w','ז':'z','ח':'ḥ','ט':'ṭ','י':'y','כ':'k','ך':'k','ל':'l','מ':'m','ם':'m','נ':'n','ן':'n','ס':'s','ע':'ʿ','פ':'p','ף':'p','צ':'ṣ','ץ':'ṣ','ק':'q','ר':'r','ש':'š','ת':'t'};
const TV={'ֱ':'ĕ','ֲ':'ă','ֳ':'ŏ','ִ':'i','ֵ':'ē','ֶ':'e','ַ':'a','ָ':'ā','ֹ':'ō','ֺ':'ō','ֻ':'u'};
const LONG=/[āēīōūâêîôû]$/;
function translitWord(w){
  const U=[];
  for(const ch of w){
    if(TC[ch]!==undefined){U.push({c:ch,m:''})}
    else if(U.length&&/[֑-ׇ]/.test(ch)){U[U.length-1].m+=ch}
    else U.push({c:ch,m:'',raw:true});
  }
  let out='';let prevV=null;let prevShevaSilent=false;
  const n=U.length;
  for(let i=0;i<n;i++){
    const u=U[i];
    if(u.raw){out+=u.c==='־'?'-':(u.c==='׃'?'':u.c);prevV=null;continue}
    const m=u.m, dag=m.includes('ּ'), sheva=m.includes('ְ');
    let v=null;for(const k in TV) if(m.includes(k)) v=TV[k];
    const last=(i===n-1)||U[i+1].raw;
    const prevHasVowel=prevV&&prevV!=='';
    // waw z holamem / szurek
    if(u.c==='ו'&&!v&&!sheva&&m.includes('ֹ')===false&&dag&&(i===0||!prevHasVowel)){out+=(i===0?'û':'û');prevV='û';prevShevaSilent=false;continue}
    if(u.c==='ו'&&(m.includes('ֹ')||m.includes('ֺ'))&&!m.match(/[ְ-ָֻ]/)&&i>0&&!prevHasVowel){out+='ô';prevV='ô';prevShevaSilent=false;continue}
    // mater lectionis
    if(u.c==='י'&&!m&&i>0&&(prevV==='i'||prevV==='ē')&&!(U[i+1]&&!U[i+1].raw&&/[ְ-ֻ]/.test(U[i+1].m)&&false)){
      out=out.slice(0,-1)+(prevV==='i'?'î':'ê');prevV=prevV==='i'?'î':'ê';continue}
    if(u.c==='א'&&!m&&i>0){continue}
    if(u.c==='ה'&&!m&&last&&i>0){const lc=out.slice(-1);const map={'ā':'â','ē':'ê','ō':'ô'};if(map[lc])out=out.slice(0,-1)+map[lc];else if(lc==='e')out+='h';else out+='h';continue}
    let cons=TC[u.c];
    if(u.c==='ש') cons=m.includes('ׂ')?'ś':'š';
    if(u.c==='ה'&&dag) cons='h';
    const forte=dag&&i>0&&prevHasVowel&&prevV!=='ə'&&!(u.c==='ה'&&last)&&u.c!=='ו';
    if(forte){cons=cons+cons;if(out.endsWith('ō'))out=out.slice(0,-1)+'o'}
    const nx=U[i+1];const nextLene=nx&&!nx.raw&&/[בגדכפת]/.test(nx.c)&&nx.m.includes('ּ');
    // patach furtivum
    if(last&&v==='a'&&(u.c==='ח'||u.c==='ע'||(u.c==='ה'&&dag))&&i>0&&LONG.test(out)){out+='a'+cons;prevV='a';continue}
    out+=cons;
    if(v){out+=v;prevV=v;prevShevaSilent=false}
    else if(sheva){
      const vocal=!last&&(i===0||forte||(!nextLene&&(prevShevaSilent||/[ēīōūêîôû]$/.test(prevV||''))));
      if(vocal){out+='ə';prevV='ə';prevShevaSilent=false}else{prevV='';prevShevaSilent=true}
    } else {prevV='';prevShevaSilent=true}
  }
  return out.replace(/ā([^aeiouāēīōūâêîôûəăĕŏ\s-]{1,2})ŏ/g,'o$1ŏ');
}
function translit(s){
  return s.replace(/׃/g,'').split(/\s+/).map(w=>w.split('־').map((p,pi,arr)=>{
    if(pi<arr.length-1&&/כָּ?ל$/.test(p.replace(/[\u0591-\u05AF]/g,''))) return translitWord(p).replace(/kāl$/,'kol');
    if(/^כָ?ּ?ל$/.test(p.replace(/[ָּ]/g,''))&&/כָּל|כָל/.test(p)) return 'kol';
    return translitWord(p)}).join('-')).join(' ');
}

/* ---------- dane pochodne ---------- */
const ALLV=[];
LESSONS.forEach(l=>{l.v.forEach((v,i)=>{const o={id:l.id+'-'+i,lid:l.id,ar:v[0],tr:v[1],he:v[2],htr:v[3],pl:v[4],tags:(v[5]||'').split(/\s+/).filter(Boolean),note:v[6]||''};l.V=l.V||[];l.V.push(o);ALLV.push(o)});
  l.S=(typeof SENT!=='undefined'&&SENT[l.id])?SENT[l.id].map(x=>({id:l.id+'-'+x.k+x.n,kind:x.k,ar:x.A,tr:x.T,pl:x.k==='A'?x.P:x.Q,en:x.E||'',ex:x.Z||'',an:x.N,ref:x.R})):
    l.s.map((s,i)=>({id:l.id+'-s'+i,kind:'A',ar:s[0],pl:s[1],an:s[2],ref:s[3]||'',tr:translit(s[0]),en:'',ex:''}));});
const VBYID=Object.fromEntries(ALLV.map(v=>[v.id,v]));
const LBYID=Object.fromEntries(LESSONS.map(l=>[l.id,l]));
const INT=[0,1,3,7,16,35];

/* ---------- postępy ---------- */
const KEY='aramTrainer.v1';
let P=blank();
function blank(){return{v:1,t:0,cards:{},quiz:{},sent:{},bible:{},last:null,days:{}}}
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)P=Object.assign(blank(),o)}}catch(e){}}
let db=null,uid=null,saveTimer=null,saving=false,pending=false,syncMode='local';
function save(){
  P.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}
  if(db&&uid){clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1500)}
  updateBadge();
}
async function pushRemote(){
  if(saving){pending=true;return}
  saving=true;
  try{await db.doc('data/users/'+uid+'/progress').set(JSON.parse(JSON.stringify(P)))}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked')){db=null;syncMode='local';renderSync()}}
  saving=false;
  if(pending){pending=false;pushRemote()}
}
async function connectRemote(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    const snap=await d.doc('data/users/'+id+'/progress').get();
    db=d;uid=id;syncMode='account';
    if(snap.exists){const r=snap.data();if(r&&r.v===1&&(r.t||0)>(P.t||0)){P=Object.assign(blank(),JSON.parse(JSON.stringify(r)));try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){};route()}else if((P.t||0)>(r&&r.t||0)){pushRemote()}}
    else if(P.t){pushRemote()}
    renderSync();updateBadge();
  }catch(e){}
}
function renderSync(){const el=$('#sync');if(!el)return;el.className='sync'+(syncMode==='account'?' acc':'');el.innerHTML='<i></i>'+(syncMode==='account'?'Postępy zapisują się na Twoim koncie i są dostępne na innych urządzeniach.':'Postępy zapisują się w tej przeglądarce. Zrób kopię zapasową, żeby przenieść je gdzie indziej.')}
function card(id){return P.cards[id]}
function grade(id,ok){
  const c=P.cards[id]||{b:0,d:0,ok:0,no:0};
  if(ok){c.b=Math.min(c.b+1,5);c.ok++}else{c.b=0;c.no++}
  c.d=today()+INT[c.b];P.cards[id]=c;P.days[today()]=(P.days[today()]||0)+1;
}
function dueList(){const t=today();return ALLV.filter(v=>{const c=P.cards[v.id];return c&&c.d<=t})}
function known(v){const c=P.cards[v.id];return c&&c.b>=3}
function lessonPct(l){
  const k=l.V.filter(known).length/l.V.length;
  const q=(P.quiz[l.id]||0)/100;
  const s=l.S.length?l.S.filter(s=>P.sent[s.id]).length/l.S.length:1;
  return Math.round((k*.5+q*.3+s*.2)*100);
}
function updateBadge(){const n=dueList().length;const b=$('#dueBadge');if(b){b.hidden=!n;b.textContent=n}}

/* ---------- nawigacja ---------- */
let view={name:'home'};
function go(name,arg){view=Object.assign({name},arg||{});route();window.scrollTo(0,0)}
function route(){
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===view.name||(view.name==='lesson'&&b.dataset.go==='home'))));
  if(view.name==='home')renderHome();
  else if(view.name==='lesson')renderLesson();
  else if(view.name==='review')renderReview();
  else if(view.name==='par')renderPar();
  else if(view.name==='gloss')renderGloss();
  else if(view.name==='report')renderReport();
  updateBadge();
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.go)});
$('#brand').addEventListener('click',()=>go('home'));

/* ---------- strona główna ---------- */
function renderHome(){
  const totalV=ALLV.length, knownV=ALLV.filter(known).length, due=dueList().length;
  const quizDone=LESSONS.filter(l=>(P.quiz[l.id]||0)>=80).length;
  const last=P.last&&LBYID[P.last];
  app.innerHTML=`
  <section class="hero">
    <div class="intro">
      <div class="eyebrow">Aramejski biblijny · Ezd i Dn</div>
      <h1>Ucz się lekcja po lekcji, porównując z hebrajskim</h1>
      <p>Każda lekcja odpowiada rozdziałowi podręcznika Greenspahna i części wykładu. Masz w niej gramatykę, słówka z odpowiednikami hebrajskimi, fiszki, quiz i zdania z Biblii.</p>
      <div class="row" style="margin-top:14px">
        ${last?`<button class="btn primary" data-open="${last.id}">Kontynuuj: lekcja ${esc(last.ch)}</button>`:`<button class="btn primary" data-open="${LESSONS[0].id}">Zacznij od lekcji 1</button>`}
        <button class="btn" data-go="review" ${due?'':'disabled'}>Powtórka (${due})</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>${knownV}<span class="muted" style="font-size:14px"> / ${totalV}</span></b><span>słówek opanowanych</span></div>
      <div class="stat"><b>${due}</b><span>do powtórki dziś</span></div>
      <div class="stat"><b>${quizDone}<span class="muted" style="font-size:14px"> / ${LESSONS.length}</span></b><span>quizów ≥ 80%</span></div>
    </div>
  </section>
  <h2 style="margin-top:28px">Lekcje</h2>
  <div class="lessons">${LESSONS.map(l=>{const p=lessonPct(l);return `
    <button class="lcard${p>=90?' done':''}" data-open="${l.id}" type="button">
      <span class="lnum">${esc(l.ch)}</span>
      <span class="lbody"><span class="lt">${esc(l.title)}</span><span class="meta">${esc(l.read)}</span>
      <span class="chips"><span class="chip">${l.V.length} słówek</span><span class="chip">${l.S.length} zdań</span>${P.quiz[l.id]!=null?`<span class="chip ok">quiz ${P.quiz[l.id]}%</span>`:''}${P.bible&&P.bible[l.id]?`<span class="chip ok">Biblia ✓</span>`:''}</span>
      <span class="bar" aria-label="Postęp ${p}%"><i style="width:${p}%"></i></span></span>
    </button>`}).join('')}</div>
  <section class="panel" style="margin-top:28px">
    <h3>Zapis postępów</h3>
    <p id="sync" class="sync" style="margin:6px 0 10px"></p>
    <div class="row">
      <button class="btn" id="exp" type="button">Pokaż kopię zapasową</button>
      <button class="btn" id="imp" type="button">Wczytaj kopię</button>
      <button class="btn ghost" id="rst" type="button">Wyzeruj postępy</button>
    </div>
    <div id="bk" style="margin-top:10px"></div>
  </section>`;
  renderSync();
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.open));

let deckKey=null;
function runDeck(area,list,onEnd,title){
  if(deckKey){document.removeEventListener('keydown',deckKey);deckKey=null}
  let q=shuffle(list);const total=q.length;let done=0,okN=0;const seen=new Set();
  const front=v=>fcMode==='pl'?`<div class="big pl">${esc(v.pl)}</div>`:`<div class="big he" lang="arc">${esc(v.ar)}</div>${fcMode==='he'?'<div class="muted">odpowiednik hebrajski?</div>':''}`;
  const backHTML=v=>`<div class="big he" lang="arc" style="font-size:46px;line-height:1.35">${esc(v.ar)}</div><div class="tr" style="font-size:18px">${esc(v.tr)}</div>
   <dl class="fc-grid"><dt>polski</dt><dd><b>${esc(v.pl)}</b></dd><dt>hebr.</dt><dd>${v.he&&v.he!=='—'?he(v.he):'—'} <span class="tr muted">${esc(v.htr)}</span></dd>
   ${v.tags.filter(t=>PROC[t]).length?`<dt>proces</dt><dd>${v.tags.filter(t=>PROC[t]).map(t=>esc(PROC[t].n)).join(', ')}</dd>`:''}
   ${v.note?`<dt>uwaga</dt><dd style="font-size:13px">${rich(v.note)}</dd>`:''}</dl>`;
  function show(){
    if(!q.length){area.innerHTML=`<div class="panel" style="margin-top:14px;text-align:center"><div class="score">${okN}/${total}</div><p>Za pierwszym razem rozpoznane. Nieznane słówka wrócą w powtórce już jutro.</p><button class="btn primary" type="button" id="again">Wróć</button></div>`;save();$('#again').onclick=onEnd;return}
    const v=q[0];
    area.innerHTML=`<div class="row" style="justify-content:space-between;margin-top:14px"><span class="muted">${done} / ${total}${title?' · '+esc(title):''}</span><span class="chip">lekcja ${esc(LBYID[v.lid].ch)}</span></div>
    <div class="fc" id="fc" tabindex="0" role="button" aria-label="Odwróć kartę"><div class="fc-in"><div class="fc-face">${front(v)}<span class="hint">Kliknij lub naciśnij spację, aby odwrócić</span></div><div class="fc-face back">${backHTML(v)}</div></div></div>
    <div class="answer-row"><button class="btn bad" type="button" data-a="0">Nie wiem</button><button class="btn" type="button" data-a="1">Trudne</button><button class="btn good" type="button" data-a="2">Wiem</button></div>
    <p class="kbd hide-touch" style="text-align:center">Klawisze: spacja – odwróć · 1 nie wiem · 2 trudne · 3 wiem</p>`;
    const fc=$('#fc',area);fc.onclick=()=>fc.classList.toggle('flip');
    area.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(+b.dataset.a));
  }
  function answer(a){
    const v=q.shift();
    const first=!seen.has(v.id);seen.add(v.id);
    if(a===2){grade(v.id,true);if(first)okN++;done++}
    else if(a===1){const c=P.cards[v.id]||{b:0,d:0,ok:0,no:0};c.d=today()+1;c.b=Math.max(1,Math.min(c.b,2));P.cards[v.id]=c;done++}
    else{grade(v.id,false);q.splice(Math.min(q.length,3),0,v)}
    save();show();
  }
  const key=e=>{if(!area.isConnected){document.removeEventListener('keydown',key);return}
    if(e.target.closest&&e.target.closest('input,textarea'))return;
    const fc=$('#fc',area);if(!fc)return;
    if(e.key===' '){e.preventDefault();fc.classList.toggle('flip')}
    else if(e.key==='1')answer(0);else if(e.key==='2')answer(1);else if(e.key==='3')answer(2)};
  deckKey=key;document.addEventListener('keydown',key);
  show();
}

/* ---------- quiz ---------- */
function buildQuiz(l){
  const Q=[];const pool=ALLV;
  const others=(v,f,n)=>pick(pool.filter(x=>x[f]!==v[f]&&x[f]&&x[f]!=='—'),n*3).filter((x,i,a)=>a.findIndex(y=>y[f]===x[f])===i).slice(0,n);
  const vs=shuffle(l.V);
  vs.slice(0,4).forEach(v=>{const ds=others(v,'pl',3);Q.push({kind:'v',vid:v.id,p:`Co znaczy ${he(v.ar)} <span class="tr muted">${esc(v.tr)}</span>?`,o:shuffle([v.pl,...ds.map(d=>d.pl)]),a:v.pl,ex:`${he(v.ar)} = ${esc(v.pl)}; hebr. ${he(v.he)}`})});
  vs.slice(4,7).forEach(v=>{const ds=others(v,'ar',3);Q.push({kind:'v',vid:v.id,he:true,p:`Jak po aramejsku: <b>${esc(v.pl)}</b>?`,o:shuffle([v.ar,...ds.map(d=>d.ar)]),a:v.ar,ex:`${he(v.ar)} <span class="tr">${esc(v.tr)}</span>`})});
  vs.filter(v=>v.he&&v.he!=='—').slice(0,2).forEach(v=>{const ds=others(v,'he',3);Q.push({kind:'v',vid:v.id,he:true,p:`Hebrajski odpowiednik ${he(v.ar)} („${esc(v.pl)}”) to…`,o:shuffle([v.he,...ds.map(d=>d.he)]),a:v.he,ex:`${he(v.ar)} – ${he(v.he)} <span class="tr">${esc(v.htr)}</span>`+(v.tags.filter(t=>PROC[t]).length?'. '+v.tags.filter(t=>PROC[t]).map(t=>esc(PROC[t].n)).join(', ')+'.':'')})});
  const tagged=shuffle(l.V.filter(v=>v.tags.some(t=>PROC[t]&&!['LW'].includes(t))));
  tagged.slice(0,2).forEach(v=>{const t=v.tags.find(t=>PROC[t]&&t!=='LW');const ds=pick(Object.keys(PROC).filter(k=>!v.tags.includes(k)),3);Q.push({kind:'p',p:`Jaki proces lub zjawisko widać w parze ${he(v.ar)} – ${he(v.he)}?`,o:shuffle([PROC[t].n,...ds.map(k=>PROC[k].n)]),a:PROC[t].n,ex:rich(PROC[t].d)})});
  pick(l.S,2).forEach(s=>{const ds=pick(LESSONS.flatMap(x=>x.S).filter(x=>x.id!==s.id),3);Q.push({kind:'s',p:`Przetłumacz: ${he(s.ar)}`,o:shuffle([s.pl,...ds.map(d=>d.pl)]),a:s.pl,ex:rich(s.an)})});
  l.q.forEach(g=>Q.push({kind:'g',p:rich(g[0]),o:shuffle(g[1]),a:g[1][g[2]],ex:rich(g[3]||''),rich:true}));
  return shuffle(Q).slice(0,14);
}
function paneQuiz(pane,l){
  const Q=buildQuiz(l);let i=0,score=0;const res=[];const wrongV=[];
  function show(){
    if(i>=Q.length){const pct=Math.round(score/Q.length*100);const prev=P.quiz[l.id]||0;if(pct>prev)P.quiz[l.id]=pct;
      wrongV.forEach(id=>grade(id,false));save();
      pane.innerHTML=`<div class="q-card panel" style="text-align:center"><div class="eyebrow">Wynik</div><div class="score">${pct}%</div><p>${score} z ${Q.length} poprawnie. Najlepszy wynik w tej lekcji: ${Math.max(pct,prev)}%.</p>${wrongV.length?`<p class="muted">${wrongV.length} błędnie rozpoznanych słówek trafiło do jutrzejszej powtórki.</p>`:''}<div class="row" style="justify-content:center"><button class="btn primary" id="qa" type="button">Nowy quiz</button><button class="btn" id="qs" type="button">Przejdź do zdań</button></div></div>`;
      $('#qa').onclick=()=>paneQuiz(pane,l);$('#qs').onclick=()=>{view.tab='zdania';renderLesson()};return}
    const q=Q[i];
    pane.innerHTML=`<div class="q-card"><div class="row" style="justify-content:space-between"><div class="progress-dots">${Q.map((x,k)=>`<i class="${k<i?(res[k]?'ok':'no'):(k===i?'cur':'')}"></i>`).join('')}</div><span class="muted">${i+1} / ${Q.length}</span></div>

function paneSent(pane,l){
  const A=l.S.map((s,k)=>[s,k]).filter(x=>x[0].kind!=='E'), E=l.S.map((s,k)=>[s,k]).filter(x=>x[0].kind==='E');

      if(a==='build'){builder(el.querySelector('.bld'),s,()=>paneSent(pane,l));return}

function builder(box,s,onDone){
  if(box.innerHTML){box.innerHTML='';return}
  const words=s.ar.split(/\s+/);const ids=words.map((w,i)=>i);
  let order=shuffle(ids);if(words.length>1)while(order.every((x,i)=>x===i))order=shuffle(ids);
  const picked=[];
  box.innerHTML=`<div class="builder"><p style="margin:0 0 6px"><b>${esc(s.pl)}</b></p><div class="slot" id="slot" aria-label="Twoje zdanie"></div><div class="pool">${order.map(i=>`<button class="tile" type="button" data-i="${i}" lang="arc">${esc(words[i])}</button>`).join('')}</div>
  <div class="row" style="margin-top:8px"><button class="btn primary" type="button" data-b="chk">Sprawdź</button><button class="btn ghost" type="button" data-b="clr">Wyczyść</button><span class="msg muted"></span></div></div>`;
  const slot=box.querySelector('.slot'),msg=box.querySelector('.msg');
  const draw=()=>{slot.className='slot';slot.innerHTML=picked.map((i,k)=>`<button class="tile" type="button" data-k="${k}" lang="arc">${esc(words[i])}</button>`).join('');
    slot.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const i=picked.splice(+t.dataset.k,1)[0];box.querySelector(`.pool [data-i="${i}"]`).classList.remove('used');draw()})};
  box.querySelectorAll('.pool .tile').forEach(t=>t.onclick=()=>{if(t.classList.contains('used'))return;t.classList.add('used');picked.push(+t.dataset.i);draw()});
  box.querySelector('[data-b="clr"]').onclick=()=>{picked.length=0;box.querySelectorAll('.pool .tile').forEach(t=>t.classList.remove('used'));draw();msg.textContent=''};
  box.querySelector('[data-b="chk"]').onclick=()=>{
    if(picked.length<words.length){msg.textContent='Użyj wszystkich słów.';return}
    const ok=picked.every((i,k)=>words[i]===words[k]);
    slot.classList.add(ok?'ok':'no');
    if(ok){msg.textContent='Dobrze!';P.sent[s.id]=true;save();setTimeout(onDone,900)}
    else{const firstBad=picked.findIndex((i,k)=>words[i]!==words[k]);msg.textContent='Jeszcze nie. Pierwsze '+firstBad+' słów jest na miejscu.'}
  };
}

function parForms(){
  const F={};const add=(f,lab)=>{(F[f]=F[f]||[]).push(lab)};
  ['pf','impf'].forEach(t=>PARAD[t].forEach((col,s)=>col.forEach((f,i)=>add(f,`${PARAD.short[s]} ${t==='pf'?'pf':'impf'} ${PERS[i]}`))));
  PARAD.ptc.forEach(r=>r.slice(1).forEach((f,i)=>add(f,`ptc ${r[0]} ${PARAD.ptcLab[i]}`)));
  PARAD.imv.forEach(r=>r.slice(1).forEach((f,i)=>add(f,`${r[0]} imv ${PARAD.ptcLab[i]}`)));
  PARAD.inf.forEach(r=>add(r[1],`${r[0]} bezok.`));
  return Object.entries(F).map(([f,l])=>({f,lab:l.join(' / ')}));
}
function parDrill(box){
  const all=parForms();const Q=pick(all,10);let i=0,score=0;
  function show(){
    if(i>=Q.length){box.innerHTML=`<div class="q-card panel" style="text-align:center"><div class="score">${score}/${Q.length}</div><p>Rozpoznane formy.</p><button class="btn primary" type="button" id="ag">Jeszcze raz</button></div>`;$('#ag').onclick=()=>parDrill(box);return}
    const q=Q[i];
    const sameStemPrefix=q.lab.split(' ')[0];
    const ds=shuffle(all.filter(x=>x.lab!==q.lab)).sort((a,b)=>(b.lab.startsWith(sameStemPrefix)?1:0)-(a.lab.startsWith(sameStemPrefix)?1:0)).slice(0,6);
    const opts=shuffle([q.lab,...pick(ds,3).map(d=>d.lab)]);
    box.innerHTML=`<div class="q-card"><div class="row" style="justify-content:space-between"><span class="eyebrow">Określ formę</span><span class="muted">${i+1} / ${Q.length}</span></div>
     <div class="q-prompt" style="text-align:center">${he(q.f)}<div class="tr muted">${esc(translit(q.f))}</div></div>
     <div class="opts">${opts.map((o,k)=>`<button class="opt" type="button" data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;const ok=opts[k]===q.lab;if(ok)score++;
      box.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(opts[j]===q.lab)x.classList.add('ok');else if(j===k)x.classList.add('no')});
      $('#fb',box).innerHTML=`<div class="row" style="margin-top:10px"><button class="btn primary" id="nx" type="button">Dalej</button></div>`;const nx=$('#nx',box);nx.focus();nx.onclick=()=>{i++;show()}});
  }
  show();
}

    <div class="row"><button class="btn primary" type="submit">${repDb?'Wyślij zgłoszenie':'Wyślij na GitHubie ↗'}</button><span class="muted" id="rmsg" role="status"></span></div>
  </form>
  <div class="row" style="justify-content:space-between;margin-top:26px"><h2>Twoje zgłoszenia</h2><span id="repcopy"></span></div>
  <p class="muted" id="repinfo" style="margin:4px 0 10px"></p>
  <div class="stack" id="replist"></div>`;
  const info=$('#repinfo');
  if(repDb){info.textContent='Zgłoszenia zapisują się przy trenerze. Napisz Claude’owi „sprawdź zgłoszenia”, a poprawi błędy i zaznaczy, co zrobił.'}
  else{info.innerHTML='Zgłoszenie otworzy się na GitHubie w nowej karcie (potrzebne jest darmowe konto GitHub). Tam kliknij zielony przycisk <b>Create</b>, żeby je wysłać. Kopia zostaje w tej przeglądarce – możesz ją też skopiować i wkleić w rozmowie z Claude’em.';
    $('#repcopy').innerHTML=repLocal.length?'<button class="btn" type="button" id="rcp">Kopiuj zgłoszenia</button>':'';
    const c=$('#rcp');if(c)c.onclick=()=>{const t=repLocal.map((r,i)=>`${i+1}. [${r.where||'—'}] ${r.what}${r.fix?' → '+r.fix:''}${r.src?' (źródło: '+r.src+')':''}`).join('\n');
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>c.textContent='Skopiowano').catch(()=>{c.textContent='Zaznacz i skopiuj ręcznie';const ta=document.createElement('textarea');ta.value=t;$('#replist').before(ta);ta.select()})}}
  drawRepList();
  $('#repf').onsubmit=async e=>{
    e.preventDefault();
    const r={where:$('#rwhere').value.trim(),what:$('#rwhat').value.trim(),fix:$('#rfix').value.trim(),src:$('#rsrc').value.trim(),status:'nowe',createdAt:Date.now()};
    const msg=$('#rmsg');if(!r.what){msg.textContent='Opisz, co jest źle.';$('#rwhat').focus();return}
    const clear=()=>{view.ctx='';['#rwhat','#rfix','#rsrc','#rwhere'].forEach(q=>$(q).value='')};
    if(!repDb){
      let w=null;try{w=window.open(ghURL(r),'_blank');if(w)w.opener=null}catch(err){}
      r.status='github';r.id='l'+Date.now();repLocal.push(r);saveLocalReps();
      renderReport();
      $('#rmsg').innerHTML=w?'Zgłoszenie otworzyło się w nowej karcie – kliknij tam <b>Create</b>, żeby je wysłać.':'Przeglądarka zablokowała nową kartę. '+ghLink(r,'Kliknij tutaj, aby otworzyć zgłoszenie na GitHubie ↗');
      return}
    const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;msg.textContent='Wysyłanie…';
    let ok=false;try{await repDb.collection('reports').add(r);ok=true}catch(err){ok=false}
    btn.disabled=false;
    if(ok){clear();msg.textContent='Dziękuję, zgłoszenie zapisane.';drawRepList()}
    else{r.status='github';r.id='l'+Date.now();repLocal.push(r);saveLocalReps();
      msg.innerHTML='Nie masz uprawnień do zapisu w tym trenerze. '+ghLink(r,'Wyślij to zgłoszenie na GitHubie ↗')}
  };
}

/* ---------- start ---------- */
loadLocal();
route();
setTimeout(repInit,1500);
connectRemote();
window.__T={translit,LESSONS,ALLV};
})();

</script>
